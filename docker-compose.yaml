# NiFi UI: https://localhost:8443/nifi
# NiFi Registry UI: http://localhost:18080/nifi-registry
# NiFi Registry UI: http://localhost:18080/nifi-registry
services:
    nifi:
        image: nifi-sample
        container_name: nifi-service
        restart: always
        ports:
            - 8443:8443/tcp
            - 8080:8080/tcp
        env_file: .env
        volumes:
            - "./aws_athena_jdbc.jar:/tmp/aws_athena_jdbc.jar"
            - "./aws_redshift_jdbc.jar:/tmp/aws_redshift_jdbc.jar"
            - "./mysql-connector-java-8.0.26.jar:/tmp/mysql-connector-java-8.0.26.jar"
            - "./mssql-jdbc-13.4.0.jre11.jar:/tmp/mssql-jdbc.jar"
            - nifi_conf:/opt/nifi/nifi-current/conf
            - nifi_content_repository:/opt/nifi/nifi-current/content_repository
            - nifi_database_repository:/opt/nifi/nifi-current/database_repository
            - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
            - nifi_logs:/opt/nifi/nifi-current/logs
            - nifi_nar_extensions:/opt/nifi/nifi-current/nar_extensions
            - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
            - nifi_python_extensions:/opt/nifi/nifi-current/python_extensions
            - nifi_state:/opt/nifi/nifi-current/state
        environment:
            - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USERNAME}
            - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
        networks:
            - nifi-network
    nifi-registry:
        image: apache/nifi-registry:2.9.0
        container_name: nifi-registry-service
        restart: always
        ports:
            - 18080:18080/tcp
        volumes:
            - nifi_registry_conf:/opt/nifi-registry/nifi-registry-current/conf
            - nifi_registry_database:/opt/nifi-registry/nifi-registry-current/database
            - nifi_registry_extension_bundles:/opt/nifi-registry/nifi-registry-current/extension_bundles
            - nifi_registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
            - nifi_registry_logs:/opt/nifi-registry/nifi-registry-current/logs
        networks:
            - nifi-network
networks:
    nifi-network:
volumes:
    nifi_conf:
    nifi_content_repository:
    nifi_database_repository:
    nifi_flowfile_repository:
    nifi_logs:
    nifi_nar_extensions:
    nifi_provenance_repository:
    nifi_python_extensions:
    nifi_state:
    nifi_registry_conf:
    nifi_registry_database:
    nifi_registry_extension_bundles:
    nifi_registry_flow_storage:
    nifi_registry_logs:
