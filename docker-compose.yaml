services:
    nifi:
        image: nifi-sample
        container_name: nifi-service
        restart: always
        ports:
            - 8443:8443/tcp
            - 8080:8080/tcp
        env_file: .env
        volumes:
            - "./aws_athena_jdbc.jar:/tmp/aws_athena_jdbc.jar"
            - "./aws_redshift_jdbc.jar:/tmp/aws_redshift_jdbc.jar"
            - "./mysql-connector-java-8.0.26.jar:/tmp/mysql-connector-java-8.0.26.jar"
        environment:
            - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USERNAME}
            - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
        networks:
            - nifi-network

    nifi-registry:
        image: apache/nifi-registry:2.9.0
        container_name: nifi-registry-service
        restart: always
        ports:
            - 18080:18080/tcp
        networks:
            - nifi-network
networks:
    nifi-network:
