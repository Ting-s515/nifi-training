    "file": "09-clustering.md",
    "title": "Lab 09：NiFi Cluster 入門與多節點執行觀念",
    "html": "<h1 id=\"lab-09-nifi-cluster-入門與多節點執行觀念\">Lab 09：NiFi Cluster 入門與多節點執行觀念</h1>\n<p>目標：理解 NiFi cluster 的基本運作方式，能判斷 Processor 在多節點環境中會不會重複執行，並知道 <code>Primary Node</code>、<code>All Nodes</code>、connection load balancing 與 cluster state 的用途。</p>\n<p>預估時間：45 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<p>本 Lab 會先在目前單節點 Docker 環境建立一條小流程，觀察 <code>Execution</code> 設定，再把同一條 flow 對照到公司 cluster 的多節點行為。</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    S[Scheduler] --&gt; G[GenerateFlowFile]\n    G -- success --&gt; U[UpdateAttribute]\n    U -- success --&gt; L[LogAttribute]\n    C[Cluster 設定] -. 影響 .-&gt; G\n    C -. 影響 .-&gt; U\n    C -. 影響 .-&gt; L</code></pre>\n<p>本機只有一個 NiFi node，所以不會真的看到多台機器同時處理資料；但你會學會在 UI 中檢查哪些設定到了公司 cluster 會改變行為。</p>\n<h2 id=\"官方確認的-cluster-概念\">官方確認的 Cluster 概念</h2>\n<p>NiFi cluster 是多個 NiFi node 共同提供同一套資料流。每個 node 執行同一份 flow，但各 node 有自己的 repository 與本機資源。</p>\n<p>重要名詞：</p>\n<table>\n<thead><tr><th>名詞</th><th>白話說明</th></tr></thead>\n<tbody>\n<tr><td><code>Node</code></td><td>cluster 裡的一台 NiFi instance</td></tr>\n<tr><td><code>Cluster Coordinator</code></td><td>負責協調 cluster 成員與連線狀態的 node</td></tr>\n<tr><td><code>Primary Node</code></td><td>被選為 primary 的 node，適合執行只應跑一次的排程</td></tr>\n<tr><td><code>Execution</code></td><td>Processor 在 cluster 中要跑在 <code>All Nodes</code> 還是 <code>Primary Node</code></td></tr>\n<tr><td><code>Load Balanced Connection</code></td><td>在 cluster 節點之間分配 queued FlowFiles</td></tr>\n<tr><td><code>Cluster State</code></td><td>給 Processor 保存 cluster-wide 狀態，避免每個 node 各自記錄造成重複處理</td></tr>\n</tbody>\n</table>\n<p>來源：</p>\n<ul>\n<li>https://nifi.apache.org/docs/nifi-docs/html/administration-guide.html</li>\n<li>https://nifi.apache.org/nifi-docs/user-guide.html</li>\n</ul>\n<h2 id=\"part-1-確認目前環境是單節點\">Part 1：確認目前環境是單節點</h2>\n<ol>\n<li>打開 NiFi UI：<code>https://localhost:8443/nifi</code>。</li>\n<li>打開右上角 <code>Global Menu</code>。</li>\n<li>進入 <code>Summary</code>。</li>\n<li>觀察是否有 cluster 或 node 相關資訊。</li>\n</ol>\n<p>也可以在 PowerShell 看目前只有一個 NiFi container：</p>\n<pre><code class=\"language-powershell\">docker compose ps</code></pre>\n<p>說明：目前課程環境是單節點 NiFi，適合練 UI 與 flow 設定，但不會真的出現多 node 分散處理。公司專案若是 cluster，看到的畫面會多出 node、cluster、primary node 等資訊。</p>\n<h2 id=\"part-2-建立-cluster-觀念練習-flow\">Part 2：建立 Cluster 觀念練習 Flow</h2>\n<p>建立新的 Process Group：<code>training-lab-09</code>。</p>\n<h3 id=\"step-1-新增-generateflowfile\">Step 1：新增 GenerateFlowFile</h3>\n<p>新增 Processor：<code>GenerateFlowFile</code>。</p>\n<p>設定 <code>Properties</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Custom Text</code></td><td><code>cluster execution test</code></td></tr>\n</tbody>\n</table>\n<p>設定 <code>Scheduling</code>：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Scheduling Strategy</code></td><td><code>Timer driven</code></td></tr>\n<tr><td><code>Run Schedule</code></td><td><code>60 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-2-新增-updateattribute\">Step 2：新增 UpdateAttribute</h3>\n<p>新增 Processor：<code>UpdateAttribute</code>。</p>\n<p>新增 dynamic properties：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>lab.name</code></td><td><code>training-lab-09</code></td></tr>\n<tr><td><code>cluster.lesson</code></td><td><code>execution-check</code></td></tr>\n<tr><td><code>generated.at</code></td><td><code>${now():format(&quot;yyyy-MM-dd HH:mm:ss&quot;)}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-3-新增-logattribute\">Step 3：新增 LogAttribute</h3>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab09-cluster</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-4-連線與-auto-terminate\">Step 4：連線與 Auto-terminate</h3>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; U[UpdateAttribute]\n    U -- success --&gt; L[LogAttribute]</code></pre>\n<p>設定：</p>\n<ul>\n<li><code>LogAttribute</code> 的 <code>success</code>：auto-terminate</li>\n</ul>\n<p>說明：這條 flow 很簡單，目的是把排程產生資料、加 attribute、輸出 log 的行為對照到 cluster 設定。先不要把 <code>Run Schedule</code> 設太短，避免本機累積太多測試資料。</p>\n<h2 id=\"part-3-觀察-execution-設定\">Part 3：觀察 Execution 設定</h2>\n<ol>\n<li>打開 <code>GenerateFlowFile</code>。</li>\n<li>進入 <code>Scheduling</code>。</li>\n<li>找到 <code>Execution</code>。</li>\n<li>觀察目前值。</li>\n</ol>\n<p>常見值：</p>\n<table>\n<thead><tr><th>Execution</th><th>在 cluster 的意思</th></tr></thead>\n<tbody>\n<tr><td><code>All Nodes</code></td><td>每個 node 都會執行這個 Processor</td></tr>\n<tr><td><code>Primary Node</code></td><td>只有 Primary Node 執行這個 Processor</td></tr>\n</tbody>\n</table>\n<p>如果本機單節點 UI 沒有明顯 cluster 效果，仍要記住：這個設定到了公司 cluster 會非常重要。</p>\n<h2 id=\"part-4-練習判斷-all-nodes-與-primary-node\">Part 4：練習判斷 All Nodes 與 Primary Node</h2>\n<p>先不要啟動流程，先做判斷。</p>\n<h3 id=\"情境-a-每天凌晨抓一次公司共用-api\">情境 A：每天凌晨抓一次公司共用 API</h3>\n<p>如果 <code>GenerateFlowFile</code> 或上游抓資料 Processor 在 cluster 使用 <code>All Nodes</code>：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    N1[Node 1] --&gt; API[Company API]\n    N2[Node 2] --&gt; API\n    N3[Node 3] --&gt; API</code></pre>\n<p>可能結果：</p>\n<ul>\n<li>同一批資料被抓 3 次。</li>\n<li>API 被打 3 倍流量。</li>\n<li>下游 DB 出現重複資料。</li>\n</ul>\n<p>建議：這類「整個 cluster 只應執行一次」的排程，通常要評估 <code>Primary Node</code>。</p>\n<h3 id=\"情境-b-每個-node-處理自己-queue-裡的資料\">情境 B：每個 node 處理自己 queue 裡的資料</h3>\n<p>如果資料已經在 NiFi queue 中，而且每個 node 都可以安全處理不同 FlowFile：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    Q1[Node 1 Queue] --&gt; P1[Processor]\n    Q2[Node 2 Queue] --&gt; P2[Processor]\n    Q3[Node 3 Queue] --&gt; P3[Processor]</code></pre>\n<p>建議：這類可以評估 <code>All Nodes</code>，讓多個 node 分散處理，提高吞吐量。</p>\n<p>判斷重點：</p>\n<pre><code class=\"language-text\">來源只應讀一次 -&gt; 優先評估 Primary Node\n資料已分散在 queue -&gt; 可評估 All Nodes\n會寫共享 DB/API/檔案 -&gt; 先確認 idempotent 與併行安全</code></pre>\n<h2 id=\"part-5-執行本機練習\">Part 5：執行本機練習</h2>\n<ol>\n<li>確認 <code>GenerateFlowFile</code> 的 <code>Run Schedule = 60 sec</code>。</li>\n<li>啟動 <code>UpdateAttribute</code>。</li>\n<li>啟動 <code>LogAttribute</code>。</li>\n<li>啟動 <code>GenerateFlowFile</code>。</li>\n<li>等 1 次觸發後停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=160 nifi</code></pre>\n<ol>\n<li>確認看到 <code>lab09-cluster</code>。</li>\n</ol>\n<p>說明：本機只會看到一個 node 產生資料。這個練習的重點不是製造多節點效果，而是讓你知道同一條 flow 到公司 cluster 時，<code>Execution</code> 會決定它是在每個 node 都跑，還是只在 Primary Node 跑。</p>\n<h2 id=\"part-6-connection-load-balancing\">Part 6：Connection Load Balancing</h2>\n<p>NiFi cluster 的 connection 可以設定 load balancing，用來把 queue 裡的 FlowFile 分配到不同 node。</p>\n<p>常見 load balancing 策略：</p>\n<table>\n<thead><tr><th>策略</th><th>意義</th></tr></thead>\n<tbody>\n<tr><td><code>Do not load balance</code></td><td>不跨 node 分配 FlowFile</td></tr>\n<tr><td><code>Round robin</code></td><td>輪流分配到不同 node</td></tr>\n<tr><td><code>Single node</code></td><td>儘量送到同一個 node</td></tr>\n<tr><td><code>Partition by attribute</code></td><td>依某個 attribute 分區，讓同 key 資料盡量到同 node</td></tr>\n</tbody>\n</table>\n<p>實務判斷：</p>\n<ul>\n<li>如果資料可以任意分散處理，可評估 <code>Round robin</code>。</li>\n<li>如果同一個 customer/order/account 必須保持順序或同節點處理，可評估 <code>Partition by attribute</code>。</li>\n<li>如果下游不是 cluster-aware，先不要急著開 load balancing。</li>\n</ul>\n<p>本機單節點不容易看出 load balancing 效果；公司 cluster 排錯時才會看到不同 node 的 queue 與處理量差異。</p>\n<h2 id=\"part-7-cluster-state-與重複處理\">Part 7：Cluster State 與重複處理</h2>\n<p>有些 Processor 需要記錄「上次讀到哪裡」，例如：</p>\n<ul>\n<li>上次查 DB 的時間。</li>\n<li>上次讀 API 的 cursor。</li>\n<li>上次處理的 offset。</li>\n</ul>\n<p>在 cluster 中要確認 state 是 local 還是 cluster-wide。</p>\n<table>\n<thead><tr><th>State 類型</th><th>意義</th><th>風險</th></tr></thead>\n<tbody>\n<tr><td>Local state</td><td>每個 node 各自記錄</td><td>多 node 可能各自讀一次，造成重複</td></tr>\n<tr><td>Cluster state</td><td>cluster 共用狀態</td><td>較適合避免多 node 重複讀同一批資料</td></tr>\n</tbody>\n</table>\n<p>說明：不是每個 Processor 都有 state，也不是每個 Processor 都支援 cluster-wide state。遇到會記錄進度的 Processor，要先查該 Processor 文件與公司既有設定。</p>\n<h2 id=\"part-8-公司專案-cluster-檢查清單\">Part 8：公司專案 Cluster 檢查清單</h2>\n<p>看到公司 NiFi cluster flow 時，先問這些問題：</p>\n<ul>\n<li>這個 Processor 是 <code>All Nodes</code> 還是 <code>Primary Node</code>？</li>\n<li>如果是 <code>All Nodes</code>，每個 node 同時執行會不會重複抓資料？</li>\n<li>如果是 <code>Primary Node</code>，Primary Node 切換時是否會影響排程？</li>\n<li>connection 是否開啟 load balancing？</li>\n<li>load balancing strategy 是否符合資料順序需求？</li>\n<li>Processor 是否使用 state？state 是 local 還是 cluster-wide？</li>\n<li>目標 DB/API 是否能承受多 node 並行寫入？</li>\n<li>如果 node 掛掉，queue、state、未完成資料如何恢復？</li>\n<li>是否有版本管理，避免不同環境 flow 不一致？</li>\n</ul>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<h3 id=\"多節點重複抓資料\">多節點重複抓資料</h3>\n<p>現象：</p>\n<ul>\n<li>原本預期一天一批，結果同一批資料出現多份。</li>\n<li>DB 出現 duplicate key。</li>\n<li>API log 顯示同一時間多台 NiFi node 打同一個 endpoint。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>檢查上游排程 Processor 的 <code>Execution</code>。</li>\n<li>對只應執行一次的來源，評估 <code>Primary Node</code>。</li>\n<li>檢查是否需要 cluster-wide state 或外部鎖。</li>\n</ul>\n<h3 id=\"開了-load-balancing-後順序不穩定\">開了 load balancing 後順序不穩定</h3>\n<p>現象：</p>\n<ul>\n<li>同一客戶或同一訂單的事件順序偶爾錯亂。</li>\n<li>下游處理時找不到前一筆狀態。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>檢查 connection load balancing strategy。</li>\n<li>若要同 key 走同 node，評估 <code>Partition by attribute</code>。</li>\n<li>若順序非常重要，先不要任意分散。</li>\n</ul>\n<h3 id=\"primary-node-切換造成排程中斷或重跑\">Primary Node 切換造成排程中斷或重跑</h3>\n<p>現象：</p>\n<ul>\n<li>cluster 維護或 node 重啟後，排程時間點附近出現漏跑或重跑。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>檢查 bulletin、provenance 與 logs。</li>\n<li>檢查 Processor state。</li>\n<li>公司正式排程要設計 idempotent，不能只依賴「理論上只跑一次」。</li>\n</ul>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 NiFi cluster 是多個 node 執行同一份 flow。</li>\n<li>你知道 <code>All Nodes</code> 會讓 Processor 在每個 node 執行。</li>\n<li>你知道 <code>Primary Node</code> 適合只應跑一次的排程來源。</li>\n<li>你知道 connection load balancing 會影響 FlowFile 分配到哪個 node。</li>\n<li>你知道 cluster 中要注意 local state 與 cluster state 的差異。</li>\n<li>你知道公司 cluster 排程要檢查重複執行、順序、共享資源與 failover。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 cluster 執行判斷流程：</p>\n<pre><code class=\"language-mermaid\">flowchart TD\n    A[看到 Processor] --&gt; B{是否在 Cluster}\n    B -- 否 --&gt; C[照單節點排程觀察]\n    B -- 是 --&gt; D{來源是否只應跑一次}\n    D -- 是 --&gt; E[評估 Primary Node]\n    D -- 否 --&gt; F[評估 All Nodes]\n    F --&gt; G{是否需要跨 node 分配 Queue}\n    G -- 是 --&gt; H[檢查 Load Balancing]\n    G -- 否 --&gt; I[保留預設或依公司規範]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li>先判斷目前是不是 cluster。</li>\n<li>如果是 cluster，先看 Processor 的 <code>Execution</code>。</li>\n<li>只應執行一次的來源，通常要評估 <code>Primary Node</code>。</li>\n<li>可分散處理的資料，才考慮 <code>All Nodes</code> 與 connection load balancing。</li>\n<li>有順序、state、共享 DB/API 的流程，要先確認併行安全與重複處理策略。</li>\n</ol>\n<p>做完後你要理解：</p>\n<ul>\n<li>cluster 不是單純加速開關；它會改變資料被哪些 node 執行。</li>\n<li><code>Execution</code> 是公司 cluster 排程最重要的檢查點之一。</li>\n<li>load balancing 可以提高吞吐量，但可能影響資料順序。</li>\n<li>正式專案要把 failover、state、idempotent、重複資料處理一起納入設計。</li>\n</ul>"
  },

    "id": "10-query-format-expression-language",
    "file": "10-query-format-expression-language.md",
    "title": "Lab 10：Query、Formatter 與 Expression Language 實戰",
    "html": "<h1 id=\"lab-10-query-formatter-與-expression-language-實戰\">Lab 10：Query、Formatter 與 Expression Language 實戰</h1>\n<p>目標：用 <code>QueryRecord</code> 找出指定 records，再用 <code>UpdateRecord</code> 搭配 <code>Expression Language</code> 做字串替換、日期格式化與欄位補值。</p>\n<p>預估時間：60 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; Q[QueryRecord]\n    Q -- target_records --&gt; U[UpdateRecord]\n    Q -- original --&gt; X[auto-terminate]\n    U -- success --&gt; L[LogAttribute]\n    U -- failure --&gt; E[LogAttribute error]\n    R[CSVReader] -. reads records .-&gt; Q\n    W[CSVRecordSetWriter] -. writes records .-&gt; Q\n    R -. reads records .-&gt; U\n    W -. writes records .-&gt; U</code></pre>\n<p>你會先產生一批 CSV 訂單資料，再只挑出 <code>status = CANCELLED</code> 的 record，最後把該 record 的欄位格式化：</p>\n<ul>\n<li><code>/status</code>：改成固定文字。</li>\n<li><code>/note</code>：用 Expression Language 替換電話字串。</li>\n<li><code>/order_date</code>：把日期格式從 <code>yyyy-MM-dd HH:mm:ss</code> 改成 <code>yyyy/MM/dd</code>。</li>\n<li><code>/processed_at</code>：補上目前處理時間。</li>\n</ul>\n<h2 id=\"官方確認的語法觀念\">官方確認的語法觀念</h2>\n<p>本 Lab 會同時用到三種語法，不要混在一起：</p>\n<table>\n<thead><tr><th>語法</th><th>用途</th><th>常見位置</th></tr></thead>\n<tbody>\n<tr><td><code>QueryRecord SQL</code></td><td>查 record content 裡的欄位</td><td><code>QueryRecord</code> dynamic property</td></tr>\n<tr><td><code>RecordPath</code></td><td>指定要更新哪個 record 欄位</td><td><code>UpdateRecord</code> dynamic property name</td></tr>\n<tr><td><code>Expression Language</code></td><td>對值做字串、日期、attribute 運算</td><td><code>UpdateRecord</code> dynamic property value</td></tr>\n</tbody>\n</table>\n<p>重要觀念：</p>\n<ul>\n<li><code>QueryRecord</code> 是看 content 裡的 record，不是看 FlowFile attribute。</li>\n<li><code>UpdateRecord</code> 的 dynamic property name 是 RecordPath，例如 <code>/note</code>。</li>\n<li><code>UpdateRecord</code> 的 dynamic property value 可以用 <code>${field.value}</code> 代表目前正在更新的欄位值。</li>\n<li><code>Expression Language</code> 的 <code>replaceAll</code> 可以做字串替換。</li>\n<li><code>Expression Language</code> 的 <code>toDate(...):format(...)</code> 可以做日期格式轉換。</li>\n</ul>\n<p>來源：</p>\n<ul>\n<li>https://nifi.apache.org/components/org.apache.nifi.processors.standard.QueryRecord/</li>\n<li>https://nifi.apache.org/components/org.apache.nifi.processors.standard.UpdateRecord/</li>\n<li>https://nifi.apache.org/nifi-docs/expression-language-guide.html</li>\n<li>https://nifi.apache.org/nifi-docs/record-path-guide.html</li>\n</ul>\n<h2 id=\"part-1-建立-process-group\">Part 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-10</code>，進入該 Process Group。</p>\n<h2 id=\"part-2-建立-reader-與-writer\">Part 2：建立 Reader 與 Writer</h2>\n<h3 id=\"step-1-建立-csvreader\">Step 1：建立 CSVReader</h3>\n<p>在 Process Group 空白處右鍵，選 <code>Configure</code>，進入 <code>Controller Services</code>。</p>\n<p>建立 <code>CSVReader</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Infer Schema</code></td></tr>\n<tr><td><code>CSV Format</code></td><td><code>RFC 4180</code> 或預設值</td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<h3 id=\"step-2-建立-csvrecordsetwriter\">Step 2：建立 CSVRecordSetWriter</h3>\n<p>建立 <code>CSVRecordSetWriter</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Inherit Record Schema</code></td></tr>\n<tr><td><code>Schema Write Strategy</code></td><td><code>Do Not Write Schema</code></td></tr>\n<tr><td><code>Include Header Line</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<p>說明：這裡先用 <code>Infer Schema</code> 與 <code>Inherit Record Schema</code>，讓練習聚焦在查詢與格式化。正式專案若欄位固定，應改用明確 schema，避免欄位型別被推斷錯誤。</p>\n<h2 id=\"part-3-建立測試資料\">Part 3：建立測試資料</h2>\n<p>新增 Processor：<code>GenerateFlowFile</code>。</p>\n<p>設定 <code>Scheduling</code>：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Run Schedule</code></td><td><code>60 sec</code></td></tr>\n</tbody>\n</table>\n<p>設定 <code>Properties</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Custom Text</code></td><td>使用下方 CSV</td></tr>\n</tbody>\n</table>\n<pre><code class=\"language-csv\">order_id,customer,amount,status,order_date,note\n1001,Alice,120.50,NEW,2026-05-01 09:30:00,normal order\n1002,Bob,35.00,CANCELLED,2026-05-02 10:15:00,phone=0912-345-678 cancelled by user\n1003,Carol,520.00,PAID,2026-05-03 14:45:00,vip customer</code></pre>\n<p>說明：<code>1002</code> 是本 Lab 的目標 record。等一下會用 <code>QueryRecord</code> 只挑出這一筆，再對它做格式化。</p>\n<h2 id=\"part-4-用-queryrecord-找出目標-record\">Part 4：用 QueryRecord 找出目標 record</h2>\n<p>新增 Processor：<code>QueryRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選 <code>CSVReader</code></td></tr>\n<tr><td><code>Record Writer</code></td><td>選 <code>CSVRecordSetWriter</code></td></tr>\n</tbody>\n</table>\n<p>新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>target_records</code></td><td><code>SELECT * FROM FLOWFILE WHERE &quot;status&quot; = &#39;CANCELLED&#39;</code></td></tr>\n</tbody>\n</table>\n<p>說明：dynamic property name 會變成 relationship 名稱。這裡的 <code>target_records</code> 代表「被查詢挑中的 records」。</p>\n<h2 id=\"part-5-建立-updaterecord-格式化目標-record\">Part 5：建立 UpdateRecord 格式化目標 record</h2>\n<p>新增 Processor：<code>UpdateRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選 <code>CSVReader</code></td></tr>\n<tr><td><code>Record Writer</code></td><td>選 <code>CSVRecordSetWriter</code></td></tr>\n<tr><td><code>Replacement Value Strategy</code></td><td><code>Literal Value</code></td></tr>\n</tbody>\n</table>\n<p>新增 dynamic properties：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/status</code></td><td><code>CANCELLED_NORMALIZED</code></td></tr>\n<tr><td><code>/note</code></td><td><code>${field.value:replaceAll(&#39;phone=[0-9-]+&#39;, &#39;phone=***&#39;)}</code></td></tr>\n<tr><td><code>/order_date</code></td><td><code>${field.value:toDate(&#39;yyyy-MM-dd HH:mm:ss&#39;):format(&#39;yyyy/MM/dd&#39;)}</code></td></tr>\n<tr><td><code>/processed_at</code></td><td><code>${now():format(&quot;yyyy-MM-dd HH:mm:ss&quot;)}</code></td></tr>\n</tbody>\n</table>\n<p>說明：</p>\n<ul>\n<li><code>/status</code> 是固定值替換。</li>\n<li><code>/note</code> 會把 <code>phone=0912-345-678</code> 替換成 <code>phone=***</code>。</li>\n<li><code>/order_date</code> 會把 <code>2026-05-02 10:15:00</code> 改成 <code>2026/05/02</code>。</li>\n<li><code>/processed_at</code> 是新增欄位，值是目前處理時間。</li>\n<li><code>Replacement Value Strategy</code> 必須是 <code>Literal Value</code>，因為這一段的 value 要被當成固定文字或 Expression Language。不要改成 <code>Record Path Value</code>，否則 <code>${field.value...}</code> 不會照你預期處理。</li>\n</ul>\n<h2 id=\"part-6-連線與-auto-terminate\">Part 6：連線與 Auto-terminate</h2>\n<p>建立連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; Q[QueryRecord]\n    Q -- target_records --&gt; U[UpdateRecord]\n    U -- success --&gt; L[LogAttribute lab10-result]\n    U -- failure --&gt; E[LogAttribute lab10-error]</code></pre>\n<p>新增兩個 <code>LogAttribute</code>：</p>\n<p>第一個命名或註解為 <code>lab10-result</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab10-result</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>第二個命名或註解為 <code>lab10-error</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab10-error</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>QueryRecord</code> 的 <code>original</code></li>\n<li><code>QueryRecord</code> 的 <code>failure</code></li>\n<li><code>lab10-result</code> 的 <code>success</code></li>\n<li><code>lab10-error</code> 的 <code>success</code></li>\n</ul>\n<p>說明：這個 Lab 只觀察被挑出的目標 record，所以 <code>original</code> 可以先 auto-terminate。公司專案若需要保留所有 records，不能直接丟掉 <code>original</code>，要另外設計 matched / unmatched 的合併或下游處理。</p>\n<h2 id=\"part-7-執行與觀察\">Part 7：執行與觀察</h2>\n<ol>\n<li>Start <code>lab10-result</code>。</li>\n<li>Start <code>lab10-error</code>。</li>\n<li>Start <code>UpdateRecord</code>。</li>\n<li>Start <code>QueryRecord</code>。</li>\n<li>Start <code>GenerateFlowFile</code>。</li>\n<li>等一筆資料送出後，停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=220 nifi</code></pre>\n<p>你應該看到類似結果：</p>\n<pre><code class=\"language-csv\">order_id,customer,amount,status,order_date,note,processed_at\n1002,Bob,35.00,CANCELLED_NORMALIZED,2026/05/02,phone=*** cancelled by user,2026-05-10 15:30:00</code></pre>\n<p>重點不是時間值完全一樣，而是：</p>\n<ul>\n<li>只剩 <code>1002</code> 這筆目標 record。</li>\n<li><code>status</code> 被改掉。</li>\n<li><code>note</code> 裡的電話被遮罩。</li>\n<li><code>order_date</code> 日期格式被改掉。</li>\n<li>新增 <code>processed_at</code> 欄位。</li>\n</ul>\n<h2 id=\"part-8-保留不符合-query-的資料\">Part 8：保留不符合 query 的資料</h2>\n<p>前面的主線只保留 <code>target_records</code>，所以輸出只會有 <code>1002</code>。如果公司需求是「只修改符合條件的 records，但其他 records 仍要保留」，不要直接使用 <code>original</code> 當作不符合資料。</p>\n<p>原因：</p>\n<pre><code class=\"language-text\">original = 完整原始 FlowFile，包含 target + unmatched</code></pre>\n<p>如果你同時保留 <code>original</code> 又輸出 <code>target_records</code>，就會造成目標資料重複。</p>\n<p>正確設計是讓 <code>QueryRecord</code> 明確切成兩條 relationship：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; Q[QueryRecord]\n    Q -- target_records --&gt; U[UpdateRecord 格式化]\n    Q -- other_records --&gt; O[未命中資料直接往下游]\n    U -- success --&gt; D[同一個下游]\n    O --&gt; D\n    Q -- original --&gt; X[auto-terminate]</code></pre>\n<h3 id=\"step-1-新增-other-records-query\">Step 1：新增 other_records query</h3>\n<p>修改 Processor：<code>QueryRecord</code></p>\n<p>保留原本的 <code>target_records</code>：</p>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;status&quot; = &#39;CANCELLED&#39;</code></pre>\n<p>新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>other_records</code></td><td><code>SELECT * FROM FLOWFILE WHERE &quot;status&quot; &lt;&gt; &#39;CANCELLED&#39; OR &quot;status&quot; IS NULL</code></td></tr>\n</tbody>\n</table>\n<p>說明：<code>other_records</code> 代表不需要格式化的資料。<code>OR &quot;status&quot; IS NULL</code> 是為了避免 status 空值時被 SQL 三值邏輯排除。</p>\n<h3 id=\"step-2-新增未命中資料觀察點\">Step 2：新增未命中資料觀察點</h3>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>命名或註解成 <code>lab10-other-records</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab10-other-records</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    Q[QueryRecord] -- other_records --&gt; O[LogAttribute lab10-other-records]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>lab10-other-records</code> 的 <code>success</code></li>\n</ul>\n<h3 id=\"step-3-重新執行並觀察\">Step 3：重新執行並觀察</h3>\n<ol>\n<li>Start <code>lab10-other-records</code>。</li>\n<li>確認 <code>QueryRecord</code> 的 <code>original</code> 仍然 auto-terminate。</li>\n<li>Start <code>GenerateFlowFile</code>。</li>\n<li>等一筆資料送出後，停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=260 nifi</code></pre>\n<p>你應該看到：</p>\n<ul>\n<li><code>lab10-result</code>：輸出 <code>1002</code>，而且欄位已被格式化。</li>\n<li><code>lab10-other-records</code>：輸出 <code>1001</code>、<code>1003</code>，維持原始欄位值。</li>\n</ul>\n<p>說明：這個設計的重點是「matched 和 unmatched 都是從 <code>QueryRecord</code> 明確查出來的結果」。<code>original</code> 只是原始完整資料，通常不應和 matched 結果一起送往下游，否則容易重複處理。</p>\n<h3 id=\"step-4-如果要送到同一個下游\">Step 4：如果要送到同一個下游</h3>\n<p>如果下游是 <code>PutDatabaseRecord</code> 這類可接受多個 FlowFile 的 Processor，可以讓兩條路徑都連到同一個下游：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    Q[QueryRecord] -- target_records --&gt; U[UpdateRecord]\n    U -- success --&gt; P[PutDatabaseRecord]\n    Q -- other_records --&gt; P</code></pre>\n<p>這代表：</p>\n<ul>\n<li>符合條件的 records 先被格式化，再寫入 DB。</li>\n<li>不符合條件的 records 不修改，直接寫入 DB。</li>\n</ul>\n<p>如果公司需求是「最後一定要合併成單一檔案」，要再評估 <code>MergeRecord</code> 或公司既有合併流程。合併後的順序不一定等於原始 CSV 順序，正式設計前要先確認業務是否要求順序。</p>\n<h2 id=\"part-9-練習題\">Part 9：練習題</h2>\n<h3 id=\"練習-1-改查詢條件-指定另一筆-record\">練習 1：改查詢條件，指定另一筆 record</h3>\n<p>這一題沿用同一條 flow。先停止 <code>GenerateFlowFile</code>，避免邊改邊產生資料。</p>\n<p>修改 Processor：<code>QueryRecord</code></p>\n<p>把 <code>target_records</code> 改成：</p>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;order_id&quot; = 1003</code></pre>\n<p>重新執行後，觀察輸出是否只剩 <code>1003</code>。</p>\n<h3 id=\"練習-2-替換不同字串\">練習 2：替換不同字串</h3>\n<p>這一題沿用練習 1 後的狀態。先停止 <code>GenerateFlowFile</code>。</p>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>把 <code>/note</code> 改成：</p>\n<pre><code class=\"language-text\">${field.value:replaceAll(&#39;vip&#39;, &#39;priority&#39;)}</code></pre>\n<p>重新執行後，觀察 <code>1003</code> 的 note 是否從 <code>vip customer</code> 變成 <code>priority customer</code>。</p>\n<h3 id=\"練習-3-故意填錯日期格式\">練習 3：故意填錯日期格式</h3>\n<p>這一題沿用同一條 flow。先停止 <code>GenerateFlowFile</code>。</p>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>把 <code>/order_date</code> 改成錯誤格式：</p>\n<pre><code class=\"language-text\">${field.value:toDate(&#39;yyyy/MM/dd&#39;):format(&#39;yyyy-MM-dd&#39;)}</code></pre>\n<p>重新執行後，觀察資料是否走 <code>failure</code>，並查看 <code>lab10-error</code> log。</p>\n<p>練習完成後，把 <code>/order_date</code> 改回：</p>\n<pre><code class=\"language-text\">${field.value:toDate(&#39;yyyy-MM-dd HH:mm:ss&#39;):format(&#39;yyyy/MM/dd&#39;)}</code></pre>\n<p>說明：<code>toDate</code> 的格式必須符合原始字串。原始值是 <code>2026-05-02 10:15:00</code>，所以要用 <code>yyyy-MM-dd HH:mm:ss</code> 解析。</p>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<h3 id=\"把-expression-language-寫在-dynamic-property-name\">把 Expression Language 寫在 dynamic property name</h3>\n<p>錯誤觀念：</p>\n<pre><code class=\"language-text\">${field.value:replaceAll(...)}</code></pre>\n<p>不能放在 <code>UpdateRecord</code> dynamic property name。</p>\n<p>處理：</p>\n<ul>\n<li>dynamic property name 放 RecordPath，例如 <code>/note</code>。</li>\n<li>dynamic property value 才放 Expression Language。</li>\n</ul>\n<h3 id=\"忘記-field-value-代表目前欄位值\">忘記 field.value 代表目前欄位值</h3>\n<p><code>field.value</code> 不是 FlowFile attribute，而是 <code>UpdateRecord</code> 在更新某個欄位時提供的目前欄位值。</p>\n<p>例如：</p>\n<pre><code class=\"language-text\">/note = ${field.value:replaceAll(&#39;phone=[0-9-]+&#39;, &#39;phone=***&#39;)}</code></pre>\n<p>意思是：拿 <code>/note</code> 原本的值做 replace，再寫回 <code>/note</code>。</p>\n<h3 id=\"日期格式和原始資料不一致\">日期格式和原始資料不一致</h3>\n<p>現象：</p>\n<ul>\n<li>FlowFile 走 <code>failure</code>。</li>\n<li>log 出現日期 parse 相關錯誤。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>先看原始日期字串長什麼樣子。</li>\n<li><code>toDate</code> 的第一個格式要對應原始字串。</li>\n<li><code>format</code> 的格式才是輸出格式。</li>\n</ul>\n<h3 id=\"queryrecord-數字欄位拿字串比較\">QueryRecord 數字欄位拿字串比較</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">Unable to query FlowFile ... Error while preparing statement\nSELECT * FROM FLOWFILE WHERE &quot;order_id&quot; = &#39;1003&#39;</code></pre>\n<p>原因：</p>\n<ul>\n<li>本 Lab 的 <code>CSVReader</code> 使用 <code>Infer Schema</code>。</li>\n<li><code>order_id</code> 可能被推斷成數字欄位。</li>\n<li>SQL 卻用 <code>&#39;1003&#39;</code> 字串去比較，Calcite 在準備 SQL 時可能失敗。</li>\n</ul>\n<p>處理：</p>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;order_id&quot; = 1003</code></pre>\n<p>若公司正式 schema 把 <code>order_id</code> 定義成 string，才使用：</p>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;order_id&quot; = &#39;1003&#39;</code></pre>\n<h3 id=\"想保留全部-records-但只改其中幾筆\">想保留全部 records，但只改其中幾筆</h3>\n<p>本 Lab 的主線是「挑出目標 records 後輸出」，所以結果只會剩目標 records。</p>\n<p>如果公司需求是保留所有 records，但只修改其中幾筆，常見設計方式有：</p>\n<ul>\n<li>用 <code>QueryRecord</code> 分成 <code>target_records</code> / <code>other_records</code>，target 先格式化，other 直接往下游。</li>\n<li>用資料庫或 API 的 upsert / merge 規則處理。</li>\n<li>用更進階的 RecordPath、Script 或專用轉換 Processor，依公司規範設計。</li>\n</ul>\n<p>不要把 <code>original</code> 當作 unmatched records。<code>original</code> 是完整原始資料，包含 matched 與 unmatched；如果同時保留 <code>original</code> 和 <code>target_records</code>，通常會造成重複資料。</p>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 <code>QueryRecord</code> 可以用 SQL-like 語法指定目標 records。</li>\n<li>你知道 <code>UpdateRecord</code> 的 dynamic property name 是 RecordPath。</li>\n<li>你知道 <code>UpdateRecord</code> 的 dynamic property value 可以用 Expression Language。</li>\n<li>你知道 <code>${field.value}</code> 代表目前正在更新的欄位值。</li>\n<li>你能用 <code>replaceAll</code> 做字串替換或遮罩。</li>\n<li>你能用 <code>toDate(...):format(...)</code> 做日期格式轉換。</li>\n<li>你知道只改某幾筆 records 時，要先想清楚是否需要保留 unmatched records。</li>\n<li>你知道 <code>original</code> 是完整原始資料，不是不符合 query 的資料。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 record 查詢與格式化 flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; Q[QueryRecord]\n    Q -- target_records --&gt; U[UpdateRecord]\n    Q -- other_records --&gt; O[未命中資料]\n    U --&gt; L[格式化後資料]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生多筆 CSV records。</li>\n<li><code>QueryRecord</code> 用 SQL-like 語法挑出目標 records。</li>\n<li>若需要保留其他資料，<code>QueryRecord</code> 要另外輸出 <code>other_records</code>。</li>\n<li><code>UpdateRecord</code> 用 RecordPath 指定要更新的欄位。</li>\n<li><code>Expression Language</code> 對欄位值做字串替換、日期格式化或補值。</li>\n<li><code>LogAttribute</code> 輸出轉換後的 content，方便觀察結果。</li>\n</ol>\n<p>做完後你要理解：</p>\n<ul>\n<li>query、RecordPath、Expression Language 是三種不同層次的工具。</li>\n<li>公司專案常見的 formatter，不只是改字串；還包含日期格式、遮罩、固定值、補處理時間。</li>\n<li>只改某些 records 時，先用查詢或路由界定目標資料，再做格式化，比直接在一個 Processor 裡硬塞所有邏輯更容易排錯。</li>\n<li>若要保留不符合 query 的資料，應明確建立 unmatched relationship，不要誤用 <code>original</code>。</li>\n</ul>"
  },

    "title": "NiFi 入門速查表",
    "html": "<h1 id=\"nifi-入門速查表\">NiFi 入門速查表</h1>\n<h2 id=\"基本名詞速查\">基本名詞速查</h2>\n<table>\n<thead><tr><th>名詞</th><th>白話說明</th><th>常見位置</th></tr></thead>\n<tbody>\n<tr><td><code>FlowFile</code></td><td>NiFi 裡的一筆資料包裹，包含 content 與 attributes</td><td>Queue、Provenance、LogAttribute</td></tr>\n<tr><td><code>Content</code></td><td>FlowFile 的真正資料內容</td><td>CSV、JSON、XML、檔案內容</td></tr>\n<tr><td><code>Attributes</code></td><td>FlowFile metadata</td><td><code>filename</code>、<code>uuid</code>、<code>record.count</code></td></tr>\n<tr><td><code>Processor</code></td><td>處理資料的節點</td><td>Canvas 上的方塊</td></tr>\n<tr><td><code>Connection</code></td><td>Processor 之間的線，也包含 queue</td><td>Canvas 連線</td></tr>\n<tr><td><code>Relationship</code></td><td>Processor 處理後的出口</td><td><code>success</code>、<code>failure</code>、<code>matched</code></td></tr>\n<tr><td><code>Auto-terminate</code></td><td>讓某個 relationship 的 FlowFile 到此結束</td><td>Processor 的 Relationships 分頁</td></tr>\n<tr><td><code>Queue</code></td><td>等待下游處理的 FlowFile</td><td>Connection 上的數字</td></tr>\n<tr><td><code>Back Pressure</code></td><td>Queue 滿時壓住上游的保護機制</td><td>Connection 設定</td></tr>\n<tr><td><code>Controller Service</code></td><td>可共用的設定或資源</td><td>Reader、Writer、DBCP</td></tr>\n<tr><td><code>Process Group</code></td><td>收納一組 flow 的資料夾</td><td>Canvas 群組</td></tr>\n<tr><td><code>Port</code></td><td>Process Group 的入口或出口</td><td>Input Port、Output Port</td></tr>\n<tr><td><code>Funnel</code></td><td>多條線合併成一條的匯流點</td><td>Canvas 漏斗圖示</td></tr>\n<tr><td><code>Bulletin</code></td><td>UI 錯誤或警告提示</td><td>Processor 右上角提示</td></tr>\n<tr><td><code>Provenance</code></td><td>FlowFile 歷史紀錄</td><td>Data Provenance</td></tr>\n<tr><td><code>Parameter</code></td><td>可重複使用的設定值</td><td><code>#{parameter.name}</code></td></tr>\n<tr><td><code>Record</code></td><td>結構化資料的一列</td><td>CSV row、JSON object</td></tr>\n<tr><td><code>Schema</code></td><td>Record 欄位與型別定義</td><td>Reader/Writer 設定</td></tr>\n<tr><td><code>Cluster</code></td><td>多個 NiFi node 共同執行同一份 flow</td><td>公司正式環境、Summary</td></tr>\n<tr><td><code>Primary Node</code></td><td>cluster 中被選為 primary 的 node</td><td>Processor <code>Execution</code>、Cluster 管理</td></tr>\n<tr><td><code>Load Balanced Connection</code></td><td>把 queued FlowFile 分配到不同 node</td><td>Connection 設定</td></tr>\n</tbody>\n</table>\n<h2 id=\"常用-processor\">常用 Processor</h2>\n<table>\n<thead><tr><th>類型</th><th>Processor</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td>產生測試資料</td><td><code>GenerateFlowFile</code></td><td>建立練習用 FlowFile</td></tr>\n<tr><td>看 attributes/log</td><td><code>LogAttribute</code></td><td>把 attributes 與 payload 寫到 log</td></tr>\n<tr><td>改 attributes</td><td><code>UpdateAttribute</code></td><td>新增或修改 FlowFile metadata</td></tr>\n<tr><td>attribute 路由</td><td><code>RouteOnAttribute</code></td><td>根據 Expression Language 分流</td></tr>\n<tr><td>格式轉換</td><td><code>ConvertRecord</code></td><td>用 Reader/Writer 轉換 record 格式</td></tr>\n<tr><td>record 查詢</td><td><code>QueryRecord</code></td><td>用 SQL-like 語法篩選 record</td></tr>\n<tr><td>record 更新</td><td><code>UpdateRecord</code></td><td>用 RecordPath 修改欄位</td></tr>\n<tr><td>record 驗證</td><td><code>ValidateRecord</code></td><td>檢查 record 是否符合 schema</td></tr>\n<tr><td>讀資料庫</td><td><code>ExecuteSQLRecord</code></td><td>執行 SQL query，將結果輸出成 records</td></tr>\n<tr><td>寫資料庫</td><td><code>PutDatabaseRecord</code></td><td>將 records 寫入 DB</td></tr>\n<tr><td>讀檔</td><td><code>GetFile</code> / <code>ListFile</code> + <code>FetchFile</code></td><td>讀取檔案來源</td></tr>\n<tr><td>寫檔</td><td><code>PutFile</code></td><td>將 FlowFile content 寫出檔案</td></tr>\n</tbody>\n</table>\n<h2 id=\"常用-controller-service\">常用 Controller Service</h2>\n<table>\n<thead><tr><th>Service</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td><code>CSVReader</code></td><td>讀取 CSV content 成 records</td></tr>\n<tr><td><code>CSVRecordSetWriter</code></td><td>將 records 寫成 CSV</td></tr>\n<tr><td><code>JsonTreeReader</code></td><td>讀取 JSON content 成 records</td></tr>\n<tr><td><code>JsonRecordSetWriter</code></td><td>將 records 寫成 JSON</td></tr>\n<tr><td><code>DBCPConnectionPool</code></td><td>JDBC 連線池</td></tr>\n<tr><td><code>AvroSchemaRegistry</code></td><td>管理 Avro schema</td></tr>\n</tbody>\n</table>\n<h2 id=\"常見-invalid-原因\">常見 invalid 原因</h2>\n<table>\n<thead><tr><th>訊息特徵</th><th>可能原因</th><th>處理</th></tr></thead>\n<tbody>\n<tr><td><code>Controller Service ... is disabled</code></td><td>Reader/Writer/DBCP 沒 Enable</td><td>到 Controller Services 啟用</td></tr>\n<tr><td><code>Relationship ... is invalid</code></td><td>relationship 未連線也未 auto-terminate</td><td>連到下游或 auto-terminate</td></tr>\n<tr><td><code>required property is missing</code></td><td>必填 property 沒填</td><td>補值後 Apply</td></tr>\n<tr><td><code>Cannot write to database</code></td><td>DB 連線、權限、表格或欄位錯</td><td>查 DBCP 與 DB log</td></tr>\n<tr><td><code>record.error.message</code></td><td>Reader/Writer/schema 錯</td><td>查 failure queue attributes</td></tr>\n</tbody>\n</table>\n<h2 id=\"常用-expression-language\">常用 Expression Language</h2>\n<pre><code class=\"language-text\">${filename:endsWith(&#39;.csv&#39;)}\n${source.system:equals(&#39;training&#39;)}\n${now():format(&quot;yyyyMMddHHmmss&quot;)}\n${fileSize:ge(1000)}\n${uuid}</code></pre>\n<h2 id=\"常用-formatter-expression-language\">常用 Formatter / Expression Language</h2>\n<table>\n<thead><tr><th>需求</th><th>範例</th></tr></thead>\n<tbody>\n<tr><td>字串取代</td><td><code>${field.value:replaceAll(&#39;phone=[0-9-]+&#39;, &#39;phone=***&#39;)}</code></td></tr>\n<tr><td>日期格式轉換</td><td><code>${field.value:toDate(&#39;yyyy-MM-dd HH:mm:ss&#39;):format(&#39;yyyy/MM/dd&#39;)}</code></td></tr>\n<tr><td>補目前時間</td><td><code>${now():format(&quot;yyyy-MM-dd HH:mm:ss&quot;)}</code></td></tr>\n<tr><td>轉大寫</td><td><code>${field.value:toUpper()}</code></td></tr>\n<tr><td>去除前後空白</td><td><code>${field.value:trim()}</code></td></tr>\n</tbody>\n</table>\n<p>注意：在 <code>UpdateRecord</code> 裡，<code>field.value</code> 代表目前正在更新的 record 欄位值；它不是一般 FlowFile attribute。</p>\n<h2 id=\"常用-queryrecord-sql\">常用 QueryRecord SQL</h2>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE</code></pre>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;amount&quot; &gt;= 100</code></pre>\n<pre><code class=\"language-sql\">SELECT &quot;order_id&quot;, &quot;customer&quot;, &quot;status&quot; FROM FLOWFILE WHERE &quot;status&quot; = &#39;CANCELLED&#39;</code></pre>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;order_id&quot; = 1003</code></pre>\n<p>注意：若 <code>CSVReader</code> 使用 <code>Infer Schema</code>，像 <code>order_id</code> 這種全數字欄位可能被推斷成數字，SQL 條件要用 <code>1003</code>。若 schema 明確定義成 string，才用 <code>&#39;1003&#39;</code>。</p>\n<p>保留未命中資料時，建立另一個 relationship：</p>\n<pre><code class=\"language-sql\">SELECT * FROM FLOWFILE WHERE &quot;status&quot; &lt;&gt; &#39;CANCELLED&#39; OR &quot;status&quot; IS NULL</code></pre>\n<p>注意：<code>QueryRecord</code> 的 <code>original</code> 是完整原始 FlowFile，不是不符合條件的 records。不要把 <code>original</code> 當 unmatched 使用，否則可能重複處理 matched records。</p>\n<h2 id=\"常用-executesqlrecord-sql\">常用 ExecuteSQLRecord SQL</h2>\n<p>查 MSSQL table 欄位與型別：</p>\n<pre><code class=\"language-sql\">SELECT\n    ORDINAL_POSITION,\n    COLUMN_NAME,\n    DATA_TYPE,\n    CHARACTER_MAXIMUM_LENGTH,\n    NUMERIC_PRECISION,\n    NUMERIC_SCALE,\n    IS_NULLABLE\nFROM INFORMATION_SCHEMA.COLUMNS\nWHERE TABLE_SCHEMA = &#39;dbo&#39;\n  AND TABLE_NAME = &#39;nifi_training_orders&#39;\nORDER BY ORDINAL_POSITION</code></pre>\n<p>讀取來源 table 資料：</p>\n<pre><code class=\"language-sql\">SELECT\n    order_id,\n    customer,\n    amount,\n    status\nFROM dbo.nifi_training_orders\nORDER BY DbId</code></pre>\n<h2 id=\"常用-recordpath\">常用 RecordPath</h2>\n<pre><code class=\"language-text\">/status\n/customer\n/amount\n/items[*]/sku</code></pre>\n<p>UpdateRecord 常見搭配：</p>\n<table>\n<thead><tr><th>RecordPath</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/status</code></td><td><code>CANCELLED_NORMALIZED</code></td></tr>\n<tr><td><code>/note</code></td><td><code>${field.value:replaceAll(&#39;phone=[0-9-]+&#39;, &#39;phone=***&#39;)}</code></td></tr>\n<tr><td><code>/order_date</code></td><td><code>${field.value:toDate(&#39;yyyy-MM-dd HH:mm:ss&#39;):format(&#39;yyyy/MM/dd&#39;)}</code></td></tr>\n</tbody>\n</table>\n<h2 id=\"processor-排程速查\">Processor 排程速查</h2>\n<table>\n<thead><tr><th>設定</th><th>用途</th><th>入門建議</th></tr></thead>\n<tbody>\n<tr><td><code>Scheduling Strategy = Timer driven</code></td><td>固定間隔執行</td><td>一般練習與簡單輪詢先用這個</td></tr>\n<tr><td><code>Scheduling Strategy = CRON driven</code></td><td>指定時間點執行</td><td>公司批次排程常用</td></tr>\n<tr><td><code>Run Schedule</code></td><td>執行頻率或 CRON 表達式</td><td>練習用 <code>30 sec</code> 或 <code>60 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td>同時執行緒數</td><td>新流程先用 <code>1</code></td></tr>\n<tr><td><code>Execution = Primary Node</code></td><td>cluster 中只在 Primary Node 執行</td><td>避免多節點重複抓同一批資料</td></tr>\n<tr><td><code>Run Duration</code></td><td>延遲與吞吐量取捨</td><td>入門先維持預設</td></tr>\n</tbody>\n</table>\n<p>NiFi CRON 範例：</p>\n<pre><code class=\"language-text\">0/30 * * * * ?        # 每 30 秒\n0 0/5 * * * ?         # 每 5 分鐘\n0 0 1 * * ?           # 每天凌晨 1 點\n0 20 14 ? * MON-FRI   # 週一到週五 14:20</code></pre>\n<p>注意：NiFi CRON 有 seconds 欄位，不是 Linux crontab 常見的 5 欄格式。</p>\n<h2 id=\"cluster-速查\">Cluster 速查</h2>\n<table>\n<thead><tr><th>設定或名詞</th><th>用途</th><th>常見判斷</th></tr></thead>\n<tbody>\n<tr><td><code>Execution = All Nodes</code></td><td>每個 node 都會執行 Processor</td><td>適合可分散處理的資料</td></tr>\n<tr><td><code>Execution = Primary Node</code></td><td>只在 Primary Node 執行 Processor</td><td>適合只應跑一次的排程來源</td></tr>\n<tr><td><code>Load Balance Strategy = Do not load balance</code></td><td>不跨 node 分配 FlowFile</td><td>預設較保守</td></tr>\n<tr><td><code>Load Balance Strategy = Round robin</code></td><td>輪流分配到不同 node</td><td>適合不依賴順序的資料</td></tr>\n<tr><td><code>Load Balance Strategy = Partition by attribute</code></td><td>依 attribute 分配到固定 node</td><td>適合同 key 需要在同 node 處理</td></tr>\n<tr><td><code>Local state</code></td><td>每個 node 各自保存狀態</td><td>可能造成多 node 重複讀資料</td></tr>\n<tr><td><code>Cluster state</code></td><td>cluster 共用狀態</td><td>適合避免重複處理</td></tr>\n</tbody>\n</table>\n<p>公司 cluster 排程先問：這個來源是否只應執行一次？如果是，優先檢查 <code>Execution</code> 是否應為 <code>Primary Node</code>。</p>\n<h2 id=\"auto-terminate-速查\">Auto-terminate 速查</h2>\n<table>\n<thead><tr><th>情境</th><th>建議</th></tr></thead>\n<tbody>\n<tr><td>練習流程的最後一個 <code>success</code></td><td>可以 auto-terminate</td></tr>\n<tr><td><code>LogAttribute</code> 已經是最後觀察點</td><td>可以 auto-terminate <code>success</code></td></tr>\n<tr><td><code>failure</code></td><td>不建議一開始 auto-terminate，先接錯誤處理或 <code>LogAttribute</code></td></tr>\n<tr><td><code>unmatched</code></td><td>先確認是否代表漏接資料，再決定是否 auto-terminate</td></tr>\n<tr><td><code>original</code></td><td>確認不需要原始 FlowFile 後再 auto-terminate</td></tr>\n</tbody>\n</table>\n<p>一句話：auto-terminate 代表這個 relationship 的 FlowFile 到此結束，不是萬用的錯誤忽略開關。</p>\n<p>延伸閱讀：<a href=\"#supplement-auto-terminate\">Auto-terminate 完整說明</a></p>\n<h2 id=\"日常-docker-指令\">日常 Docker 指令</h2>\n<p>以下指令都在專案根目錄執行，也就是目前包含 <code>docker-compose.yaml</code> 的工作目錄。</p>\n<pre><code class=\"language-powershell\">docker compose ps\ndocker compose stop\ndocker compose start\ndocker compose logs --tail=200 nifi\ndocker compose logs -f nifi</code></pre>\n<p>避免：</p>\n<pre><code class=\"language-powershell\">docker compose down -v\ndocker volume prune</code></pre>\n<h2 id=\"排錯順序\">排錯順序</h2>\n<ol>\n<li>看 Processor 是否 invalid。</li>\n<li>看 bulletin。</li>\n<li>看 queue 是否累積。</li>\n<li>打開 queue 檢查 FlowFile attributes/content。</li>\n<li>查 provenance。</li>\n<li>查 <code>docker compose logs --tail=200 nifi</code>。</li>\n<li>查 Controller Service 狀態。</li>\n<li>對照 schema、欄位名稱、relationship。</li>\n</ol>\n<h2 id=\"這份速查表的使用方式\">這份速查表的使用方式</h2>\n<p>這份不是照順序學習的 Lab，而是你做 Lab 或看公司 flow 時用來快速查名詞與排錯方向。</p>\n<p>建議使用方式：</p>\n<ul>\n<li>看不懂 UI 名詞時，先查「基本名詞速查」。</li>\n<li>不知道該用哪個元件時，查「常用 Processor」與「常用 Controller Service」。</li>\n<li>Processor 顯示 invalid 時，先查「常見 invalid 原因」。</li>\n<li>需要排程時，查「Processor 排程速查」。</li>\n<li>資料卡住或結果不對時，照「排錯順序」從上往下檢查。</li>\n</ul>\n<p>如果你在公司專案看到一條陌生 flow，先不要急著改設定。先找出資料從哪個 Processor 進來、經過哪些 connection、卡在哪個 queue、失敗 relationship 有沒有被處理，再決定要看 Processor 設定、Controller Service，還是 provenance。</p>"

    "id": "readme",

    "title": "NiFi 實作入門課程",
    "html": "<h1 id=\"nifi-實作入門課程\">NiFi 實作入門課程</h1>\n<p>這組課程用目前專案的 Docker Compose NiFi 環境練習，目標是讓你能在公司專案中看懂、建立、排錯與維護基本資料流。</p>\n<p>本課程不先大量講理論。每一章都會要求你在 NiFi UI 建一個小流程，跑資料，觀察 queue、attributes、content、bulletin、provenance，再把結果和實務概念對起來。</p>\n<p>每個 Lab 最下方都有「本 Lab 的學習重點回顧」，用來說明整條流程在做什麼、每個 Processor 負責什麼，以及這個練習對公司專案的意義。</p>\n<h2 id=\"課程設計主旨\">課程設計主旨</h2>\n<p>本課程採用「做中學」設計。每個主題都應該先讓你完成一個可執行、可觀察的小流程，再用該流程反推 NiFi 名詞、設定與排錯觀念。</p>\n<p>課程編排原則：</p>\n<ul>\n<li>先實作，再解釋。不要先堆大量理論，最後才操作。</li>\n<li>每個 Lab 都要有明確輸入、處理步驟、輸出或觀察點。</li>\n<li>每次只引入少量新概念，並且要能在 UI、queue、log 或 provenance 中看得到。</li>\n<li>理論說明要服務於當前實作，不寫和當前 Lab 無關的大段背景知識。</li>\n<li>每個 Lab 結尾要回顧整條 flow 在做什麼，避免只照步驟完成卻不知道流程意義。</li>\n<li>每個 Step 都要用「新手是否能從上一個 Step 的狀態直接照做」來檢查；若前一步留下的設定會影響下一步，必須明確寫出要保留、修改或刪除哪些設定。</li>\n<li>NiFi UI 若提供多個獨立 property，就依照 property 語意分開填，不要把外部工具或 SQL 慣用的完整字串硬塞進單一欄位。例如 MSSQL 在 <code>PutDatabaseRecord</code> 要分開填 <code>Database Name</code>、<code>Schema Name</code>、<code>Table Name</code>，不要把 <code>dbo.table_name</code> 全部填到 <code>Table Name</code>。</li>\n<li>補充文檔只用來釐清容易誤解的概念，不取代 Lab 的實作主線。</li>\n</ul>\n<p>課程檔名規則：</p>\n<ul>\n<li>一般主線 Lab 使用 <code>NN-topic.md</code>，例如 <code>01-first-flow.md</code>。</li>\n<li>若某個 Lab 需要延伸成系列課程，改用 <code>NN-00-topic.md</code> 作為主課，後續用 <code>NN-01-topic.md</code>、<code>NN-02-topic.md</code> 擴充。</li>\n<li>文件標題仍使用人類可讀的課程編號，例如 <code># Lab 06：...</code>、<code># Lab 06-1：...</code>、<code># Lab 06-2：...</code>。</li>\n<li>範例：</li>\n<li><code>06-00-database-integration.md</code> 對應 <code>Lab 06</code></li>\n<li><code>06-01-database-read-copy.md</code> 對應 <code>Lab 06-1</code></li>\n<li>未來可新增 <code>06-02-xxx.md</code> 對應 <code>Lab 06-2</code></li>\n</ul>\n<h2 id=\"使用環境\">使用環境</h2>\n<p>先確認容器已啟動：</p>\n<pre><code class=\"language-powershell\">docker compose start\ndocker compose ps</code></pre>\n<p>開啟：</p>\n<ul>\n<li>NiFi UI：<code>https://localhost:8443/nifi</code></li>\n<li>NiFi Registry UI：<code>http://localhost:18080/nifi-registry</code></li>\n</ul>\n<p>登入帳密請看本機 <code>.env</code>，不要把實際密碼寫進文件或 commit。</p>\n<p>注意：課程中的 <code>docker compose ...</code> 指令都要在專案根目錄執行，也就是目前包含 <code>docker-compose.yaml</code> 的工作目錄。若在其他目錄執行，可能會出現 <code>no such service: nifi</code> 或找不到 compose 專案。</p>\n<h2 id=\"產生雙欄式-html-閱讀器\">產生雙欄式 HTML 閱讀器</h2>\n<p>本目錄提供 MDX 版面範本與 MJS 產生器，可將所有課程 Markdown 文件彙整成單一雙欄式 HTML。左欄是可搜尋、可點選的文件目錄，右欄顯示目前選取的課程內容。</p>\n<p>在專案根目錄執行：</p>\n<pre><code class=\"language-powershell\">node docs/nifi-training/mdx/build-training-html.mjs</code></pre>\n<p>輸出檔案：</p>\n<ul>\n<li><code>docs/nifi-training/index.html</code></li>\n</ul>\n<p>產出後可直接用瀏覽器開啟 <code>index.html</code> 閱讀，不需要啟動 NiFi 或安裝額外 npm 套件。</p>\n<h2 id=\"課程路線\">課程路線</h2>\n<p>建議照順序完成：</p>\n<ol>\n<li><a href=\"#00-basic-terms\">Lab 00：NiFi 基本名詞導讀</a></li>\n<li><a href=\"#01-first-flow\">Lab 01：建立第一個 Flow，理解 Processor、Connection、Queue</a></li>\n<li><a href=\"#02-flowfile-attributes-routing\">Lab 02：FlowFile、Attribute、Expression Language 與路由</a></li>\n<li><a href=\"#03-csv-record-reader-writer\">Lab 03：CSV Reader/Writer 與 ConvertRecord</a></li>\n<li><a href=\"#04-query-record-filtering\">Lab 04：QueryRecord 與 Record 層級資料篩選</a></li>\n<li><a href=\"#05-update-record-recordpath\">Lab 05：UpdateRecord、RecordPath 與欄位轉換</a></li>\n<li><a href=\"#06-00-database-integration\">Lab 06：本地 MSSQL 資料庫整合入門</a></li>\n<li><a href=\"#06-01-database-read-copy\">Lab 06-1：從 MSSQL 讀取資料表資訊並複製資料</a></li>\n<li><a href=\"#07-versioning-debug-operations\">Lab 07：版本管理、排錯與日常操作</a></li>\n<li><a href=\"#08-scheduling\">Lab 08：Processor 排程與執行控制</a></li>\n<li><a href=\"#09-clustering\">Lab 09：NiFi Cluster 入門與多節點執行觀念</a></li>\n<li><a href=\"#10-query-format-expression-language\">Lab 10：Query、Formatter 與 Expression Language 實戰</a></li>\n<li><a href=\"#99-cheatsheet\">速查表：常用 Processor 與排錯關鍵字</a></li>\n</ol>\n<h2 id=\"補充閱讀\">補充閱讀</h2>\n<ul>\n<li><a href=\"#supplement-auto-terminate\">Auto-terminate 完整說明</a></li>\n<li><a href=\"#supplement-jdbc-driver\">JDBC Driver Jar 完整說明</a></li>\n<li><a href=\"#supplement-api-endpoints\">NiFi REST API Endpoint 清單</a></li>\n</ul>\n<h2 id=\"每個-lab-的操作原則\">每個 Lab 的操作原則</h2>\n<ul>\n<li>每個 Lab 建議建立獨立 Process Group，例如 <code>training-lab-01</code>。</li>\n<li>Processor 先保持 stopped，全部 validation 通過後再 start。</li>\n<li>練習時不要讓 <code>GenerateFlowFile</code> 跑太快，建議設定 <code>Run Schedule = 60 sec</code>，確認流程後再手動 stop。</li>\n<li>每個 Lab 結束後，先清空 queue 或保留成排錯練習，不要讓測試資料一直累積。</li>\n<li>改 Controller Service 後，若 Processor 顯示 invalid，先確認 service 是否已 <code>Enabled</code>。</li>\n<li>練習題若會沿用同一個 Processor，必須先確認上一題留下的 dynamic property、relationship、auto-terminate 或排程設定是否需要清除。</li>\n</ul>\n<h2 id=\"官方文件依據\">官方文件依據</h2>\n<p>本課程內容已對照 Apache NiFi 2.x 官方文件與元件文件：</p>\n<ul>\n<li>NiFi User Guide：https://nifi.apache.org/nifi-docs/user-guide.html</li>\n<li>NiFi Administration Guide：https://nifi.apache.org/docs/nifi-docs/html/administration-guide.html</li>\n<li>Expression Language Guide：https://nifi.apache.org/docs/nifi-docs/html/expression-language-guide.html</li>\n<li>RecordPath Guide：https://nifi.apache.org/nifi-docs/record-path-guide.html</li>\n<li>CSVReader：https://nifi.apache.org/components/org.apache.nifi.csv.CSVReader/</li>\n<li>CSVRecordSetWriter：https://nifi.apache.org/components/org.apache.nifi.csv.CSVRecordSetWriter/</li>\n<li>ConvertRecord：https://nifi.apache.org/components/org.apache.nifi.processors.standard.ConvertRecord/</li>\n<li>QueryRecord：https://nifi.apache.org/components/org.apache.nifi.processors.standard.QueryRecord/</li>\n<li>UpdateRecord：https://nifi.apache.org/components/org.apache.nifi.processors.standard.UpdateRecord/</li>\n<li>DBCPConnectionPool：https://nifi.apache.org/components/org.apache.nifi.dbcp.DBCPConnectionPool/</li>\n<li>ExecuteSQLRecord：https://nifi.apache.org/components/org.apache.nifi.processors.standard.ExecuteSQLRecord/</li>\n<li>PutDatabaseRecord：https://nifi.apache.org/components/org.apache.nifi.processors.standard.PutDatabaseRecord/</li>\n<li>Microsoft JDBC Driver for SQL Server：https://learn.microsoft.com/en-us/sql/connect/jdbc/microsoft-jdbc-driver-for-sql-server</li>\n<li>SQL Server INFORMATION_SCHEMA.COLUMNS：https://learn.microsoft.com/en-us/sql/relational-databases/system-information-schema-views/columns-transact-sql</li>\n<li>NiFi Registry：https://nifi.apache.org/registry.html</li>\n<li>GitHubFlowRegistryClient：https://nifi.apache.org/components/org.apache.nifi.github.GitHubFlowRegistryClient/</li>\n<li>GitLabFlowRegistryClient：https://nifi.apache.org/components/org.apache.nifi.gitlab.GitLabFlowRegistryClient/</li>\n<li>GitHub Personal Access Tokens：https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens</li>\n</ul>\n<h2 id=\"你應該完成到什麼程度\">你應該完成到什麼程度</h2>\n<p>完成後你應該能做到：</p>\n<ul>\n<li>看懂一條 NiFi flow 的資料怎麼走。</li>\n<li>看懂 FlowFile、Processor、Connection、Relationship、Queue、Controller Service、Provenance 等基本名詞。</li>\n<li>判斷 Processor invalid 是缺 property、Controller Service disabled，還是 relationship 沒處理。</li>\n<li>用 FlowFile Attribute 做基本路由。</li>\n<li>用 CSVReader/CSVRecordSetWriter 處理 CSV。</li>\n<li>用 QueryRecord 對 Record 做 SQL-like 篩選。</li>\n<li>用 UpdateRecord + RecordPath 修改欄位。</li>\n<li>用 Expression Language 對 record 欄位做字串替換、遮罩與日期格式化。</li>\n<li>建立 DBCPConnectionPool，理解 MSSQL JDBC driver、URL、帳密與 validation 的關係。</li>\n<li>用 ExecuteSQLRecord 從 MSSQL 查 table metadata 與資料列。</li>\n<li>用 ExecuteSQLRecord + PutDatabaseRecord 做本地 DB 到本地 DB 的資料複製。</li>\n<li>設定 Timer driven、CRON driven、Concurrent Tasks 與基本執行策略。</li>\n<li>看懂 cluster 中 <code>All Nodes</code>、<code>Primary Node</code>、connection load balancing 與 cluster state 的基本影響。</li>\n<li>用 queue、bulletin、provenance、logs 找錯。</li>\n</ul>"
  },

    "id": "supplement-api-endpoints",
    "file": "supplement-api-endpoints.md",
    "title": "補充：NiFi REST API Endpoint 清單",
    "html": "<h1 id=\"補充-nifi-rest-api-endpoint-清單\">補充：NiFi REST API Endpoint 清單</h1>\n<p>目標：讓你知道 NiFi UI 背後幾乎都可以透過 REST API 操作，並提供目前本機 NiFi 2.9.0 的 endpoint 索引，方便後續公司專案用程式串接。</p>\n<p>這份是補充文檔，不是實作 Lab。建議在 Lab 01 到 Lab 03 熟悉 UI 操作後閱讀。</p>\n<h2 id=\"來源與版本\">來源與版本</h2>\n<p>官方文件已確認 NiFi 提供 REST API，入口文件如下：</p>\n<ul>\n<li>Apache NiFi REST API：https://nifi.apache.org/nifi-docs/rest-api.html</li>\n<li>Apache NiFi Documentation：https://nifi.apache.org/documentation/</li>\n</ul>\n<p>本文件的 endpoint 清單來自你目前本機容器中的 NiFi 2.9.0 swagger 檔：</p>\n<pre><code class=\"language-text\">/opt/nifi/nifi-current/work/jetty/nifi-web-api-2.9.0.war/webapp/docs/rest-api/swagger.json</code></pre>\n<p>本機實測結果：</p>\n<ul>\n<li>NiFi URL：<code>https://localhost:8443/nifi</code></li>\n<li>API base URL：<code>https://localhost:8443/nifi-api</code></li>\n<li>目前 swagger 解析結果：<code>265</code> paths，<code>352</code> operations</li>\n</ul>\n<p>注意：NiFi REST API 會隨版本變動。公司專案若升級 NiFi，應重新用該版本的 swagger 或官方文件確認 endpoint。</p>\n<h2 id=\"api-使用基本流程\">API 使用基本流程</h2>\n<p>目前本機 NiFi 使用 HTTPS + Single User Authentication。呼叫 API 前通常先取得 token。</p>\n<p>PowerShell 範例：</p>\n<pre><code class=\"language-powershell\">$envMap = Get-Content .\\.env | ConvertFrom-StringData\n\n$token = curl.exe -k -s -X POST &quot;https://localhost:8443/nifi-api/access/token&quot; `\n  -H &quot;Content-Type: application/x-www-form-urlencoded&quot; `\n  --data-urlencode &quot;username=$($envMap.NIFI_USERNAME)&quot; `\n  --data-urlencode &quot;password=$($envMap.NIFI_PASSWORD)&quot;</code></pre>\n<p>取得 token 後呼叫 API：</p>\n<pre><code class=\"language-powershell\">curl.exe -k -H &quot;Authorization: Bearer $token&quot; `\n  &quot;https://localhost:8443/nifi-api/flow/current-user&quot;</code></pre>\n<h2 id=\"常見注意事項\">常見注意事項</h2>\n<ul>\n<li><code>GET</code> 多半是查詢。</li>\n<li><code>POST</code> 多半是建立、送出 request、觸發動作。</li>\n<li><code>PUT</code> 多半是更新設定或狀態。</li>\n<li><code>DELETE</code> 多半是刪除或取消 request。</li>\n<li>修改 Processor、Connection、Process Group 等元件時，常會需要帶 <code>revision</code>，避免多人同時修改造成版本衝突。</li>\n<li>啟停 Processor 通常用 <code>PUT /processors/{id}/run-status</code>。</li>\n<li>啟停 Controller Service 通常用 <code>PUT /controller-services/{id}/run-status</code>。</li>\n<li>Queue 列表、下載 content、drop request 走 <code>/flowfile-queues/...</code>。</li>\n<li>Data Provenance 查詢走 <code>/provenance</code> 和 <code>/provenance-events/...</code>。</li>\n<li>Production 程式不要把帳密硬編碼在程式碼中，應使用安全的 secret 管理方式。</li>\n</ul>\n<h2 id=\"常見-api-對應-ui-操作\">常見 API 對應 UI 操作</h2>\n<table>\n<thead><tr><th>UI 操作</th><th>常用 API</th></tr></thead>\n<tbody>\n<tr><td>查目前使用者</td><td><code>GET /flow/current-user</code></td></tr>\n<tr><td>查 root flow</td><td><code>GET /flow/process-groups/root</code></td></tr>\n<tr><td>建立 Processor</td><td><code>POST /process-groups/{id}/processors</code></td></tr>\n<tr><td>更新 Processor</td><td><code>PUT /processors/{id}</code></td></tr>\n<tr><td>啟停 Processor</td><td><code>PUT /processors/{id}/run-status</code></td></tr>\n<tr><td>建立 Connection</td><td><code>POST /process-groups/{id}/connections</code></td></tr>\n<tr><td>查 Connection</td><td><code>GET /connections/{id}</code></td></tr>\n<tr><td>建立 Controller Service</td><td><code>POST /process-groups/{id}/controller-services</code></td></tr>\n<tr><td>啟停 Controller Service</td><td><code>PUT /controller-services/{id}/run-status</code></td></tr>\n<tr><td>查 Queue FlowFile</td><td><code>POST /flowfile-queues/{id}/listing-requests</code></td></tr>\n<tr><td>清空 Queue</td><td><code>POST /flowfile-queues/{id}/drop-requests</code></td></tr>\n<tr><td>查 Bulletin</td><td><code>GET /flow/bulletin-board</code></td></tr>\n<tr><td>查 Provenance</td><td><code>POST /provenance</code></td></tr>\n<tr><td>查 Processor status</td><td><code>GET /flow/processors/{id}/status</code></td></tr>\n<tr><td>查 Process Group status</td><td><code>GET /flow/process-groups/{id}/status</code></td></tr>\n</tbody>\n</table>\n<h2 id=\"取得本機完整-swagger\">取得本機完整 Swagger</h2>\n<p>本機 NiFi 不一定直接對外提供 swagger JSON 下載路徑，但容器內有 swagger 檔。可用以下方式查看：</p>\n<pre><code class=\"language-powershell\">docker exec nifi-service sh -lc &quot;ls -l /opt/nifi/nifi-current/work/jetty/nifi-web-api-2.9.0.war/webapp/docs/rest-api/swagger.json&quot;</code></pre>\n<p>用 PowerShell 解析目前容器內所有 endpoint：</p>\n<pre><code class=\"language-powershell\">$json = docker exec nifi-service sh -lc &quot;cat /opt/nifi/nifi-current/work/jetty/nifi-web-api-2.9.0.war/webapp/docs/rest-api/swagger.json&quot;\n$spec = $json | ConvertFrom-Json\n\n$rows = foreach ($p in $spec.paths.PSObject.Properties) {\n  foreach ($m in $p.Value.PSObject.Properties) {\n    if ($m.Name -match &quot;^(get|post|put|delete)$&quot;) {\n      [PSCustomObject]@{\n        Tag = if ($m.Value.tags) { ($m.Value.tags | Select-Object -First 1) } else { &quot;Other&quot; }\n        Method = $m.Name.ToUpperInvariant()\n        Path = $p.Name\n        Summary = $m.Value.summary\n      }\n    }\n  }\n}\n\n$rows | Sort-Object Tag, Path, Method | Format-Table -AutoSize</code></pre>\n<h2 id=\"endpoint-總覽\">Endpoint 總覽</h2>\n<table>\n<thead><tr><th>分類</th><th>Operations</th></tr></thead>\n<tbody>\n<tr><td>Access</td><td>3</td></tr>\n<tr><td>Authentication</td><td>1</td></tr>\n<tr><td>Connections</td><td>3</td></tr>\n<tr><td>Connectors</td><td>31</td></tr>\n<tr><td>Controller</td><td>46</td></tr>\n<tr><td>Controller Services</td><td>14</td></tr>\n<tr><td>Counters</td><td>3</td></tr>\n<tr><td>DataTransfer</td><td>7</td></tr>\n<tr><td>Flow</td><td>67</td></tr>\n<tr><td>FlowFileQueues</td><td>8</td></tr>\n<tr><td>Funnels</td><td>3</td></tr>\n<tr><td>InputPorts</td><td>5</td></tr>\n<tr><td>Labels</td><td>3</td></tr>\n<tr><td>OutputPorts</td><td>5</td></tr>\n<tr><td>ParameterContexts</td><td>14</td></tr>\n<tr><td>ParameterProviders</td><td>16</td></tr>\n<tr><td>Policies</td><td>5</td></tr>\n<tr><td>ProcessGroups</td><td>34</td></tr>\n<tr><td>Processors</td><td>15</td></tr>\n<tr><td>Provenance</td><td>7</td></tr>\n<tr><td>ProvenanceEvents</td><td>6</td></tr>\n<tr><td>RemoteProcessGroups</td><td>11</td></tr>\n<tr><td>ReportingTasks</td><td>12</td></tr>\n<tr><td>Resources</td><td>1</td></tr>\n<tr><td>SiteToSite</td><td>2</td></tr>\n<tr><td>Snippets</td><td>3</td></tr>\n<tr><td>SystemDiagnostics</td><td>2</td></tr>\n<tr><td>Tenants</td><td>11</td></tr>\n<tr><td>Versions</td><td>14</td></tr>\n</tbody>\n</table>\n<h2 id=\"完整-endpoint-清單\">完整 Endpoint 清單</h2>\n<h3 id=\"access\">Access</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>DELETE</td><td><code>/access/logout</code></td></tr>\n<tr><td>GET</td><td><code>/access/logout/complete</code></td></tr>\n<tr><td>POST</td><td><code>/access/token</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"authentication\">Authentication</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/authentication/configuration</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"connections\">Connections</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>DELETE</td><td><code>/connections/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/connections/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/connections/{id}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"connectors\">Connectors</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>POST</td><td><code>/connectors</code></td></tr>\n<tr><td>GET</td><td><code>/connectors/{connectorId}/flow/process-groups/{processGroupId}</code></td></tr>\n<tr><td>GET</td><td><code>/connectors/{connectorId}/flow/process-groups/{processGroupId}/controller-services</code></td></tr>\n<tr><td>DELETE</td><td><code>/connectors/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/connectors/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/connectors/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/connectors/{id}/apply-update</code></td></tr>\n<tr><td>GET</td><td><code>/connectors/{id}/assets</code></td></tr>\n<tr><td>POST</td><td><code>/connectors/{id}/a </tr>\n<tr><td>GET</td><td><code>/process-groups/{id}/output-ports</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/output-ports</code></td></tr>\n<tr><td>PUT</td><td><code>/process-groups/{id}/paste</code></td></tr>\n<tr><td>GET</td><td><code>/process-groups/{id}/process-groups</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/process-groups</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/process-groups/import</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/process-groups/upload</code></td></tr>\n<tr><td>GET</td><td><code>/process-groups/{id}/processors</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/processors</code></td></tr>\n<tr><td>GET</td><td><code>/process-groups/{id}/remote-process-groups</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/remote-process-groups</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/replace-requests</code></td></tr>\n<tr><td>POST</td><td><code>/process-groups/{id}/snippet-instance</code></td></tr>\n<tr><td>DELETE</td><td><code>/process-groups/replace-requests/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/process-groups/replace-requests/{id}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"processors\">Processors</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>DELETE</td><td><code>/processors/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/processors/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/processors/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/processors/{id}/bulletins/clear-requests</code></td></tr>\n<tr><td>POST</td><td><code>/processors/{id}/config/analysis</code></td></tr>\n<tr><td>POST</td><td><code>/processors/{id}/config/verification-requests</code></td></tr>\n<tr><td>DELETE</td><td><code>/processors/{id}/config/verification-requests/{requestId}</code></td></tr>\n<tr><td>GET</td><td><code>/processors/{id}/config/verification-requests/{requestId}</code></td></tr>\n<tr><td>GET</td><td><code>/processors/{id}/descriptors</code></td></tr>\n<tr><td>GET</td><td><code>/processors/{id}/diagnostics</code></td></tr>\n<tr><td>PUT</td><td><code>/processors/{id}/run-status</code></td></tr>\n<tr><td>GET</td><td><code>/processors/{id}/state</code></td></tr>\n<tr><td>POST</td><td><code>/processors/{id}/state/clear-requests</code></td></tr>\n<tr><td>DELETE</td><td><code>/processors/{id}/threads</code></td></tr>\n<tr><td>POST</td><td><code>/processors/run-status-details/queries</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"provenance\">Provenance</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>POST</td><td><code>/provenance</code></td></tr>\n<tr><td>DELETE</td><td><code>/provenance/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/provenance/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/provenance/lineage</code></td></tr>\n<tr><td>DELETE</td><td><code>/provenance/lineage/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/provenance/lineage/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/provenance/search-options</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"provenanceevents\">ProvenanceEvents</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/provenance-events/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/provenance-events/{id}/content/input</code></td></tr>\n<tr><td>GET</td><td><code>/provenance-events/{id}/content/output</code></td></tr>\n<tr><td>GET</td><td><code>/provenance-events/latest/{componentId}</code></td></tr>\n<tr><td>POST</td><td><code>/provenance-events/latest/replays</code></td></tr>\n<tr><td>POST</td><td><code>/provenance-events/replays</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"remoteprocessgroups\">RemoteProcessGroups</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>DELETE</td><td><code>/remote-process-groups/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/remote-process-groups/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/remote-process-groups/{id}/bulletins/clear-requests</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}/input-ports/{port-id}</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}/input-ports/{port-id}/run-status</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}/output-ports/{port-id}</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}/output-ports/{port-id}/run-status</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/{id}/run-status</code></td></tr>\n<tr><td>GET</td><td><code>/remote-process-groups/{id}/state</code></td></tr>\n<tr><td>PUT</td><td><code>/remote-process-groups/process-group/{id}/run-status</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"reportingtasks\">ReportingTasks</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>DELETE</td><td><code>/reporting-tasks/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/reporting-tasks/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/reporting-tasks/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/reporting-tasks/{id}/bulletins/clear-requests</code></td></tr>\n<tr><td>POST</td><td><code>/reporting-tasks/{id}/config/analysis</code></td></tr>\n<tr><td>POST</td><td><code>/reporting-tasks/{id}/config/verification-requests</code></td></tr>\n<tr><td>DELETE</td><td><code>/reporting-tasks/{id}/config/verification-requests/{requestId}</code></td></tr>\n<tr><td>GET</td><td><code>/reporting-tasks/{id}/config/verification-requests/{requestId}</code></td></tr>\n<tr><td>GET</td><td><code>/reporting-tasks/{id}/descriptors</code></td></tr>\n<tr><td>PUT</td><td><code>/reporting-tasks/{id}/run-status</code></td></tr>\n<tr><td>GET</td><td><code>/reporting-tasks/{id}/state</code></td></tr>\n<tr><td>POST</td><td><code>/reporting-tasks/{id}/state/clear-requests</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"resources\">Resources</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/resources</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"sitetosite\">SiteToSite</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/site-to-site</code></td></tr>\n<tr><td>GET</td><td><code>/site-to-site/peers</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"snippets\">Snippets</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>POST</td><td><code>/snippets</code></td></tr>\n<tr><td>DELETE</td><td><code>/snippets/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/snippets/{id}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"systemdiagnostics\">SystemDiagnostics</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/system-diagnostics</code></td></tr>\n<tr><td>GET</td><td><code>/system-diagnostics/jmx-metrics</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"tenants\">Tenants</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>GET</td><td><code>/tenants/search-results</code></td></tr>\n<tr><td>GET</td><td><code>/tenants/user-groups</code></td></tr>\n<tr><td>POST</td><td><code>/tenants/user-groups</code></td></tr>\n<tr><td>DELETE</td><td><code>/tenants/user-groups/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/tenants/user-groups/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/tenants/user-groups/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/tenants/users</code></td></tr>\n<tr><td>POST</td><td><code>/tenants/users</code></td></tr>\n<tr><td>DELETE</td><td><code>/tenants/users/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/tenants/users/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/tenants/users/{id}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"versions\">Versions</h3>\n<table>\n<thead><tr><th>Method</th><th>Path</th></tr></thead>\n<tbody>\n<tr><td>POST</td><td><code>/versions/active-requests</code></td></tr>\n<tr><td>DELETE</td><td><code>/versions/active-requests/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/versions/active-requests/{id}</code></td></tr>\n<tr><td>DELETE</td><td><code>/versions/process-groups/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/versions/process-groups/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/versions/process-groups/{id}</code></td></tr>\n<tr><td>PUT</td><td><code>/versions/process-groups/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/versions/process-groups/{id}/download</code></td></tr>\n<tr><td>DELETE</td><td><code>/versions/revert-requests/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/versions/revert-requests/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/versions/revert-requests/process-groups/{id}</code></td></tr>\n<tr><td>DELETE</td><td><code>/versions/update-requests/{id}</code></td></tr>\n<tr><td>GET</td><td><code>/versions/update-requests/{id}</code></td></tr>\n<tr><td>POST</td><td><code>/versions/update-requests/process-groups/{id}</code></td></tr>\n</tbody>\n</table>\n<h2 id=\"後續實作建議\">後續實作建議</h2>\n<p>如果公司專案要用程式自動操作 NiFi，建議先從小範圍開始：</p>\n<ol>\n<li>取得 token。</li>\n<li><code>GET /flow/current-user</code> 確認授權正常。</li>\n<li><code>GET /flow/process-groups/root</code> 確認能讀 flow。</li>\n<li><code>GET /process-groups/{id}/processors</code> 找 Processor。</li>\n<li><code>PUT /processors/{id}/run-status</code> 練習啟停。</li>\n<li>再逐步進到建立 Processor、建立 Connection、更新 Controller Service。</li>\n</ol>\n<p>不要一開始就直接寫大量自動化建立整張 flow。NiFi API 需要處理 revision、validation、Controller Service 狀態、relationship、position、component id 等細節，適合從查詢與啟停開始練。</p>"
