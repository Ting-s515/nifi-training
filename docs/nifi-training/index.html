    "id": "supplement-auto-terminate",
    "file": "supplement-auto-terminate.md",
    "title": "補充：Auto-terminate 完整說明",
    "html": "<h1 id=\"補充-auto-terminate-完整說明\">補充：Auto-terminate 完整說明</h1>\n<p>目標：完整理解 NiFi 的 <code>Auto-terminate</code> 是什麼、為什麼需要它、什麼時候可以用、什麼時候不該亂用。</p>\n<p>這份是補充文檔，不是實作 Lab。建議在 Lab 01 做完後閱讀。</p>\n<h2 id=\"一句話定義\">一句話定義</h2>\n<p><code>Auto-terminate</code> 代表：</p>\n<pre><code class=\"language-text\">某個 Processor 的某個 relationship 產生的 FlowFile，到這個出口就結束，不再送往下一個 Processor。</code></pre>\n<p>注意重點是「某個 relationship」，不是整個 Processor。</p>\n<p>同一個 Processor 可能有多個 relationships：</p>\n<table>\n<thead><tr><th>Relationship</th><th>可能意義</th></tr></thead>\n<tbody>\n<tr><td><code>success</code></td><td>處理成功</td></tr>\n<tr><td><code>failure</code></td><td>處理失敗</td></tr>\n<tr><td><code>matched</code></td><td>符合條件</td></tr>\n<tr><td><code>unmatched</code></td><td>不符合條件</td></tr>\n<tr><td><code>original</code></td><td>原始 FlowFile</td></tr>\n</tbody>\n</table>\n<p>你可以讓其中一個 relationship 連到下一個 Processor，也可以讓其中一個 relationship auto-terminate。每個 relationship 都要被明確處理。</p>\n<h2 id=\"用圖理解\">用圖理解</h2>\n<p>以 Lab 01 為例：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; L[LogAttribute]\n    L -- success 自動結束 --&gt; END[FlowFile 生命週期結束]</code></pre>\n<p>這裡發生的事：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生 FlowFile。</li>\n<li>FlowFile 透過 <code>success</code> relationship 送到 <code>LogAttribute</code>。</li>\n<li><code>LogAttribute</code> 寫出 log。</li>\n<li><code>LogAttribute</code> 處理成功後，也會產生 <code>success</code> relationship。</li>\n<li>因為後面沒有下一個 Processor，所以把 <code>LogAttribute</code> 的 <code>success</code> 設成 auto-terminate。</li>\n<li>這筆 FlowFile 到此結束。</li>\n</ol>\n<h2 id=\"如果不設定-auto-terminate-會怎樣\">如果不設定 Auto-terminate 會怎樣</h2>\n<p>NiFi 要求每個 relationship 都必須有去處。</p>\n<p>relationship 的去處只有兩種：</p>\n<pre><code class=\"language-mermaid\">flowchart TD\n    R[Relationship] --&gt; A[連到下一個 Processor]\n    R --&gt; B[Auto-terminate]</code></pre>\n<p>如果某個 relationship 沒有連線，也沒有 auto-terminate，NiFi 會認為 Processor 的輸出沒有人處理。</p>\n<p>結果通常是：</p>\n<ul>\n<li>Processor 變成 invalid。</li>\n<li>Processor 不能正常 start。</li>\n<li>Validation 會提示 relationship 沒有被處理。</li>\n</ul>\n<p>用白話說，NiFi 會問：</p>\n<pre><code class=\"language-text\">這個 Processor 如果產生 success，那 success 的 FlowFile 要去哪裡？</code></pre>\n<p>如果你沒有連線，也沒有 auto-terminate，NiFi 就沒有答案，所以不允許流程執行。</p>\n<h2 id=\"auto-terminate-不是什麼\">Auto-terminate 不是什麼</h2>\n<h3 id=\"不是-processor-停止\">不是 Processor 停止</h3>\n<p>Auto-terminate 不會停止 Processor。</p>\n<p>Processor 是否執行，是由 Start/Stop 與 Scheduling 控制。</p>\n<h3 id=\"不是-connection-queue\">不是 Connection Queue</h3>\n<p>Auto-terminate 不會建立 queue。</p>\n<p>它代表資料不再往下游送，所以也不會進入下一條 connection queue。</p>\n<h3 id=\"不是錯誤忽略開關\">不是錯誤忽略開關</h3>\n<p>不要看到 <code>failure</code> 就直接 auto-terminate。</p>\n<p>如果 <code>failure</code> 被 auto-terminate，錯誤 FlowFile 就結束了。你可能就失去：</p>\n<ul>\n<li>錯誤資料內容</li>\n<li>錯誤 attributes</li>\n<li>重試機會</li>\n<li>告警機會</li>\n<li>後續人工修復依據</li>\n</ul>\n<h2 id=\"什麼時候適合-auto-terminate\">什麼時候適合 Auto-terminate</h2>\n<h3 id=\"練習流程最後一步\">練習流程最後一步</h3>\n<p>例如 Lab 01：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; L[LogAttribute]\n    L -- success 自動結束 --&gt; END[結束]</code></pre>\n<p><code>LogAttribute</code> 已經完成觀察目的，後面沒有下一步，所以可以 auto-terminate <code>success</code>。</p>\n<h3 id=\"明確不需要後續處理的成功結果\">明確不需要後續處理的成功結果</h3>\n<p>例如某個流程最後已經成功寫入目的地：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    P[PutDatabaseRecord] -- success --&gt; END[Auto-terminate]\n    P -- failure --&gt; E[錯誤處理流程]</code></pre>\n<p>這代表成功寫入 DB 後，FlowFile 可以結束；但失敗資料仍要送去錯誤處理。</p>\n<h3 id=\"不需要保留的-original\">不需要保留的 original</h3>\n<p>某些 Processor 會輸出處理後結果，也會保留原始 FlowFile 到 <code>original</code>。</p>\n<p>如果你確定原始資料不需要再追蹤、重放或稽核，才可以 auto-terminate <code>original</code>。</p>\n<h2 id=\"什麼時候不建議-auto-terminate\">什麼時候不建議 Auto-terminate</h2>\n<h3 id=\"failure\">failure</h3>\n<p>公司專案中，<code>failure</code> 通常應該接到：</p>\n<ul>\n<li><code>LogAttribute</code></li>\n<li>錯誤 queue</li>\n<li>錯誤檔案輸出</li>\n<li>告警流程</li>\n<li>重試流程</li>\n</ul>\n<p>建議：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    P[Processor] -- failure --&gt; L[LogAttribute]\n    L --&gt; E[錯誤處理或保留]</code></pre>\n<p>不要一開始就：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    P[Processor] -- failure 自動結束 --&gt; END[錯誤資料結束]</code></pre>\n<p>除非你已經非常確定這種 failure 可以被丟棄，而且公司流程允許。</p>\n<h3 id=\"unmatched\">unmatched</h3>\n<p><code>unmatched</code> 代表資料沒有符合條件。</p>\n<p>這不一定是正常，也可能代表：</p>\n<ul>\n<li>條件寫錯</li>\n<li>資料格式變了</li>\n<li>新狀態沒有被流程涵蓋</li>\n<li>上游資料異常</li>\n</ul>\n<p>建議先接到 <code>LogAttribute</code> 或錯誤觀察流程，確認真的不需要後續處理後，再考慮 auto-terminate。</p>\n<h3 id=\"不熟悉的-relationship\">不熟悉的 relationship</h3>\n<p>如果你不確定某個 relationship 代表什麼，不要先 auto-terminate。</p>\n<p>先做：</p>\n<ol>\n<li>查看 Processor 官方文件。</li>\n<li>暫時接 <code>LogAttribute</code>。</li>\n<li>跑少量測試資料。</li>\n<li>看 attributes、content、provenance。</li>\n<li>確認後再決定要連下游或 auto-terminate。</li>\n</ol>\n<h2 id=\"relationship-決策表\">Relationship 決策表</h2>\n<table>\n<thead><tr><th>問題</th><th>決策</th></tr></thead>\n<tbody>\n<tr><td>這個 relationship 的資料還要給下一步處理嗎？</td><td>連到下一個 Processor</td></tr>\n<tr><td>這個 relationship 是流程最後成功結果嗎？</td><td>可以 auto-terminate</td></tr>\n<tr><td>這個 relationship 是錯誤資料嗎？</td><td>先連到錯誤處理</td></tr>\n<tr><td>這個 relationship 是不符合條件資料嗎？</td><td>先觀察，不要急著丟</td></tr>\n<tr><td>這個 relationship 是原始資料嗎？</td><td>依稽核與重放需求決定</td></tr>\n<tr><td>我不確定它代表什麼嗎？</td><td>不要 auto-terminate，先接 <code>LogAttribute</code></td></tr>\n</tbody>\n</table>\n<h2 id=\"lab-01-對照\">Lab 01 對照</h2>\n<p>Lab 01 中有兩個 Processor：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; L[LogAttribute]\n    L -- success 自動結束 --&gt; END[結束]</code></pre>\n<p><code>GenerateFlowFile</code> 的 <code>success</code>：</p>\n<ul>\n<li>有連到 <code>LogAttribute</code></li>\n<li>所以不需要 auto-terminate</li>\n</ul>\n<p><code>LogAttribute</code> 的 <code>success</code>：</p>\n<ul>\n<li>後面沒有下一步</li>\n<li>所以要 auto-terminate</li>\n</ul>\n<p>如果 <code>LogAttribute</code> 的 <code>success</code> 不連線也不 auto-terminate：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; L[LogAttribute]\n    L -- success --&gt; M[沒有去處]</code></pre>\n<p>NiFi 會判定 <code>LogAttribute</code> invalid，因為它成功處理後產生的 FlowFile 沒有任何去處。</p>\n<h2 id=\"公司專案建議\">公司專案建議</h2>\n<p>在公司專案中，新增 Processor 後不要只為了讓 validation 通過就亂勾 auto-terminate。</p>\n<p>比較安全的順序：</p>\n<ol>\n<li>看 Processor 有哪些 relationships。</li>\n<li>判斷每個 relationship 的業務意義。</li>\n<li>成功資料接到下一步或流程結尾。</li>\n<li>錯誤資料接錯誤處理流程。</li>\n<li>不確定的 relationship 先接 <code>LogAttribute</code> 或暫存 queue。</li>\n<li>確認不需要後續處理後，才 auto-terminate。</li>\n</ol>\n<h2 id=\"一分鐘總結\">一分鐘總結</h2>\n<p>記住這句：</p>\n<pre><code class=\"language-text\">每個 relationship 都要有去處，不是連到下一個 Processor，就是 auto-terminate。</code></pre>\n<p>再記住這句：</p>\n<pre><code class=\"language-text\">Auto-terminate 是流程結束點，不是錯誤忽略開關。</code></pre>\n<p>最後記住：</p>\n<pre><code class=\"language-text\">success 可以視情況結束，failure 通常要先保留或處理。</code></pre>"
  },
  {
    "id": "supplement-jdbc-driver",
    "file": "supplement-jdbc-driver.md",
    "title": "補充：JDBC Driver Jar 完整說明",
    "html": "<h1 id=\"補充-jdbc-driver-jar-完整說明\">補充：JDBC Driver Jar 完整說明</h1>\n<p>這份補充文件用 Lab 06 的 MSSQL 連線當例子，說明 JDBC driver jar 是什麼、為什麼 NiFi 需要它，以及它和連線字串的差異。</p>\n<h2 id=\"基本定義\">基本定義</h2>\n<p>JDBC driver jar 是一個 Java library，讓 NiFi 這種 Java 程式可以連到特定資料庫。</p>\n<p>以 MSSQL 為例：</p>\n<pre><code class=\"language-text\">NiFi / Java 程式\n  -&gt; JDBC API\n  -&gt; MSSQL JDBC Driver\n  -&gt; SQL Server 網路協定\n  -&gt; MSSQL</code></pre>\n<p>NiFi 知道如何使用 JDBC API，但不知道每一種資料庫的細節。MSSQL、MySQL、PostgreSQL 的連線協定、metadata 查詢方式、錯誤碼與型別轉換都不同，所以需要各自的 JDBC driver。</p>\n<h2 id=\"用硬體驅動比喻\">用硬體驅動比喻</h2>\n<p>可以把 JDBC driver 想成資料庫的驅動程式。</p>\n<pre><code class=\"language-text\">主機板 / 作業系統\n  -&gt; 需要硬體驅動程式\n  -&gt; 才知道怎麼跟顯卡、網卡、印表機溝通\n\nNiFi / Java\n  -&gt; 需要 JDBC driver\n  -&gt; 才知道怎麼跟 MSSQL、MySQL、PostgreSQL 溝通</code></pre>\n<p>更精準一點：</p>\n<ul>\n<li>NiFi 就像作業系統上的應用程式。</li>\n<li>JDBC API 就像一套標準插槽規格。</li>\n<li>JDBC driver 就像資料庫的驅動程式。</li>\n<li>MSSQL 就像某個特定硬體設備。</li>\n</ul>\n<p>NiFi 只知道「我要透過 JDBC 連資料庫」，但不同資料庫的細節不同：</p>\n<table>\n<thead><tr><th>資料庫</th><th>JDBC URL 格式</th></tr></thead>\n<tbody>\n<tr><td>MSSQL</td><td><code>jdbc:sqlserver://...</code></td></tr>\n<tr><td>MySQL</td><td><code>jdbc:mysql://...</code></td></tr>\n<tr><td>PostgreSQL</td><td><code>jdbc:postgresql://...</code></td></tr>\n</tbody>\n</table>\n<p>所以 NiFi 需要對應 driver 才知道：</p>\n<ul>\n<li>怎麼解析這種 URL。</li>\n<li>怎麼建立連線。</li>\n<li>怎麼送 SQL。</li>\n<li>怎麼讀資料表欄位資訊。</li>\n<li>怎麼把錯誤回傳給 NiFi。</li>\n</ul>\n<p>一句話：JDBC driver 就是 NiFi 連接特定資料庫時需要的資料庫驅動程式。</p>\n<h2 id=\"三個設定要一起看\">三個設定要一起看</h2>\n<p>在 <code>DBCPConnectionPool</code> 裡，這三個 property 是一組：</p>\n<table>\n<thead><tr><th>Property</th><th>作用</th><th>MSSQL 範例</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td>說明要連哪裡、哪個 database、使用哪些連線參數</td><td><code>jdbc:sqlserver://host.docker.internal:1433;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td>指定使用哪個 Java driver class</td><td><code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code></td></tr>\n<tr><td><code>Database Driver Locations</code></td><td>指定 driver jar 在 NiFi container 內的位置</td><td><code>/tmp/mssql-jdbc.jar</code></td></tr>\n</tbody>\n</table>\n<p>連線字串不能取代 JDBC driver。連線字串只是地址與參數；driver 才是實際理解 MSSQL 協定並建立連線的元件。</p>\n<h2 id=\"jar-檔要放在哪裡\">Jar 檔要放在哪裡</h2>\n<p>NiFi 跑在 Docker container 裡，所以 driver jar 必須放在 container 看得到的位置。</p>\n<p>在本課程中，做法是把 Windows 專案根目錄的 jar 掛到 container 內：</p>\n<pre><code class=\"language-yaml\">- &quot;./mssql-jdbc-13.4.0.jre11.jar:/tmp/mssql-jdbc.jar&quot;</code></pre>\n<p>這代表：</p>\n<table>\n<thead><tr><th>位置</th><th>意義</th></tr></thead>\n<tbody>\n<tr><td><code>./mssql-jdbc-13.4.0.jre11.jar</code></td><td>Windows 專案根目錄的檔案</td></tr>\n<tr><td><code>/tmp/mssql-jdbc.jar</code></td><td>NiFi container 裡看到的檔案</td></tr>\n</tbody>\n</table>\n<p>所以 <code>DBCPConnectionPool</code> 的 <code>Database Driver Locations</code> 要填：</p>\n<pre><code class=\"language-text\">/tmp/mssql-jdbc.jar</code></pre>\n<p>不要填 Windows 路徑，例如 <code>C:\\work_project\\nifi\\mssql-jdbc-13.4.0.jre11.jar</code>。NiFi container 看不到這個 Windows 路徑。</p>\n<h2 id=\"與-lab-的對照\">與 Lab 的對照</h2>\n<p>Lab 06 會用 <code>PutDatabaseRecord</code> 把 CSV records 寫入 MSSQL。</p>\n<p>整條關係是：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    P[PutDatabaseRecord] -. 使用 .-&gt; C[DBCPConnectionPool]\n    C -. 讀取 .-&gt; J[mssql-jdbc jar]\n    C -. 連線字串 .-&gt; DB[(MSSQL)]</code></pre>\n<p>對照設定：</p>\n<ol>\n<li><code>PutDatabaseRecord</code> 不直接保存 MSSQL driver 資訊。</li>\n<li><code>PutDatabaseRecord</code> 透過 <code>Database Connection Pooling Service</code> 使用 <code>DBCPConnectionPool</code>。</li>\n<li><code>DBCPConnectionPool</code> 透過 <code>Database Driver Locations</code> 載入 jar。</li>\n<li><code>DBCPConnectionPool</code> 透過 <code>Database Connection URL</code> 連到 MSSQL。</li>\n<li>MSSQL 回傳成功或錯誤，<code>PutDatabaseRecord</code> 再決定 FlowFile 走 <code>success</code> 或 <code>failure</code>。</li>\n</ol>\n<h2 id=\"常見判斷\">常見判斷</h2>\n<table>\n<thead><tr><th>情境</th><th>判斷</th></tr></thead>\n<tbody>\n<tr><td><code>Database Driver Locations</code> 填 Windows 路徑</td><td>錯，應填 container 內路徑</td></tr>\n<tr><td>只有連線字串，沒有 jar</td><td>不夠，NiFi 無法載入 MSSQL driver</td></tr>\n<tr><td>jar 已掛載，但 driver class 打錯</td><td>仍會失敗，class name 必須正確</td></tr>\n<tr><td>URL host 用 <code>localhost</code></td><td>在 container 內代表 NiFi 自己，不是 Windows 主機</td></tr>\n<tr><td>URL databaseName 不存在</td><td>連線或執行時會失敗，要先建立 database</td></tr>\n</tbody>\n</table>\n<h2 id=\"一分鐘總結\">一分鐘總結</h2>\n<p>JDBC driver jar 是 NiFi 和資料庫之間的轉譯器。</p>\n<pre><code class=\"language-text\">Connection URL  = 要連哪裡\nDriver Class    = 用哪個 driver\nDriver Location = driver jar 放哪裡</code></pre>\n<p>三個都正確，NiFi 才能真正連到 MSSQL。</p>"
  }
]
    </script>
    <script>
      const documents = JSON.parse(document.getElementById("documents-data").textContent);
      const toc = document.getElementById("toc");
      const article = document.getElementById("article");
      const search = document.getElementById("search");
      const currentFile = document.getElementById("current-file");
      const previous = document.getElementById("previous");
      const next = document.getElementById("next");

      let currentIndex = 0;
      let visibleDocuments = documents;

      function setDocument(index, shouldPushHash = true) {
        const documentItem = visibleDocuments[index] || documents[0];
        currentIndex = documents.findIndex((item) => item.id === documentItem.id);
        article.innerHTML = documentItem.html;
        currentFile.textContent = documentItem.file;

        for (const button of toc.querySelectorAll("button")) {
          button.setAttribute("aria-current", button.dataset.id === documentItem.id ? "page" : "false");
        }

        if (shouldPushHash) {
          history.replaceState(null, "", `#${documentItem.id}`);
        }

        previous.disabled = currentIndex <= 0;
        next.disabled = currentIndex >= documents.length - 1;
        article.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      function renderToc() {
        toc.innerHTML = "";

        if (visibleDocuments.length === 0) {
          toc.innerHTML = '<div class="empty">沒有符合的文件</div>';
          return;
        }

        for (const documentItem of visibleDocuments) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "toc__button";
          button.dataset.id = documentItem.id;
          button.appendChild(document.createTextNode(documentItem.title));

          const file = document.createElement("span");
          file.className = "toc__file";
          file.textContent = documentItem.file;
          button.appendChild(file);

          button.addEventListener("click", () => {
            const nextIndex = visibleDocuments.findIndex((item) => item.id === documentItem.id);
            setDocument(nextIndex);
          });
          toc.appendChild(button);
        }
      }

      search.addEventListener("input", () => {
        const keyword = search.value.trim().toLowerCase();
        visibleDocuments = documents.filter((item) => {
          return item.title.toLowerCase().includes(keyword) || item.file.toLowerCase().includes(keyword);
        });
        renderToc();
        const activeInResult = visibleDocuments.findIndex((item) => item.id === documents[currentIndex].id);
        if (activeInResult >= 0) {
          setDocument(activeInResult, false);
        }
      });

      previous.addEventListener("click", () => {
        if (currentIndex > 0) {
          visibleDocuments = documents;
          search.value = "";
          renderToc();
          setDocument(currentIndex - 1);
        }
      });

      next.addEventListener("click", () => {
        if (currentIndex < documents.length - 1) {
          visibleDocuments = documents;
          search.value = "";
          renderToc();
          setDocument(currentIndex + 1);
        }
      });

      window.addEventListener("hashchange", () => {
        const nextId = decodeURIComponent(location.hash.replace(/^#/, ""));
        const nextIndex = documents.findIndex((item) => item.id === nextId);
        if (nextIndex >= 0) {
          visibleDocuments = documents;
          search.value = "";
          renderToc();
          setDocument(nextIndex, false);
        }
      });

      renderToc();

      const initialId = decodeURIComponent(location.hash.replace(/^#/, ""));
      const initialIndex = documents.findIndex((item) => item.id === initialId);
      setDocument(initialIndex >= 0 ? initialIndex : 0, initialIndex >= 0);
    </script>
  </body>
</html>
