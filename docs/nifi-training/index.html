    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f4;
        --surface: #ffffff;
        --surface-muted: #eef2ee;
        --border: #d8ddd6;
        --text: #1f2933;
        --muted: #647067;
        --accent: #0f766e;
        --accent-strong: #0b5f59;
        --accent-soft: #d9f2ee;

        --code-text: #eef6f8;
        --warning: #a15c07;

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Segoe UI",
          "Noto Sans TC",

          system-ui,

        color: var(--accent-strong);
      }

      .reader {

        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }

      .sidebar__header {
        padding: 24px 20px 18px;
        border-bottom: 1px solid var(--border);
      }

      .sidebar__title {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.35;
      }

      .sidebar__meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .search {
        width: 100%;
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        color: var(--text);
        background: var(--surface-muted);
        font: inherit;
      }

      .toc {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px;
      }

      .toc__button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        text-align: left;
      }

      .toc__button:hover {
        background: var(--surface-muted);
      }

      .toc__button[aria-current="page"] {
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-weight: 700;
      }

      .toc__file {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;

        top: 0;
        z-index: 5;

        padding: 10px 32px;
        background: rgba(246, 247, 244, 0.94);
        backdrop-filter: blur(10px);

        color: var(--muted);

        font: inherit;

        color: #24313a;

        font-size: 0.92em;

        border-radius: 8px;
        padding: 16px;
        background: var(--code-bg);
        color: var(--code-text);
      }

      .article pre code {
        padding: 0;
        background: transparent;
        color: inherit;
      }

      .article table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;

        background: var(--surface-muted);
        text-align: left;

        margin-left: 0;

        background: #fff8eb;
        color: #4d3924;

    "html": "<h1 id=\"lab-00-nifi-基本名詞導讀\">Lab 00：NiFi 基本名詞導讀</h1>\n<p>目標：先看懂 NiFi UI 常見名詞，避免進入實作 Lab 時不知道畫面上的字代表什麼。</p>\n<p>預估時間：25 分鐘。</p>\n<p>這份不是純字典。每個名詞都會用三個角度說明：</p>\n<ul>\n<li>你在 UI 哪裡看到它。</li>\n<li>它在資料流中代表什麼。</li>\n<li>實作時最常踩到什麼問題。</li>\n</ul>\n<h2 id=\"一張圖先看整體\">一張圖先看整體</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    subgraph PG[Process Group]\n        PA[Processor A]\n        Q[Connection Queue]\n        PB[Processor B]\n        CS[Controller Service&lt;/br&gt;CSVReader / DBCPConnectionPool]\n        PA -- relationship --&gt; Q\n        Q -- relationship --&gt; PB\n        Q -. FlowFile 等待下游處理 .-&gt; PB\n        PA -. 使用 .-&gt; CS\n    end</code></pre>\n<p>NiFi 的基本想法是：資料被包成 <code>FlowFile</code>，沿著 <code>Processor</code> 之間的 <code>Connection</code> 往下游移動。每個 Processor 處理完後，會把資料丟到不同 <code>Relationship</code>，例如 <code>success</code>、<code>failure</code>、<code>matched</code>、<code>unmatched</code>。</p>\n<h2 id=\"flowfile\">FlowFile</h2>\n<p>你可以把 <code>FlowFile</code> 想成 NiFi 裡的一筆資料包裹。</p>\n<p>它包含兩部分：</p>\n<table>\n<thead><tr><th>部分</th><th>說明</th><th>範例</th></tr></thead>\n<tbody>\n<tr><td>Content</td><td>真正的資料內容</td><td>CSV、JSON、XML、binary file</td></tr>\n<tr><td>Attributes</td><td>metadata</td><td><code>filename</code>、<code>uuid</code>、<code>mime.type</code>、<code>record.count</code></td></tr>\n</tbody>\n</table>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Queue 的 <code>List queue</code></li>\n<li>Provenance event details</li>\n<li><code>LogAttribute</code> 的 log</li>\n</ul>\n<p>常見誤解：</p>\n<ul>\n<li><code>UpdateAttribute</code> 改的是 attributes，不會改 CSV/JSON 內容。</li>\n<li><code>UpdateRecord</code>、<code>ConvertRecord</code>、<code>QueryRecord</code> 才是在處理 content 裡的 records。</li>\n</ul>\n<h2 id=\"processor\">Processor</h2>\n<p><code>Processor</code> 是 NiFi 的處理節點。</p>\n<p>常見 Processor：</p>\n<table>\n<thead><tr><th>Processor</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td><code>GenerateFlowFile</code></td><td>產生測試資料</td></tr>\n<tr><td><code>LogAttribute</code></td><td>印出 FlowFile attributes/content</td></tr>\n<tr><td><code>UpdateAttribute</code></td><td>修改 attributes</td></tr>\n<tr><td><code>RouteOnAttribute</code></td><td>根據 attributes 分流</td></tr>\n<tr><td><code>ConvertRecord</code></td><td>用 Reader/Writer 轉換格式</td></tr>\n<tr><td><code>QueryRecord</code></td><td>查詢 content 裡的 records</td></tr>\n<tr><td><code>PutDatabaseRecord</code></td><td>寫入資料庫</td></tr>\n</tbody>\n</table>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Canvas 上的方塊。</li>\n<li>Processor 設定裡的 <code>Settings</code>、<code>Scheduling</code>、<code>Properties</code>、<code>Relationships</code>。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>Processor 顯示 invalid，多半是必填 property 沒填、relationship 沒處理、Controller Service disabled。</li>\n<li>Processor stopped 不代表壞掉，只是目前不執行。</li>\n<li>Processor running 也不代表有資料處理，要看 queue 與 stats。</li>\n</ul>\n<h2 id=\"connection\">Connection</h2>\n<p><code>Connection</code> 是 Processor 之間的線。</p>\n<p>它代表：</p>\n<ul>\n<li>上游資料要送到哪個下游。</li>\n<li>哪些 relationship 會走這條線。</li>\n<li>中間 queue 的保存位置。</li>\n</ul>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Processor 之間的連線。</li>\n<li>線上顯示的 queue 數量與資料大小。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>Connection 上 queue 數字一直增加，表示下游處理不完、下游停止、下游 invalid，或排程太慢。</li>\n<li>Connection 可以設定 back pressure，避免資料無限制累積。</li>\n</ul>\n<h2 id=\"relationship\">Relationship</h2>\n<p><code>Relationship</code> 是 Processor 處理結果的出口名稱。</p>\n<p>常見 relationship：</p>\n<table>\n<thead><tr><th>Relationship</th><th>意義</th></tr></thead>\n<tbody>\n<tr><td><code>success</code></td><td>成功</td></tr>\n<tr><td><code>failure</code></td><td>失敗</td></tr>\n<tr><td><code>matched</code></td><td>符合條件</td></tr>\n<tr><td><code>unmatched</code></td><td>不符合條件</td></tr>\n<tr><td><code>original</code></td><td>原始 FlowFile</td></tr>\n</tbody>\n</table>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>建立 connection 時要選 relationship。</li>\n<li>Processor 設定的 <code>Relationships</code> 分頁。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>每個 relationship 都要連出去或 auto-terminate。</li>\n<li>忘記處理 <code>failure</code>，錯誤資料可能卡住或 Processor invalid。</li>\n<li><code>QueryRecord</code> 這類 Processor 可能會產生 dynamic relationship。</li>\n</ul>\n<h2 id=\"auto-terminate\">Auto-terminate</h2>\n<p><code>Auto-terminate</code> 代表這個 relationship 產生的 FlowFile 到此結束，不再送往下一個 Processor。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Processor 設定的 <code>Relationships</code> 分頁。</li>\n<li>每個 relationship 旁邊可以勾選 auto-terminate。</li>\n</ul>\n<p>它的作用：</p>\n<ul>\n<li>明確告訴 NiFi：這個出口的資料不用再往下游送。</li>\n<li>讓 Processor validation 通過，因為 NiFi 要求每個 relationship 都必須被處理。</li>\n<li>適合用在練習流程或真的不需要保留的成功結果。</li>\n</ul>\n<p>重要觀念：</p>\n<ul>\n<li>Auto-terminate 不是單純「忽略錯誤」。</li>\n<li>Auto-terminate 後，該 relationship 的 FlowFile 生命週期會結束。</li>\n<li><code>failure</code> 不建議一開始就 auto-terminate，否則錯誤資料和錯誤原因會不容易追。</li>\n</ul>\n<p>常見判斷：</p>\n<table>\n<thead><tr><th>Relationship</th><th>新手練習</th><th>公司專案</th></tr></thead>\n<tbody>\n<tr><td><code>success</code></td><td>若只是觀察結果，可 auto-terminate</td><td>通常送到下一步或目的地</td></tr>\n<tr><td><code>failure</code></td><td>建議先接 <code>LogAttribute</code> 或錯誤 queue</td><td>通常接錯誤處理、告警、重試</td></tr>\n<tr><td><code>original</code></td><td>若已不需要原始資料，可 auto-terminate</td><td>視稽核、重放、追蹤需求決定</td></tr>\n<tr><td><code>unmatched</code></td><td>練習時可 auto-terminate</td><td>通常要確認是否代表漏接資料</td></tr>\n</tbody>\n</table>\n<p>延伸閱讀：<a href=\"#supplement-auto-terminate\">Auto-terminate 完整說明</a></p>\n<h2 id=\"queue\">Queue</h2>\n<p><code>Queue</code> 是 Connection 裡等待被下游處理的 FlowFile。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Connection 上的數字，例如 <code>3 (12 KB)</code>。</li>\n<li>右鍵 connection 可進入 <code>List queue</code>。</li>\n</ul>\n<p>你可以做什麼：</p>\n<ul>\n<li>看 FlowFile attributes。</li>\n<li>看 content。</li>\n<li>刪除測試資料。</li>\n<li>在排錯時確認資料卡在哪裡。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>新手常以為資料不見了，其實只是停在 queue。</li>\n<li>下游 Processor 沒有 start，queue 就會累積。</li>\n<li>排程太密或 concurrent tasks 太高，也可能讓 queue 快速累積。</li>\n</ul>\n<h2 id=\"back-pressure\">Back Pressure</h2>\n<p><code>Back Pressure</code> 是 queue 的保護機制。</p>\n<p>它可以設定：</p>\n<ul>\n<li>最多幾筆 FlowFile。</li>\n<li>最多多少資料大小。</li>\n</ul>\n<p>達到門檻後，上游會被壓住，避免整個 NiFi 被資料塞爆。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Connection 設定。</li>\n<li>Queue 滿時，connection 會有明顯提示。</li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>Back pressure 不是錯誤，它是保護。</li>\n<li>如果常常觸發 back pressure，要查下游效能、排程頻率、DB/API 速度。</li>\n</ul>\n<h2 id=\"controller-service\">Controller Service</h2>\n<p><code>Controller Service</code> 是可被多個 Processor 共用的設定或資源。</p>\n<p>常見 Controller Service：</p>\n<table>\n<thead><tr><th>Service</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td><code>CSVReader</code></td><td>讀 CSV 成 records</td></tr>\n<tr><td><code>CSVRecordSetWriter</code></td><td>把 records 寫成 CSV</td></tr>\n<tr><td><code>JsonTreeReader</code></td><td>讀 JSON 成 records</td></tr>\n<tr><td><code>DBCPConnectionPool</code></td><td>DB 連線池</td></tr>\n</tbody>\n</table>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Process Group 的 <code>Configure</code> &gt; <code>Controller Services</code>。</li>\n<li>Processor properties 裡選 Reader、Writer、DBCP。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>Controller Service 必須 <code>Enabled</code>，Processor 才能使用。</li>\n<li>改 service 設定前，通常要先 disable。</li>\n<li>不同 Process Group 的 service 範圍不同，要確認 Processor 是否選到正確那個。</li>\n</ul>\n<h2 id=\"process-group\">Process Group</h2>\n<p><code>Process Group</code> 是用來收納一組 Processor 的資料流資料夾。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Canvas 上可進入的群組。</li>\n<li>公司專案通常會用 Process Group 切功能、來源系統或批次流程。</li>\n</ul>\n<p>實務用途：</p>\n<ul>\n<li>讓大 flow 不會全部攤在 root canvas。</li>\n<li>可以針對一整組 flow 做版本管理。</li>\n<li>可以設定該群組自己的 Controller Services。</li>\n</ul>\n<p>建議：</p>\n<ul>\n<li>每個功能或資料來源建一個清楚命名的 Process Group。</li>\n<li>練習課程用 <code>training-lab-xx</code>，避免和公司流程混在一起。</li>\n</ul>\n<h2 id=\"port\">Port</h2>\n<p><code>Port</code> 是 Process Group 的入口或出口。</p>\n<p>常見類型：</p>\n<table>\n<thead><tr><th>Port</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td>Input Port</td><td>讓外層資料進入 Process Group</td></tr>\n<tr><td>Output Port</td><td>讓 Process Group 內資料送回外層</td></tr>\n</tbody>\n</table>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Process Group 內外連線時。</li>\n<li>大型 flow 拆多層時。</li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>Port 可以讓 Process Group 像模組一樣被串接。</li>\n<li>命名要清楚，例如 <code>raw-orders-in</code>、<code>valid-orders-out</code>、<code>failed-orders-out</code>。</li>\n</ul>\n<h2 id=\"funnel\">Funnel</h2>\n<p><code>Funnel</code> 是匯流點，用來把多條 connection 合併成一條。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Canvas 上的小漏斗圖示。</li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>Funnel 不處理資料，只整理線路。</li>\n<li>多個 Processor 的 failure 都要送到同一條錯誤流程時很常用。</li>\n</ul>\n<h2 id=\"bulletin\">Bulletin</h2>\n<p><code>Bulletin</code> 是 NiFi UI 上的錯誤或警告提示。</p>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Processor 右上角的小提示 icon。</li>\n<li>Bulletin board。</li>\n</ul>\n<p>常見內容：</p>\n<ul>\n<li>Controller Service disabled。</li>\n<li>DB connection failed。</li>\n<li>schema 不符合。</li>\n<li>file path 不存在。</li>\n<li>權限錯誤。</li>\n</ul>\n<p>排錯方式：</p>\n<ol>\n<li>先看 bulletin 文字。</li>\n<li>找出 Processor 名稱與錯誤關鍵字。</li>\n<li>再看 queue、provenance、logs。</li>\n</ol>\n<h2 id=\"data-provenance\">Data Provenance</h2>\n<p><code>Data Provenance</code> 是資料流經歷史紀錄。</p>\n<p>它能回答：</p>\n<ul>\n<li>這筆資料從哪裡來。</li>\n<li>經過哪些 Processor。</li>\n<li>哪一步修改了 attributes 或 content。</li>\n<li>哪一步失敗。</li>\n</ul>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>右上角 Global Menu 的 <code>Data Provenance</code>。</li>\n<li>Processor 右鍵也能看相關 provenance。</li>\n</ul>\n<p>實務用途：</p>\n<ul>\n<li>查 production 資料問題。</li>\n<li>比對轉換前後 content。</li>\n<li>找出資料在哪一步被 route 到 failure。</li>\n</ul>\n<h2 id=\"parameter-parameter-context\">Parameter / Parameter Context</h2>\n<p><code>Parameter</code> 是可重複使用的設定值。</p>\n<p>常見用途：</p>\n<ul>\n<li>DB host</li>\n<li>schema name</li>\n<li>API URL</li>\n<li>S3 bucket</li>\n<li>batch size</li>\n</ul>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li>Parameter Context 設定。</li>\n<li>Processor property 裡使用 <code>#{parameter.name}</code>。</li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>不同環境可以用不同 Parameter Context，例如 dev、staging、prod。</li>\n<li>帳密或敏感值要依公司規範管理，不要寫在文件或 commit。</li>\n</ul>\n<h2 id=\"record\">Record</h2>\n<p><code>Record</code> 是 NiFi 對結構化資料的一列資料的抽象。</p>\n<p>例如 CSV：</p>\n<pre><code class=\"language-csv\">order_id,customer,amount\n1001,Alice,120.50\n1002,Bob,35.00</code></pre>\n<p>這裡有兩筆 records。</p>\n<p>常見 Record Processor：</p>\n<ul>\n<li><code>ConvertRecord</code></li>\n<li><code>QueryRecord</code></li>\n<li><code>UpdateRecord</code></li>\n<li><code>ValidateRecord</code></li>\n<li><code>PutDatabaseRecord</code></li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>Record Processor 通常需要 Record Reader 與 Record Writer。</li>\n<li><code>record.count</code> attribute 常用來確認處理幾筆資料。</li>\n</ul>\n<h2 id=\"schema\">Schema</h2>\n<p><code>Schema</code> 描述 record 的欄位與型別。</p>\n<p>範例：</p>\n<pre><code class=\"language-text\">order_id: string\ncustomer: string\namount: decimal</code></pre>\n<p>你在 UI 哪裡看到：</p>\n<ul>\n<li><code>CSVReader</code>、<code>JsonTreeReader</code>、Record Writer 的設定。</li>\n<li>Schema Registry 或 Avro schema 設定。</li>\n</ul>\n<p>常見問題：</p>\n<ul>\n<li>CSV header 與 schema 欄位名稱不一致。</li>\n<li>金額被讀成 string，導致 QueryRecord 比較結果不如預期。</li>\n<li>Writer schema 不包含新增欄位，導致 UpdateRecord 結果沒有輸出該欄位。</li>\n</ul>\n<h2 id=\"expression-language\">Expression Language</h2>\n<p><code>Expression Language</code> 是 NiFi 用來操作 attributes 的語法。</p>\n<p>範例：</p>\n<pre><code class=\"language-text\">${filename:endsWith(&#39;.csv&#39;)}\n${now():format(&quot;yyyyMMddHHmmss&quot;)}\n${source.system:equals(&#39;training&#39;)}</code></pre>\n<p>常用位置：</p>\n<ul>\n<li><code>UpdateAttribute</code></li>\n<li><code>RouteOnAttribute</code></li>\n<li>Processor property</li>\n</ul>\n<p>注意：</p>\n<ul>\n<li>Expression Language 通常處理 attributes，不是直接查 CSV/JSON 欄位。</li>\n<li>要查 record 欄位，通常用 QueryRecord、UpdateRecord 或 RecordPath。</li>\n</ul>\n<h2 id=\"recordpath\">RecordPath</h2>\n<p><code>RecordPath</code> 是 NiFi 用來定位 record 欄位的語法。</p>\n<p>範例：</p>\n<pre><code class=\"language-text\">/status\n/customer\n/items[*]/sku</code></pre>\n<p>常用位置：</p>\n<ul>\n<li><code>UpdateRecord</code></li>\n<li><code>QueryRecord</code> 相關設定</li>\n<li>Record validation 或轉換場景</li>\n</ul>\n<h2 id=\"scheduling\">Scheduling</h2>\n<p><code>Scheduling</code> 是 Processor 什麼時候執行、怎麼執行的設定。</p>\n<p>常見設定：</p>\n<table>\n<thead><tr><th>設定</th><th>說明</th></tr></thead>\n<tbody>\n<tr><td><code>Timer driven</code></td><td>固定間隔執行</td></tr>\n<tr><td><code>CRON driven</code></td><td>指定時間點執行</td></tr>\n<tr><td><code>Run Schedule</code></td><td>執行頻率或 CRON</td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td>同時執行緒數</td></tr>\n<tr><td><code>Execution</code></td><td>cluster 中在哪些節點執行</td></tr>\n</tbody>\n</table>\n<p>常見問題：</p>\n<ul>\n<li><code>Run Schedule = 0 sec</code> 代表盡可能執行，容易產生大量測試資料。</li>\n<li>公司批次排程常用 <code>CRON driven</code>。</li>\n<li>cluster 中要注意 <code>All Nodes</code> 可能造成多節點重複執行。</li>\n</ul>\n<h2 id=\"state\">State</h2>\n<p><code>State</code> 是 Processor 或 NiFi 用來記錄執行進度的狀態資料。</p>\n<p>常見例子：</p>\n<ul>\n<li><code>ListFile</code> 記住哪些檔案已列過。</li>\n<li>某些來源 Processor 記住上次讀取位置。</li>\n</ul>\n<p>實務觀念：</p>\n<ul>\n<li>State 和 FlowFile content 不一樣。</li>\n<li>重建環境、清 state、刪 volume 都可能影響資料是否重複抓取。</li>\n<li>這也是為什麼本專案要使用 Docker named volumes 保存 <code>state</code>。</li>\n</ul>\n<h2 id=\"一分鐘總結\">一分鐘總結</h2>\n<p>先記住這條線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    FF[FlowFile] --&gt; P[Processor]\n    P -- Relationship 決定路徑 --&gt; Q[Connection Queue]\n    Q --&gt; N[下一個 Processor]</code></pre>\n<p>再記住這三個排錯入口：</p>\n<pre><code class=\"language-text\">Bulletin 看錯誤，Queue 看資料卡在哪，Provenance 看資料走過哪裡。</code></pre>\n<p>最後記住 Controller Service：</p>\n<pre><code class=\"language-text\">Reader、Writer、DBCP 這類共用設定要先 Enable，Processor 才能正常使用。</code></pre>\n<h2 id=\"本章學習重點回顧\">本章學習重點回顧</h2>\n<p>這一章不是要你背名詞，而是先建立看 NiFi UI 的判讀框架。</p>\n<p>做完後你應該能把畫面上的元件對應成這條資料流：</p>\n<pre><code class=\"language-mermaid\">flowchart TD\n    A[資料進入 NiFi] --&gt; B[被包成 FlowFile]\n    B --&gt; C[由 Processor 處理]\n    C --&gt; D[透過 Relationship 決定 Connection]\n    D --&gt; E[暫存在 Queue]\n    E --&gt; F[被下一個 Processor 繼續處理]</code></pre>\n<p>你也應該知道排錯時先看哪裡：</p>\n<ul>\n<li>Processor 顯示 invalid：先看缺 property、relationship、Controller Service。</li>\n<li>Connection 上有數字：代表 FlowFile 正卡在 queue。</li>\n<li>Processor 有紅黃提示：先看 bulletin。</li>\n<li>想知道資料走過哪裡：看 Data Provenance。</li>\n</ul>\n<p>後面的 Lab 會一直重複這些名詞。你不需要一次全部記熟，但要能在 UI 上知道自己正在看的是資料、處理器、佇列、錯誤提示，還是共用設定。</p>"
  },

    "title": "Lab 01：建立第一個 Flow",
    "html": "<h1 id=\"lab-01-建立第一個-flow\">Lab 01：建立第一個 Flow</h1>\n<p>目標：建立最小可執行資料流，理解 Processor、Connection、Relationship、Queue 與 Start/Stop。</p>\n<p>預估時間：20 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; L[LogAttribute]</code></pre>\n<p><code>GenerateFlowFile</code> 產生一筆 FlowFile，<code>LogAttribute</code> 把 FlowFile 的 attributes 與內容寫到 NiFi log。</p>\n<h2 id=\"step-1-建立-process-group\">Step 1：建立 Process Group</h2>\n<ol>\n<li>開啟 <code>https://localhost:8443/nifi</code>。</li>\n<li>在空白 canvas 上方工具列拖曳 <code>Process Group</code>。</li>\n<li>名稱輸入 <code>training-lab-01</code>。</li>\n<li>進入 <code>training-lab-01</code>。</li>\n</ol>\n<p>為什麼要先用 Process Group：公司專案通常會把不同資料流、不同環境、不同功能切開，避免整張 canvas 難以維護。</p>\n<h2 id=\"step-2-新增-generateflowfile\">Step 2：新增 GenerateFlowFile</h2>\n<ol>\n<li>拖曳 <code>Processor</code> 到 canvas。</li>\n<li>搜尋 <code>GenerateFlowFile</code>。</li>\n<li>新增後打開設定。</li>\n<li>設定 <code>Scheduling</code>：</li>\n</ol>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n</ul>\n<ol>\n<li>設定 <code>Properties</code>：</li>\n</ol>\n<ul>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-text\">hello,nifi\nthis,is,my-first-flow</code></pre>\n<ol>\n<li>按 <code>Apply</code>。</li>\n</ol>\n<h2 id=\"step-3-新增-logattribute\">Step 3：新增 LogAttribute</h2>\n<ol>\n<li>拖曳 <code>Processor</code> 到 canvas。</li>\n<li>搜尋 <code>LogAttribute</code>。</li>\n<li>設定 <code>Properties</code>：</li>\n</ol>\n<ul>\n<li><code>Log Level</code>：<code>info</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n<li><code>Log Prefix</code>：<code>lab01</code></li>\n</ul>\n<ol>\n<li>按 <code>Apply</code>。</li>\n</ol>\n<h2 id=\"step-4-連線\">Step 4：連線</h2>\n<ol>\n<li>從 <code>GenerateFlowFile</code> 拖曳箭頭到 <code>LogAttribute</code>。</li>\n<li>Relationship 選 <code>success</code>。</li>\n<li>開啟 <code>LogAttribute</code> 設定。</li>\n<li>到 <code>Relationships</code>。</li>\n<li>勾選 <code>success</code> 的 auto-terminate。</li>\n<li>按 <code>Apply</code>。</li>\n</ol>\n<p>說明：每個 Relationship 都必須被連出去或 auto-terminate，否則 Processor 會 invalid。</p>\n<p>這裡勾選 <code>LogAttribute</code> 的 <code>success</code> auto-terminate，是因為 <code>LogAttribute</code> 已經完成本 Lab 的目的：把 FlowFile 寫到 log 讓你觀察。後面沒有下一個 Processor 要接收這筆資料，所以明確告訴 NiFi 這條 <code>success</code> 出口可以結束。</p>\n<p>不要把 auto-terminate 理解成「遇到什麼都直接丟掉」。在公司專案中，特別是 <code>failure</code> relationship，通常要先接到錯誤處理流程、錯誤 queue 或 <code>LogAttribute</code>，確認錯誤資料能被追蹤。</p>\n<p>延伸閱讀：<a href=\"#supplement-auto-terminate\">Auto-terminate 完整說明</a></p>\n<h2 id=\"step-5-啟動與觀察\">Step 5：啟動與觀察</h2>\n<ol>\n<li>選取兩個 Processor。</li>\n<li>按左側 Operate 面板的 Start。</li>\n<li>等 1 至 2 次執行後，停止 <code>GenerateFlowFile</code>。</li>\n</ol>\n<p>在當前工作目錄 PowerShell 看 log：</p>\n<pre><code class=\"language-powershell\">docker compose logs --tail=120 nifi</code></pre>\n<p>你應該看到 <code>lab01</code> 相關 log，裡面有 FlowFile attributes 與 payload。</p>\n<h2 id=\"step-6-觀察-queue\">Step 6：觀察 Queue</h2>\n<p>如果 <code>LogAttribute</code> 沒有啟動，<code>GenerateFlowFile</code> 產生的 FlowFile 會停在 connection queue。</p>\n<p>練習：</p>\n<ol>\n<li>停止 <code>LogAttribute</code>。</li>\n<li>啟動 <code>GenerateFlowFile</code> 一次。</li>\n<li>點 connection 上的 queue 數字。</li>\n<li>右鍵 queue，查看 <code>List queue</code>。</li>\n<li>點單筆 FlowFile 的資訊，觀察 <code>Attributes</code> 與 <code>Content</code>。</li>\n</ol>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 Processor stopped、running、invalid 的差異。</li>\n<li>你知道 connection 裡的 queue 是下游未處理的 FlowFile。</li>\n<li>你知道 Relationship 沒處理會讓 Processor invalid。</li>\n<li>你知道 auto-terminate 代表該 relationship 的 FlowFile 到此結束。</li>\n<li>你可以用 <code>docker compose logs</code> 看到 <code>LogAttribute</code> 輸出。</li>\n</ul>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<ul>\n<li><code>GenerateFlowFile</code> 一直產資料：把 <code>Run Schedule</code> 調大，或練習完立刻 stop。</li>\n<li><code>LogAttribute</code> invalid：確認 <code>success</code> relationship 是否已 auto-terminate。</li>\n<li>看不到 log：確認 <code>Log Level = info</code>，再用 <code>docker compose logs --tail=120 nifi</code> 查最近 log。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是最小 NiFi flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; Q[Connection Queue]\n    Q --&gt; L[LogAttribute]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 每 60 秒被 NiFi 排程觸發一次。</li>\n<li>每次觸發時，它會產生一筆新的 FlowFile。</li>\n<li>這筆 FlowFile 的 content 是你在 <code>Custom Text</code> 填入的文字。</li>\n<li>FlowFile 透過 <code>success</code> relationship 進入 connection queue。</li>\n<li><code>LogAttribute</code> 從 queue 取出 FlowFile。</li>\n<li><code>LogAttribute</code> 把 FlowFile attributes 與 payload 寫進 NiFi log。</li>\n</ol>\n<p>所以這個 Lab 不是在做真實資料整合，而是在模擬「一筆資料進入 NiFi 後，被下游 Processor 接收並留下觀察紀錄」。</p>\n<p>做完後你要理解三件事：</p>\n<ul>\n<li>Processor 不是一直自動做事，它要被排程觸發，而且要是 running。</li>\n<li>Connection 不是單純線條，中間有 queue，資料可能會卡在那裡。</li>\n<li><code>LogAttribute</code> 是新手最重要的觀察工具之一，用來確認 FlowFile 內容與 attributes 是否符合預期。</li>\n<li><code>LogAttribute</code> 的 <code>success</code> auto-terminate 是因為這條練習流程已經沒有下一步，不是因為所有 success 都應該被終止。</li>\n</ul>"
  },
  {
    "id": "02-flowfile-attributes-routing",
    "file": "02-flowfile-attributes-routing.md",
    "title": "Lab 02：FlowFile、Attribute、Expression Language 與路由",
    "html": "<h1 id=\"lab-02-flowfile-attribute-expression-language-與路由\">Lab 02：FlowFile、Attribute、Expression Language 與路由</h1>\n<p>目標：理解 FlowFile 由 content 與 attributes 組成，並用 Expression Language 依 attribute 分流。</p>\n<p>預估時間：30 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; U[UpdateAttribute]\n    U --&gt; R[RouteOnAttribute]\n    R --&gt; L[LogAttribute]</code></pre>\n<h2 id=\"step-1-建立-process-group\">Step 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-02</code>，進入該 Process Group。</p>\n<h2 id=\"step-2-新增-generateflowfile\">Step 2：新增 GenerateFlowFile</h2>\n<p>設定：</p>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-csv\">order_id,customer,amount,status\n1001,Alice,120.50,NEW\n1002,Bob,35.00,CANCELLED</code></pre>\n<h2 id=\"step-3-新增-updateattribute\">Step 3：新增 UpdateAttribute</h2>\n<p>新增 Processor：<code>UpdateAttribute</code>。</p>\n<p>在 <code>Properties</code> 新增 dynamic properties：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>source.system</code></td><td><code>training</code></td></tr>\n<tr><td><code>data.kind</code></td><td><code>orders</code></td></tr>\n<tr><td><code>filename</code></td><td><code>orders-${now():format(&quot;yyyyMMddHHmmss&quot;)}.csv</code></td></tr>\n</tbody>\n</table>\n<p>說明：Attribute 是 FlowFile 的 metadata。公司專案常用它保存來源系統、檔名、批次號、schema 名稱、錯誤原因。</p>\n<h2 id=\"step-4-新增-routeonattribute\">Step 4：新增 RouteOnAttribute</h2>\n<p>新增 Processor：<code>RouteOnAttribute</code>。</p>\n<p>設定：</p>\n<ul>\n<li><code>Routing Strategy</code>：<code>Route to Property name</code></li>\n</ul>\n<p>新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>csv_orders</code></td><td><code>${filename:endsWith(&#39;.csv&#39;)}</code></td></tr>\n</tbody>\n</table>\n<p>RouteOnAttribute 會依 dynamic property 產生同名 relationship，例如 <code>csv_orders</code>。</p>\n<h2 id=\"step-5-新增-logattribute\">Step 5：新增 LogAttribute</h2>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>設定：</p>\n<ul>\n<li><code>Log Prefix</code>：<code>lab02</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n</ul>\n<h2 id=\"step-6-連線與-relationship\">Step 6：連線與 relationship</h2>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; U[UpdateAttribute]\n    U -- success --&gt; R[RouteOnAttribute]\n    R -- csv_orders --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>RouteOnAttribute</code> 的 <code>unmatched</code></li>\n<li><code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<h2 id=\"step-7-執行與觀察\">Step 7：執行與觀察</h2>\n<ol>\n<li>全選 Processor，按 Start。</li>\n<li>等一筆資料通過後，停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=160 nifi</code></pre>\n<ol>\n<li>到 NiFi UI 打開 provenance，搜尋最近 FlowFile。</li>\n<li>觀察 attributes 是否包含：</li>\n</ol>\n<ul>\n<li><code>source.system</code></li>\n<li><code>data.kind</code></li>\n<li><code>filename</code></li>\n<li><code>RouteOnAttribute.Route</code></li>\n</ul>\n<h2 id=\"練習題\">練習題</h2>\n<p>開始練習前，先停止 <code>GenerateFlowFile</code>，避免你修改 route 時資料一直進來。每一題調整完設定後，再短暫啟動 <code>GenerateFlowFile</code> 觀察結果。</p>\n<h3 id=\"練習-1-修改-routeonattribute-新增-data-kind-route\">練習 1：修改 RouteOnAttribute，新增 data.kind route</h3>\n<p>修改 Processor：<code>RouteOnAttribute</code></p>\n<p>到 <code>Properties</code>，新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>orders_data</code></td><td><code>${data.kind:equals(&#39;orders&#39;)}</code></td></tr>\n</tbody>\n</table>\n<p>這會新增一條 relationship：<code>orders_data</code>。</p>\n<p>接著新增一個 <code>LogAttribute</code>，命名或註解成 <code>lab02-orders-data</code>，設定：</p>\n<ul>\n<li><code>Log Prefix</code>：<code>lab02-orders-data</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n</ul>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    R[RouteOnAttribute] -- orders_data --&gt; L[LogAttribute lab02-orders-data]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li>新增的 <code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<p>確認方式：</p>\n<ol>\n<li>目前 <code>UpdateAttribute</code> 的 <code>data.kind = orders</code>。</li>\n<li>所以 <code>orders_data</code> 會符合。</li>\n<li>原本的 <code>csv_orders</code> 也會符合，因為 <code>filename</code> 還是 <code>.csv</code>。</li>\n<li>觀察兩個 <code>LogAttribute</code> 是否都印出 log。</li>\n</ol>\n<h3 id=\"練習-2-修改-updateattribute-觀察其中一條-route-不符合\">練習 2：修改 UpdateAttribute，觀察其中一條 route 不符合</h3>\n<p>修改 Processor：<code>UpdateAttribute</code></p>\n<p>到 <code>Properties</code>，把這個 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>原本 Value</th><th>改成 Value</th></tr></thead>\n<tbody>\n<tr><td><code>data.kind</code></td><td><code>orders</code></td><td><code>customers</code></td></tr>\n</tbody>\n</table>\n<p>不要改 <code>RouteOnAttribute</code>。</p>\n<p>此時 route 判斷會變成：</p>\n<table>\n<thead><tr><th>Relationship</th><th>條件</th><th>是否符合</th></tr></thead>\n<tbody>\n<tr><td><code>csv_orders</code></td><td><code>${filename:endsWith(&#39;.csv&#39;)}</code></td><td>會符合</td></tr>\n<tr><td><code>orders_data</code></td><td><code>${data.kind:equals(&#39;orders&#39;)}</code></td><td>不符合</td></tr>\n</tbody>\n</table>\n<p>確認方式：</p>\n<ol>\n<li>Apply 後重新啟動流程。</li>\n<li><code>csv_orders</code> 還是會輸出 log。</li>\n<li><code>orders_data</code> 不會輸出 log。</li>\n</ol>\n<p>這一步的重點是：<code>UpdateAttribute</code> 改的是 attribute 值，<code>RouteOnAttribute</code> 根據改完後的 attribute 決定 relationship。</p>\n<h3 id=\"練習-3-修改-updateattribute-讓資料真的走-unmatched\">練習 3：修改 UpdateAttribute，讓資料真的走 unmatched</h3>\n<p>修改 Processor：<code>UpdateAttribute</code></p>\n<p>要讓資料走 <code>unmatched</code>，必須讓所有 route 條件都不符合。</p>\n<p>把 dynamic properties 改成：</p>\n<table>\n<thead><tr><th>Property</th><th>改成 Value</th></tr></thead>\n<tbody>\n<tr><td><code>data.kind</code></td><td><code>customers</code></td></tr>\n<tr><td><code>filename</code></td><td><code>orders-${now():format(&quot;yyyyMMddHHmmss&quot;)}.txt</code></td></tr>\n</tbody>\n</table>\n<p>此時 route 判斷會變成：</p>\n<table>\n<thead><tr><th>Relationship</th><th>條件</th><th>是否符合</th></tr></thead>\n<tbody>\n<tr><td><code>csv_orders</code></td><td><code>${filename:endsWith(&#39;.csv&#39;)}</code></td><td>不符合，因為 filename 是 <code>.txt</code></td></tr>\n<tr><td><code>orders_data</code></td><td><code>${data.kind:equals(&#39;orders&#39;)}</code></td><td>不符合，因為 data.kind 是 <code>customers</code></td></tr>\n</tbody>\n</table>\n<p>確認方式：</p>\n<ol>\n<li>若只想讓資料結束，確認 <code>RouteOnAttribute</code> 的 <code>unmatched</code> 有 auto-terminate。</li>\n<li>若想觀察 <code>unmatched</code>，先取消 <code>unmatched</code> 的 auto-terminate，再新增一個 <code>LogAttribute</code> 並把 <code>unmatched</code> 連過去。</li>\n<li>新增的 <code>LogAttribute</code> 要把 <code>success</code> auto-terminate。</li>\n<li>Apply 後重新啟動流程。</li>\n<li><code>csv_orders</code> 和 <code>orders_data</code> 都不會輸出 log。</li>\n<li>若 <code>unmatched</code> 接到 <code>LogAttribute</code>，會看到資料走到 <code>unmatched</code>。</li>\n</ol>\n<h3 id=\"練習-4-改回多條-route-同時符合\">練習 4：改回多條 route 同時符合</h3>\n<p>修改 Processor：<code>UpdateAttribute</code></p>\n<p>把 dynamic properties 改回：</p>\n<table>\n<thead><tr><th>Property</th><th>改回 Value</th></tr></thead>\n<tbody>\n<tr><td><code>data.kind</code></td><td><code>orders</code></td></tr>\n<tr><td><code>filename</code></td><td><code>orders-${now():format(&quot;yyyyMMddHHmmss&quot;)}.csv</code></td></tr>\n</tbody>\n</table>\n<p>此時 <code>RouteOnAttribute</code> 有兩條 route：</p>\n<table>\n<thead><tr><th>Relationship</th><th>條件</th><th>是否符合</th></tr></thead>\n<tbody>\n<tr><td><code>csv_orders</code></td><td><code>${filename:endsWith(&#39;.csv&#39;)}</code></td><td>會符合</td></tr>\n<tr><td><code>orders_data</code></td><td><code>${data.kind:equals(&#39;orders&#39;)}</code></td><td>會符合</td></tr>\n</tbody>\n</table>\n<p>觀察問題：</p>\n<ul>\n<li>一筆 FlowFile 是否會同時送到兩條 relationship？</li>\n<li>兩個 <code>LogAttribute</code> 是否都會印出 log？</li>\n<li><code>RouteOnAttribute.Route</code> attribute 會如何呈現？</li>\n</ul>\n<p>如果你在練習 3 額外建立了 <code>unmatched</code> 的 <code>LogAttribute</code>，這一題可以保留它；因為 <code>unmatched</code> 不符合時不會收到資料。重點是確認 <code>csv_orders</code> 與 <code>orders_data</code> 兩條已符合的 route 都有被處理。</p>\n<p>這個練習的重點是分清楚：</p>\n<ul>\n<li><code>UpdateAttribute</code>：負責新增或修改 attributes。</li>\n<li><code>RouteOnAttribute</code>：負責讀取 attributes 並決定要走哪條 relationship。</li>\n</ul>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你能分辨 FlowFile content 與 attributes。</li>\n<li>你能用 <code>UpdateAttribute</code> 新增 metadata。</li>\n<li>你能用 <code>RouteOnAttribute</code> 依 attribute 分流。</li>\n<li>你知道 <code>unmatched</code> 沒處理時會造成 invalid 或資料卡住。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 attribute-based routing：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; U[UpdateAttribute]\n    U --&gt; R[RouteOnAttribute]\n    R -- csv_orders --&gt; L[LogAttribute]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生一筆 CSV 文字資料。</li>\n<li><code>UpdateAttribute</code> 不改 CSV 內容，只幫 FlowFile 加上 metadata，例如 <code>source.system</code>、<code>data.kind</code>、<code>filename</code>。</li>\n<li><code>RouteOnAttribute</code> 不看 CSV 欄位，而是看 FlowFile attributes。</li>\n<li>如果 attributes 符合條件，例如檔名是 <code>.csv</code>，資料就走到 <code>csv_orders</code> relationship。</li>\n<li><code>LogAttribute</code> 把最後的 FlowFile 狀態寫到 log，讓你確認 route 是否正確。</li>\n</ol>\n<p>這個 Lab 模擬公司專案常見情境：資料進來後，先補上來源、類型、批次資訊，再根據 metadata 決定資料要走哪條流程。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li>Attributes 是 FlowFile 的外層標籤，適合拿來做路由、批次追蹤、錯誤原因保存。</li>\n<li><code>RouteOnAttribute</code> 適合依 metadata 分流，不適合直接查 CSV 裡的欄位值。</li>\n<li>如果你要依 CSV 欄位內容分流，後面會用 <code>QueryRecord</code> 或 Record 相關 Processor。</li>\n</ul>"
  },

    "id": "03-csv-record-reader-writer",
    "file": "03-csv-record-reader-writer.md",
    "title": "Lab 03：CSV Reader/Writer 與 ConvertRecord",
    "html": "<h1 id=\"lab-03-csv-reader-writer-與-convertrecord\">Lab 03：CSV Reader/Writer 與 ConvertRecord</h1>\n<p>目標：理解 Record Reader/Writer Controller Service，並用 <code>ConvertRecord</code> 讀取 CSV、輸出標準化 CSV。</p>\n<p>預估時間：35 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; C[ConvertRecord]\n    C --&gt; L[LogAttribute]</code></pre>\n<p>這一章會刻意練習 Controller Service，因為公司專案中 <code>Record Reader is disabled</code>、<code>Record Writer is disabled</code> 是很常見的 invalid 來源。</p>\n<h2 id=\"step-1-建立-process-group\">Step 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-03</code>，進入該 Process Group。</p>\n<h2 id=\"step-2-新增-controller-services\">Step 2：新增 Controller Services</h2>\n<p>在 Process Group 空白處右鍵，選 <code>Configure</code>，進入 <code>Controller Services</code>。</p>\n<p>新增 <code>CSVReader</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Use String Fields From Header</code></td></tr>\n<tr><td><code>CSV Format</code></td><td><code>RFC 4180</code> 或預設值</td></tr>\n</tbody>\n</table>\n<p>新增 <code>CSVRecordSetWriter</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Inherit Record Schema</code></td></tr>\n<tr><td><code>Schema Write Strategy</code></td><td><code>Do Not Write Schema</code></td></tr>\n<tr><td><code>Include Header Line</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>設定完成後，兩個 Controller Service 都要按 <code>Enable</code>。</p>\n<p>說明：Processor 只保存「要使用哪個 service」的參照。實際解析 CSV、輸出 CSV 的設定是在 Controller Service 裡。</p>\n<h2 id=\"step-3-新增-generateflowfile\">Step 3：新增 GenerateFlowFile</h2>\n<p>新增 Processor：<code>GenerateFlowFile</code>。</p>\n<p>設定：</p>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-csv\">order_id,customer,amount,status\n1001,Alice,120.50,NEW\n1002,Bob,35.00,CANCELLED\n1003,Chris,500.00,NEW</code></pre>\n<h2 id=\"step-4-新增-convertrecord\">Step 4：新增 ConvertRecord</h2>\n<p>新增 Processor：<code>ConvertRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選剛建立的 <code>CSVReader</code></td></tr>\n<tr><td><code>Record Writer</code></td><td>選剛建立的 <code>CSVRecordSetWriter</code></td></tr>\n<tr><td><code>Include Zero Record FlowFiles</code></td><td><code>false</code></td></tr>\n</tbody>\n</table>\n<p>如果 <code>Record Reader</code> 或 <code>Record Writer</code> 顯示 invalid，先回 Controller Services 確認 service 是 <code>Enabled</code>。</p>\n<h2 id=\"step-5-新增-logattribute\">Step 5：新增 LogAttribute</h2>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>設定：</p>\n<ul>\n<li><code>Log Prefix</code>：<code>lab03</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n</ul>\n<h2 id=\"step-6-連線\">Step 6：連線</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; C[ConvertRecord]\n    C -- success --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>ConvertRecord</code> 的 <code>failure</code></li>\n<li><code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<p>這裡 auto-terminate <code>ConvertRecord</code> 的 <code>failure</code> 只是為了讓入門練習保持簡短。公司專案中不建議直接結束 failure，通常要接到 <code>LogAttribute</code>、錯誤 queue 或錯誤處理流程。</p>\n<h2 id=\"step-7-執行與驗證\">Step 7：執行與驗證</h2>\n<ol>\n<li>全選 Processor，按 Start。</li>\n<li>等一筆資料通過後，停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=180 nifi</code></pre>\n<ol>\n<li>在 provenance 找這筆 FlowFile，確認 attributes：</li>\n</ol>\n<ul>\n<li><code>record.count</code> 應為 <code>3</code></li>\n<li><code>mime.type</code> 由 writer 決定</li>\n</ul>\n<h2 id=\"故意製造錯誤\">故意製造錯誤</h2>\n<p>練習排錯：</p>\n<ol>\n<li>先停止本 Lab 的所有 Processor。</li>\n<li>修改位置：Process Group 空白處右鍵，選 <code>Configure</code>。</li>\n<li>進入 <code>Controller Services</code>。</li>\n<li>找到本 Lab 建立的 <code>CSVReader</code>。</li>\n<li>對 <code>CSVReader</code> 按 <code>Disable</code>。</li>\n<li>若 NiFi 提示有 referencing components，確認只影響本 Lab 的 <code>ConvertRecord</code> 後再繼續。</li>\n<li>修改位置：回到 Processor <code>ConvertRecord</code>。</li>\n<li>回到 canvas，觀察 <code>ConvertRecord</code> 左上角是否變成 invalid 警告狀態。</li>\n<li>將滑鼠移到 invalid 警告圖示上，查看 validation errors。</li>\n<li>錯誤訊息應該會提到 <code>Record Reader</code> 參照的 Controller Service disabled。</li>\n<li>回到 <code>Controller Services</code>，把 <code>CSVReader</code> 按 <code>Enable</code>。</li>\n<li>再回 <code>ConvertRecord</code>，確認 invalid 狀態消失。</li>\n</ol>\n<p>這會重現你之前遇到的 Controller Service disabled 問題。</p>\n<p>練習結束後，確認 <code>CSVReader</code> 和 <code>CSVRecordSetWriter</code> 都是 <code>Enabled</code>，再繼續後面的 Lab。不要把故意製造的 disabled 狀態留到下一章。</p>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 Controller Service 必須 <code>Enable</code>。</li>\n<li>你知道 <code>CSVReader</code> 負責把 content 解析成 records。</li>\n<li>你知道 <code>CSVRecordSetWriter</code> 負責把 records 寫回 content。</li>\n<li>你能從 <code>record.count</code> 判斷實際處理了幾筆 record。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 record conversion flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; C[ConvertRecord]\n    C --&gt; L[LogAttribute]\n    Reader[CSVReader] -. reads records .-&gt; C\n    Writer[CSVRecordSetWriter] -. writes records .-&gt; C</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生一段 CSV content。</li>\n<li><code>ConvertRecord</code> 需要兩個 Controller Services。</li>\n<li><code>CSVReader</code> 把 CSV content 解析成 NiFi records。</li>\n<li><code>CSVRecordSetWriter</code> 再把 records 寫回 CSV content。</li>\n<li><code>LogAttribute</code> 把轉換後的 FlowFile 狀態與內容寫到 log。</li>\n</ol>\n<p>這個 Lab 看起來像只是 CSV 轉 CSV，但重點不是格式變化，而是學會 NiFi Record 架構。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li>Reader 負責「讀懂來源資料」。</li>\n<li>Writer 負責「輸出成目標格式」。</li>\n<li><code>ConvertRecord</code> 本身負責串接 Reader 和 Writer。</li>\n<li>Controller Service 必須 enabled，否則 Processor 會 invalid。</li>\n<li>後續 <code>QueryRecord</code>、<code>UpdateRecord</code>、<code>PutDatabaseRecord</code> 都會建立在這個 Reader/Writer 觀念上。</li>\n</ul>"
  },

    "id": "04-query-record-filtering",
    "file": "04-query-record-filtering.md",
    "title": "Lab 04：QueryRecord 與 Record 層級資料篩選",
    "html": "<h1 id=\"lab-04-queryrecord-與-record-層級資料篩選\">Lab 04：QueryRecord 與 Record 層級資料篩選</h1>\n<p>目標：用 SQL-like 語法對 CSV records 做欄位篩選與 row filtering。</p>\n<p>預估時間：40 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; Q[QueryRecord]\n    Q --&gt; L[LogAttribute]</code></pre>\n<p><code>RouteOnAttribute</code> 是看 FlowFile attribute，<code>QueryRecord</code> 是看 FlowFile content 裡的 record 欄位。</p>\n<h2 id=\"step-1-建立-process-group\">Step 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-04</code>，進入該 Process Group。</p>\n<h2 id=\"step-2-準備-controller-services\">Step 2：準備 Controller Services</h2>\n<p>你可以沿用 Lab 03 的設定方式，在本 Process Group 建立：</p>\n<ul>\n<li><code>CSVReader</code></li>\n<li><code>CSVRecordSetWriter</code></li>\n</ul>\n<p>建議設定：</p>\n<p><code>CSVReader</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Infer Schema</code></td></tr>\n<tr><td><code>CSV Format</code></td><td><code>RFC 4180</code> 或預設值</td></tr>\n</tbody>\n</table>\n<p><code>CSVRecordSetWriter</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Inherit Record Schema</code></td></tr>\n<tr><td><code>Schema Write Strategy</code></td><td><code>Do Not Write Schema</code></td></tr>\n<tr><td><code>Include Header Line</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>設定完成後 Enable。</p>\n<h2 id=\"step-3-新增-generateflowfile\">Step 3：新增 GenerateFlowFile</h2>\n<p>設定：</p>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-csv\">order_id,customer,amount,status\n1001,Alice,120.50,NEW\n1002,Bob,35.00,CANCELLED\n1003,Chris,500.00,NEW\n1004,Dora,80.00,NEW</code></pre>\n<h2 id=\"step-4-新增-queryrecord\">Step 4：新增 QueryRecord</h2>\n<p>新增 Processor：<code>QueryRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選 <code>CSVReader</code></td></tr>\n<tr><td><code>Record Writer</code></td><td>選 <code>CSVRecordSetWriter</code></td></tr>\n<tr><td><code>Include Zero Record FlowFiles</code></td><td><code>false</code></td></tr>\n</tbody>\n</table>\n<p>新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>large_orders</code></td><td><code>SELECT * FROM FLOWFILE WHERE &quot;amount&quot; &gt;= 100</code></td></tr>\n</tbody>\n</table>\n<p>官方文件建議欄位名稱用雙引號包起來，避免和 SQL keyword 衝突。</p>\n<p>新增 dynamic property 後，<code>QueryRecord</code> 會產生 <code>large_orders</code> relationship。</p>\n<h2 id=\"step-5-新增-logattribute\">Step 5：新增 LogAttribute</h2>\n<p>設定：</p>\n<ul>\n<li><code>Log Prefix</code>：<code>lab04-large-orders</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n</ul>\n<h2 id=\"step-6-連線\">Step 6：連線</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; Q[QueryRecord]\n    Q -- large_orders --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>QueryRecord</code> 的 <code>failure</code></li>\n<li><code>QueryRecord</code> 的 <code>original</code></li>\n<li><code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<p>這裡 auto-terminate <code>failure</code> 和 <code>original</code> 是為了讓入門練習先聚焦在 <code>large_orders</code> 輸出。公司專案中，<code>failure</code> 通常要接錯誤處理；<code>original</code> 是否結束則要依稽核、重放與追蹤需求決定。</p>\n<h2 id=\"step-7-執行與觀察\">Step 7：執行與觀察</h2>\n<ol>\n<li>全選 Processor，按 Start。</li>\n<li>等一筆資料通過後，停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=200 nifi</code></pre>\n<p>你應該只看到金額大於等於 <code>100</code> 的 records。</p>\n<p>預期 <code>large_orders</code> 輸出 2 筆：<code>1001</code> 和 <code>1003</code>。<code>original</code> 已在 Step 6 auto-terminate，所以這一步不會另外看到原始完整 CSV 輸出。</p>\n<h2 id=\"練習題\">練習題</h2>\n<p>開始練習前，先停止 <code>GenerateFlowFile</code>。新增 <code>QueryRecord</code> dynamic property 後會產生新的 relationship，必須先把 relationship 連出去或 auto-terminate，再重新啟動流程。</p>\n<h3 id=\"練習-1-修改-queryrecord-新增-cancelled-orders-輸出\">練習 1：修改 QueryRecord，新增 cancelled_orders 輸出</h3>\n<p>修改 Processor：<code>QueryRecord</code></p>\n<p>到 <code>Properties</code>，新增第二個 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>cancelled_orders</code></td><td><code>SELECT &quot;order_id&quot;, &quot;customer&quot;, &quot;status&quot; FROM FLOWFILE WHERE &quot;status&quot; = &#39;CANCELLED&#39;</code></td></tr>\n</tbody>\n</table>\n<p>這會新增一條 relationship：<code>cancelled_orders</code>。</p>\n<p>此時先不要啟動流程。先完成練習 2，把 <code>cancelled_orders</code> 接到下游 <code>LogAttribute</code>，否則 <code>QueryRecord</code> 會因為新 relationship 沒處理而 invalid。</p>\n<h3 id=\"練習-2-新增-logattribute-接-cancelled-orders\">練習 2：新增 LogAttribute，接 cancelled_orders</h3>\n<p>新增 Processor：<code>LogAttribute</code></p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab04-cancelled-orders</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    Q[QueryRecord] -- cancelled_orders --&gt; L[LogAttribute lab04-cancelled-orders]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li>新增的 <code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<h3 id=\"練習-3-執行後觀察結果\">練習 3：執行後觀察結果</h3>\n<p>確認方式：</p>\n<ul>\n<li><code>large_orders</code> 輸出幾筆？</li>\n<li><code>cancelled_orders</code> 輸出幾筆？</li>\n<li><code>original</code> relationship 是否有被處理或 auto-terminate？</li>\n</ul>\n<p>預期結果：</p>\n<table>\n<thead><tr><th>Relationship</th><th>條件</th><th>預期筆數</th></tr></thead>\n<tbody>\n<tr><td><code>large_orders</code></td><td><code>&quot;amount&quot; &gt;= 100</code></td><td>2 筆，<code>1001</code>、<code>1003</code></td></tr>\n<tr><td><code>cancelled_orders</code></td><td><code>&quot;status&quot; = &#39;CANCELLED&#39;</code></td><td>1 筆，<code>1002</code></td></tr>\n</tbody>\n</table>\n<p>這個練習的重點是：修改 <code>QueryRecord</code> dynamic property 會新增新的 relationship；新增 relationship 後，必須連到下游 Processor 或 auto-terminate。</p>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<ul>\n<li>SQL 欄位名稱打錯：會走 <code>failure</code>。</li>\n<li>Reader 推斷型別不如預期：金額比較失敗時，先確認 <code>Schema Access Strategy</code>，必要時改用明確 schema。</li>\n<li>忘記處理 <code>original</code>：QueryRecord 會保留原始 FlowFile，未連線或未 auto-terminate 會造成 invalid。</li>\n<li>觀察到 <code>original</code> 像是 binary：<code>original</code> 是原始 FlowFile，不是查詢結果；先確認 <code>GenerateFlowFile</code> 的 <code>Custom Text</code> 是否仍是 CSV 純文字，以及你看的是否為 FlowFile content，而不是 component 設定或下載檔的原始 bytes。</li>\n</ul>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你能說明 Attribute 路由與 Record 欄位篩選的差異。</li>\n<li>你能用 QueryRecord 產生多個 relationship。</li>\n<li>你能用 <code>record.count</code> 與 output content 檢查篩選結果。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 record-level filtering：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; Q[QueryRecord]\n    Q -- large_orders --&gt; L[LogAttribute]\n    Q -- original --&gt; O[Auto-terminate 或其他處理]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生一份包含多筆訂單的 CSV。</li>\n<li><code>CSVReader</code> 把 CSV 解析成 records。</li>\n<li><code>QueryRecord</code> 用 SQL-like 語法查這些 records。</li>\n<li>符合 <code>amount &gt;= 100</code> 的 records 會被輸出到 <code>large_orders</code> relationship。</li>\n<li><code>CSVRecordSetWriter</code> 把篩選後的 records 寫回 CSV。</li>\n<li><code>LogAttribute</code> 印出篩選後的結果。</li>\n</ol>\n<p>這個 Lab 模擬公司專案常見情境：一批資料進來後，只挑出符合條件的資料往下游送，例如大額訂單、取消訂單、錯誤狀態資料。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li><code>RouteOnAttribute</code> 是看 FlowFile attributes。</li>\n<li><code>QueryRecord</code> 是看 content 裡每一筆 record 的欄位。</li>\n<li><code>QueryRecord</code> 可以用多個 dynamic properties 產生多條輸出 relationship。</li>\n<li><code>original</code> relationship 是原始資料，要明確處理或 auto-terminate。</li>\n</ul>"
  },

    "id": "05-update-record-recordpath",
    "file": "05-update-record-recordpath.md",
    "title": "Lab 05：UpdateRecord、RecordPath 與欄位轉換",
    "html": "<h1 id=\"lab-05-updaterecord-recordpath-與欄位轉換\">Lab 05：UpdateRecord、RecordPath 與欄位轉換</h1>\n<p>目標：用 <code>UpdateRecord</code> 修改 CSV record 欄位，練習 RecordPath。</p>\n<p>預估時間：40 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; U[UpdateRecord]\n    U --&gt; L[LogAttribute]</code></pre>\n<p><code>UpdateAttribute</code> 改的是 FlowFile metadata；<code>UpdateRecord</code> 改的是 content 裡每一筆 record 的欄位值。</p>\n<h2 id=\"step-1-建立-process-group\">Step 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-05</code>，進入該 Process Group。</p>\n<h2 id=\"step-2-建立-controller-services\">Step 2：建立 Controller Services</h2>\n<p>建立並 Enable：</p>\n<ul>\n<li><code>CSVReader</code></li>\n<li><code>CSVRecordSetWriter</code></li>\n</ul>\n<p>建議同 Lab 04：</p>\n<p><code>CSVReader</code> 使用 <code>Infer Schema</code>，<code>CSVRecordSetWriter</code> 使用 <code>Inherit Record Schema</code> 與 <code>Do Not Write Schema</code>。</p>\n<h2 id=\"step-3-新增-generateflowfile\">Step 3：新增 GenerateFlowFile</h2>\n<p>設定：</p>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-csv\">order_id,customer,amount,status\n1001,Alice,120.50,new\n1002,Bob,35.00,cancelled\n1003,Chris,500.00,new</code></pre>\n<h2 id=\"step-4-新增-updaterecord\">Step 4：新增 UpdateRecord</h2>\n<p>新增 Processor：<code>UpdateRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選 <code>CSVReader</code></td></tr>\n<tr><td><code>Record Writer</code></td><td>選 <code>CSVRecordSetWriter</code></td></tr>\n<tr><td><code>Replacement Value Strategy</code></td><td><code>Literal Value</code></td></tr>\n</tbody>\n</table>\n<p>新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/source_system</code></td><td><code>training</code></td></tr>\n</tbody>\n</table>\n<p>這會嘗試把每筆 record 的 <code>/source_system</code> 欄位更新為 <code>training</code>。</p>\n<p>注意：若 writer/schema 不允許新增不存在欄位，結果可能不會如你預期。這是 NiFi Record 類 processor 的重要觀念：Reader/Writer schema 會影響欄位保留與輸出。</p>\n<h2 id=\"step-5-改用既有欄位\">Step 5：改用既有欄位</h2>\n<p>再新增或調整 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/status</code></td><td><code>NEW</code></td></tr>\n</tbody>\n</table>\n<p>這會把所有 record 的 <code>status</code> 改成 <code>NEW</code>。</p>\n<h2 id=\"step-6-連線與執行\">Step 6：連線與執行</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; U[UpdateRecord]\n    U -- success --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>UpdateRecord</code> 的 <code>failure</code></li>\n<li><code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<p>這裡 auto-terminate <code>UpdateRecord</code> 的 <code>failure</code> 是為了讓入門練習保持簡短。公司專案中，<code>failure</code> 通常要接到錯誤處理流程，避免錯誤資料直接結束。</p>\n<p><code>LogAttribute</code> 設定：</p>\n<ul>\n<li><code>Log Prefix</code>：<code>lab05</code></li>\n<li><code>Log Payload</code>：<code>true</code></li>\n</ul>\n<p>執行後查看：</p>\n<pre><code class=\"language-powershell\">docker compose logs --tail=220 nifi</code></pre>\n<h2 id=\"step-7-練習-recordpath-value\">Step 7：練習 RecordPath Value</h2>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>把 <code>Replacement Value Strategy</code> 改成：</p>\n<pre><code class=\"language-text\">Record Path Value</code></pre>\n<p>保留或修改 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/status</code></td><td><code>/final_status</code></td></tr>\n</tbody>\n</table>\n<p>刪除前面 Step 4 建立的 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>原本 Value</th><th>動作</th></tr></thead>\n<tbody>\n<tr><td><code>/source_system</code></td><td><code>training</code></td><td>刪除</td></tr>\n</tbody>\n</table>\n<p>說明：<code>Record Path Value</code> 會讓所有 dynamic property 的 value 都被當成 RecordPath。<code>/status = /final_status</code> 是合法的，因為 <code>/final_status</code> 指向同一筆 record 的欄位；但 <code>/source_system = training</code> 會失敗，因為 <code>training</code> 只是一般文字，不是合法 RecordPath。若沒有刪除它，執行時會看到類似 <code>RecordPathException: Unexpected token &#39;&lt;EOF&gt;&#39; ... Query: trainin</code>，資料會走 <code>failure</code>。</p>\n<p>接著修改 Processor：<code>GenerateFlowFile</code></p>\n<p>把 <code>Custom Text</code> 改成：</p>\n<pre><code class=\"language-csv\">order_id,customer,amount,status,final_status\n1001,Alice,120.50,new,READY\n1002,Bob,35.00,cancelled,SKIP\n1003,Chris,500.00,new,READY</code></pre>\n<p>預期在 <code>LogAttribute</code> payload 看到類似：</p>\n<pre><code class=\"language-csv\">order_id,customer,amount,status,final_status\n1001,Alice,120.50,READY,READY\n1002,Bob,35.00,SKIP,SKIP\n1003,Chris,500.00,READY,READY</code></pre>\n<p>這一步要檢查的是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 的 <code>Custom Text</code> 是上面的 CSV。</li>\n<li><code>UpdateRecord</code> 的 <code>Replacement Value Strategy</code> 是 <code>Record Path Value</code>。</li>\n<li><code>UpdateRecord</code> 的 dynamic property 只保留 <code>/status = /final_status</code>。</li>\n<li><code>UpdateRecord</code> 不要保留 <code>/source_system = training</code>。</li>\n<li>從 <code>LogAttribute</code> 的 log payload 或 Queue 的 FlowFile content 觀察輸出 CSV。</li>\n</ol>\n<h2 id=\"練習題\">練習題</h2>\n<h3 id=\"練習-1-修改-updaterecord-遮罩-customer\">練習 1：修改 UpdateRecord，遮罩 customer</h3>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>確認 <code>Replacement Value Strategy</code> 是：</p>\n<pre><code class=\"language-text\">Literal Value</code></pre>\n<p>到 <code>Properties</code>，先刪除 Step 7 的 <code>/status = /final_status</code>，再新增或修改 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/customer</code></td><td><code>masked</code></td></tr>\n</tbody>\n</table>\n<p>確認方式：</p>\n<ol>\n<li>Apply 後重新執行流程。</li>\n<li>查看 <code>LogAttribute</code> 輸出。</li>\n<li>確認每筆 record 的 <code>customer</code> 都變成 <code>masked</code>。</li>\n</ol>\n<h3 id=\"練習-2-修改-updaterecord-觀察-amount-型別\">練習 2：修改 UpdateRecord，觀察 amount 型別</h3>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>到 <code>Properties</code>，先刪除練習 1 的 <code>/customer = masked</code>，再新增或修改 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/amount</code></td><td><code>0</code></td></tr>\n</tbody>\n</table>\n<p>確認方式：</p>\n<ol>\n<li>Apply 後重新執行流程。</li>\n<li>查看 <code>LogAttribute</code> 輸出。</li>\n<li>觀察 <code>amount</code> 是否輸出為 <code>0</code>。</li>\n<li>若後續要寫入 DB，思考這個值是否能被 DB 欄位型別接受。</li>\n</ol>\n<h3 id=\"練習-3-故意設定不存在的-recordpath\">練習 3：故意設定不存在的 RecordPath</h3>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<p>到 <code>Properties</code>，先刪除練習 2 的 <code>/amount = 0</code>，再新增 dynamic property：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/not_exists</code></td><td><code>test</code></td></tr>\n</tbody>\n</table>\n<p>確認方式：</p>\n<ol>\n<li>Apply 後回到 canvas，觀察 <code>UpdateRecord</code> 左上角是否變成 invalid 警告狀態。</li>\n<li>如果出現 invalid，將滑鼠移到警告圖示上查看 validation errors。</li>\n<li>重新執行流程。</li>\n<li>查看 <code>LogAttribute</code> 輸出是否出現 <code>not_exists</code> 欄位。</li>\n<li>目前本 Lab 的 <code>CSVRecordSetWriter</code> 使用 <code>Inherit Record Schema</code>，你可能會看到 <code>not_exists</code> 被輸出成新欄位。</li>\n</ol>\n<p>這個練習的重點是：<code>UpdateRecord</code> 的 dynamic property key 是 RecordPath，value 是要寫入該欄位的值；欄位是否能輸出，會受到 schema 與 writer 設定影響。</p>\n<h3 id=\"練習-4-改用固定-schema-writer-觀察新增欄位不被輸出\">練習 4：改用固定 schema Writer，觀察新增欄位不被輸出</h3>\n<p>這一題會沿用練習 3 的狀態：<code>UpdateRecord</code> 已經有 <code>/not_exists = test</code>。</p>\n<p>先停止 <code>GenerateFlowFile</code>，避免你修改 Controller Service 時資料繼續進來。</p>\n<p>新增 Controller Service：<code>CSVRecordSetWriter</code>，命名或註解成 <code>CSVRecordSetWriter-fixed-schema</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Use &#39;Schema Text&#39; Property</code></td></tr>\n<tr><td><code>Schema Write Strategy</code></td><td><code>Do Not Write Schema</code></td></tr>\n<tr><td><code>Include Header Line</code></td><td><code>true</code></td></tr>\n<tr><td><code>Schema Text</code></td><td>使用下方 Avro schema</td></tr>\n</tbody>\n</table>\n<p><code>Schema Text</code>：</p>\n<pre><code class=\"language-json\">{\n  &quot;type&quot;: &quot;record&quot;,\n  &quot;name&quot;: &quot;OrderRecord&quot;,\n  &quot;fields&quot;: [\n    { &quot;name&quot;: &quot;order_id&quot;, &quot;type&quot;: &quot;string&quot; },\n    { &quot;name&quot;: &quot;customer&quot;, &quot;type&quot;: &quot;string&quot; },\n    { &quot;name&quot;: &quot;amount&quot;, &quot;type&quot;: &quot;string&quot; },\n    { &quot;name&quot;: &quot;status&quot;, &quot;type&quot;: &quot;string&quot; }\n  ]\n}</code></pre>\n<p>Enable 這個新的 <code>CSVRecordSetWriter-fixed-schema</code>。</p>\n<p>修改 Processor：<code>UpdateRecord</code></p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Writer</code></td><td>選 <code>CSVRecordSetWriter-fixed-schema</code></td></tr>\n<tr><td><code>Replacement Value Strategy</code></td><td><code>Literal Value</code></td></tr>\n</tbody>\n</table>\n<p>確認 dynamic property 只有：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>/not_exists</code></td><td><code>test</code></td></tr>\n</tbody>\n</table>\n<p>重新執行流程，觀察 <code>LogAttribute</code> 輸出。</p>\n<p>預期結果：</p>\n<ul>\n<li><code>not_exists</code> 不會出現在輸出 CSV header。</li>\n<li>如果 <code>GenerateFlowFile</code> 還保留 Step 7 的 <code>final_status</code> 欄位，<code>final_status</code> 也不會出現在輸出 CSV。</li>\n<li>FlowFile 不一定會走 <code>failure</code>；比較常見的是 Writer 只依固定 schema 寫出允許的欄位。</li>\n</ul>\n<p>這一題的重點是：<code>UpdateRecord</code> 負責修改 record；<code>CSVRecordSetWriter</code> 負責輸出 record。公司專案若使用固定 schema，新增欄位沒有寫進 schema，就算 <code>UpdateRecord</code> 設定了該欄位，最後也可能不會輸出。</p>\n<p>練習結束後，若要回到前面的自由練習狀態，把 <code>UpdateRecord</code> 的 <code>Record Writer</code> 改回原本的 <code>CSVRecordSetWriter</code>。</p>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 <code>UpdateAttribute</code> 與 <code>UpdateRecord</code> 的差異。</li>\n<li>你能用 <code>/field_name</code> 這種 RecordPath 指到欄位。</li>\n<li>你知道 <code>Replacement Value Strategy</code> 會決定 value 被當成 literal 還是 RecordPath。</li>\n<li>你知道 <code>UpdateRecord</code> 可以嘗試新增欄位，但 Writer schema 會決定最後輸出哪些欄位。</li>\n<li>你知道固定 schema 常用在公司專案，用來限制輸出欄位與下游契約。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 record transformation flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; U[UpdateRecord]\n    U --&gt; L[LogAttribute]\n    RP[RecordPath] -. 指定欄位 .-&gt; U</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生 CSV 訂單資料。</li>\n<li><code>CSVReader</code> 把 CSV 解析成 records。</li>\n<li><code>UpdateRecord</code> 用 RecordPath 找到 record 裡的欄位。</li>\n<li><code>UpdateRecord</code> 依設定把欄位改成固定值，或改成另一個欄位的值。</li>\n<li><code>CSVRecordSetWriter</code> 把修改後的 records 寫回 CSV。</li>\n<li><code>LogAttribute</code> 印出修改後的結果。</li>\n</ol>\n<p>這個 Lab 模擬公司專案常見情境：資料進入後要標準化欄位值、補欄位、遮罩欄位，或把來源欄位轉成目標系統需要的格式。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li><code>UpdateAttribute</code> 改 FlowFile 外層 metadata。</li>\n<li><code>UpdateRecord</code> 改 FlowFile content 裡的 record 欄位。</li>\n<li>RecordPath 像是指向 record 欄位的路徑，例如 <code>/status</code>。</li>\n<li>Schema 會影響欄位能不能被保留或正確輸出；固定 schema 沒有定義的欄位通常不會被 Writer 寫出。</li>\n</ul>"
  },
