    "id": "06-00-database-integration",
    "file": "06-00-database-integration.md",
    "title": "Lab 06：本地 MSSQL 資料庫整合入門",
    "html": "<h1 id=\"lab-06-本地-mssql-資料庫整合入門\">Lab 06：本地 MSSQL 資料庫整合入門</h1>\n<p>目標：理解 NiFi 如何透過 <code>DBCPConnectionPool</code> 管理 MSSQL JDBC 連線，並用 <code>PutDatabaseRecord</code> 將 records 寫入本地 MSSQL。</p>\n<p>預估時間：45 至 60 分鐘。</p>\n<p>這一章會分成兩段：</p>\n<ul>\n<li>A 段：在目前專案環境確認 JDBC driver 掛載。</li>\n<li>B 段：用本地 MSSQL 測試資料庫實作 <code>PutDatabaseRecord</code>。</li>\n</ul>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; P[PutDatabaseRecord]\n    P -- success --&gt; DB[(Database)]\n    P -- failure --&gt; L[LogAttribute]\n    R[CSVReader] -. reads records .-&gt; P\n    C[DBCPConnectionPool] -. JDBC connection .-&gt; P</code></pre>\n<p><code>CSVReader</code> 負責讀取 CSV records，<code>DBCPConnectionPool</code> 負責提供資料庫連線，<code>PutDatabaseRecord</code> 負責把 records 寫入資料表。失敗路徑會先接到 <code>LogAttribute</code>，方便你看到 DB 錯誤。</p>\n<h2 id=\"a-段-確認-jdbc-driver\">A 段：確認 JDBC driver</h2>\n<p>NiFi container 內必須看得到 MSSQL JDBC driver jar，<code>DBCPConnectionPool</code> 才能載入 SQL Server driver。</p>\n<p>先釐清一個容易誤會的觀念：NiFi 確實是透過 <code>Database Connection URL</code> 這種連線字串連到資料庫，但連線字串不能取代 JDBC driver。連線字串只描述「要連到哪一台資料庫、哪個 database、使用哪些連線參數」；JDBC driver 才是 NiFi 用來理解 SQL Server 協定並建立連線的 Java library。</p>\n<p>延伸閱讀：<a href=\"#supplement-jdbc-driver\">JDBC Driver Jar 完整說明</a></p>\n<p>所以 MSSQL 連線需要三個東西一起成立：</p>\n<table>\n<thead><tr><th>設定</th><th>作用</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td>MSSQL 連線字串，例如 host、port、database name、TLS 參數</td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td>指定要用哪個 Java driver class</td></tr>\n<tr><td><code>Database Driver Locations</code></td><td>指定 driver jar 在 NiFi container 內的位置</td></tr>\n</tbody>\n</table>\n<p>本 Lab 建議使用 Microsoft JDBC Driver for SQL Server。下載時可搜尋：</p>\n<pre><code class=\"language-text\">download microsoft jdbc driver for sql server</code></pre>\n<p>下載後，把 driver jar 放到專案根目錄，例如：</p>\n<pre><code class=\"language-text\">mssql-jdbc-13.4.0.jre11.jar</code></pre>\n<p>接著在 <code>docker-compose.yaml</code> 的 <code>nifi.volumes</code> 加上這一行：</p>\n<pre><code class=\"language-yaml\">- &quot;./mssql-jdbc-13.4.0.jre11.jar:/tmp/mssql-jdbc.jar&quot;</code></pre>\n<p>如果你使用不同版本的 driver jar，左邊檔名要跟實際檔名一致；右邊 container 內路徑建議固定成 <code>/tmp/mssql-jdbc.jar</code>，後面 DBCP 設定比較簡單。</p>\n<p>修改 volume 後重建 NiFi container：</p>\n<pre><code class=\"language-powershell\">docker compose up -d nifi</code></pre>\n<p>用 PowerShell 確認 NiFi container 內看得到 driver：</p>\n<pre><code class=\"language-powershell\">docker exec nifi-service sh -lc &quot;ls -l /tmp/mssql-jdbc.jar&quot;</code></pre>\n<p><code>DBCPConnectionPool</code> 的 <code>Database Driver Locations</code> 要填 container 內路徑，也就是 <code>/tmp/mssql-jdbc.jar</code>，不是 Windows 主機上的檔案路徑。</p>\n<p>只要 NiFi 成功透過這組設定寫入本地 MSSQL，你在 SSMS 或 Azure Data Studio 查 <code>dbo.nifi_training_orders</code> 就會直接看到資料。差別只是：NiFi 到 MSSQL 的連線方式是 JDBC；你在 MSSQL 工具看到的是同一張資料表的結果。</p>\n<p>官方文件依據：</p>\n<ul>\n<li>Microsoft JDBC Driver for SQL Server：https://learn.microsoft.com/en-us/sql/connect/jdbc/microsoft-jdbc-driver-for-sql-server</li>\n<li>SQL Server JDBC connection URL 與 driver class：https://learn.microsoft.com/en-us/sql/connect/jdbc/using-the-jdbc-driver</li>\n</ul>\n<h2 id=\"b-段-實作-csv-寫入本地-mssql\">B 段：實作 CSV 寫入本地 MSSQL</h2>\n<p>這一段會先在 MSSQL 建好 database 與 table，再回 NiFi UI 建立資料流。不要在 database 還不存在時先 Enable <code>DBCPConnectionPool</code>，因為 <code>databaseName=nifi_training</code> 代表 NiFi 要連到一個已存在的 database。</p>\n<h2 id=\"b-段前置設定-確認-mssql-tcp-port\">B 段前置設定：確認 MSSQL TCP port</h2>\n<p>如果 MSSQL 是安裝在 Windows 本機，先確認 SQL Server 有開啟 TCP/IP，並確認它目前監聽哪個 port。這一步是在 Windows 上設定，不是在 NiFi UI 裡設定。</p>\n<ol>\n<li>開啟 <code>SQL Server Configuration Manager</code>。</li>\n</ol>\n<ul>\n<li>可以從 Windows 開始選單搜尋。</li>\n<li>如果搜尋不到，可以用 <code>Win + R</code> 嘗試執行 <code>SQLServerManager16.msc</code>、<code>SQLServerManager15.msc</code> 或 <code>SQLServerManager14.msc</code>。不同 SQL Server 版本的檔名可能不同。</li>\n</ul>\n<ol>\n<li>左側打開 <code>SQL Server Network Configuration</code>。</li>\n<li>選你的 instance：</li>\n</ol>\n<ul>\n<li>預設 instance 通常是 <code>Protocols for MSSQLSERVER</code></li>\n<li>SQL Server Express 常見是 <code>Protocols for SQLEXPRESS</code></li>\n<li>公司或本機自訂 instance 會是 <code>Protocols for &lt;instance-name&gt;</code></li>\n</ul>\n<ol>\n<li>右側找到 <code>TCP/IP</code>。</li>\n<li>如果 <code>TCP/IP</code> 是 <code>Disabled</code>，右鍵選 <code>Enable</code>。</li>\n<li>右鍵 <code>TCP/IP</code>，選 <code>Properties</code>。</li>\n<li>進入 <code>IP Addresses</code> 分頁。</li>\n<li>捲到最下面 <code>IPAll</code>。</li>\n<li>先看目前設定，不要急著清空：</li>\n</ol>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>TCP Dynamic Ports</code></td><td>若有值，代表目前可能使用動態 port</td></tr>\n<tr><td><code>TCP Port</code></td><td>若有值，代表目前使用固定 port</td></tr>\n</tbody>\n</table>\n<p>接下來有兩種做法。</p>\n<h3 id=\"做法-a-保留目前動態-port\">做法 A：保留目前動態 port</h3>\n<p>如果 <code>TCP Dynamic Ports</code> 已經有值，且這台本機 MSSQL 也被其他專案使用，建議先不要改。直接使用目前的 port 連線即可。</p>\n<p>假設 <code>TCP Dynamic Ports</code> 顯示 <code>51234</code>，那後面的 NiFi <code>Database Connection URL</code> 要用：</p>\n<pre><code class=\"language-text\">jdbc:sqlserver://host.docker.internal:51234;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></pre>\n<p>用 PowerShell 確認本機該 port 可連：</p>\n<pre><code class=\"language-powershell\">Test-NetConnection localhost -Port 51234</code></pre>\n<p>如果 <code>TcpTestSucceeded</code> 是 <code>True</code>，代表本機 TCP port 已可連線。</p>\n<h3 id=\"做法-b-全新練習環境才改成固定-1433\">做法 B：全新練習環境才改成固定 1433</h3>\n<p>如果這是專門給 NiFi Lab 用的本機 MSSQL，沒有其他專案依賴目前動態 port，可以改成固定 <code>1433</code>，讓教學與排錯比較單純。</p>\n<p>在 <code>IPAll</code> 設定：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>TCP Dynamic Ports</code></td><td>清空，不要填值</td></tr>\n<tr><td><code>TCP Port</code></td><td><code>1433</code></td></tr>\n</tbody>\n</table>\n<p>接著：</p>\n<ol>\n<li>按 <code>OK</code>。</li>\n<li>左側切到 <code>SQL Server Services</code>。</li>\n<li>找到你的 SQL Server service，例如：</li>\n</ol>\n<ul>\n<li><code>SQL Server (MSSQLSERVER)</code></li>\n<li><code>SQL Server (SQLEXPRESS)</code></li>\n</ul>\n<ol>\n<li>右鍵該 service，選 <code>Restart</code>。</li>\n</ol>\n<p>用 PowerShell 確認 Windows 本機的 <code>1433</code> 有開：</p>\n<pre><code class=\"language-powershell\">Test-NetConnection localhost -Port 1433</code></pre>\n<p>如果 <code>TcpTestSucceeded</code> 是 <code>True</code>，代表本機 TCP port 已可連線。</p>\n<p>若 NiFi container 仍然連不到本機 MSSQL，再確認 Windows 防火牆是否允許你使用的 TCP port。本機練習可新增 inbound rule 允許該 port，公司環境則依資安規範處理。</p>\n<p>說明：Microsoft 官方文件建議用 <code>SQL Server Configuration Manager</code> 啟用 TCP/IP 與設定固定 TCP port；修改 protocol 或 port 後，要重新啟動 SQL Server Database Engine 才會生效。如果你只是沿用目前動態 port，通常不需要改設定或重啟。</p>\n<h2 id=\"step-1-準備-mssql-database-與-table\">Step 1：準備 MSSQL database 與 table</h2>\n<p>先在 SSMS 或 Azure Data Studio 連到本地 MSSQL，執行：</p>\n<pre><code class=\"language-sql\">IF DB_ID(N&#39;nifi_training&#39;) IS NULL\nBEGIN\n    CREATE DATABASE nifi_training;\nEND;\nGO\n\nUSE nifi_training;\nGO\n\nIF OBJECT_ID(N&#39;dbo.nifi_training_orders&#39;, N&#39;U&#39;) IS NULL\nBEGIN\n    CREATE TABLE dbo.nifi_training_orders (\n        DbId INT IDENTITY(1,1) PRIMARY KEY,\n        order_id VARCHAR(20),\n        customer VARCHAR(100),\n        amount DECIMAL(12, 2),\n        status VARCHAR(30)\n    );\nEND;\nGO</code></pre>\n<p>如果你重跑 Lab 想重新觀察結果，可以先清空練習資料：</p>\n<pre><code class=\"language-sql\">USE nifi_training;\nGO\n\nTRUNCATE TABLE dbo.nifi_training_orders;\nGO</code></pre>\n<p>正式環境請不要直接用 production table 練習。先用 sandbox database、sandbox schema 或本地 MSSQL。</p>\n<p>資料表欄位：</p>\n<table>\n<thead><tr><th>欄位</th><th>型別</th><th>說明</th></tr></thead>\n<tbody>\n<tr><td><code>DbId</code></td><td><code>INT IDENTITY(1,1)</code></td><td>MSSQL 自增主鍵，不需要出現在 CSV</td></tr>\n<tr><td><code>order_id</code></td><td><code>VARCHAR(20)</code></td><td>業務訂單編號，對應 CSV 的 <code>order_id</code></td></tr>\n<tr><td><code>customer</code></td><td><code>VARCHAR(100)</code></td><td>對應 CSV 的 <code>customer</code></td></tr>\n<tr><td><code>amount</code></td><td><code>DECIMAL(12, 2)</code></td><td>對應 CSV 的 <code>amount</code></td></tr>\n<tr><td><code>status</code></td><td><code>VARCHAR(30)</code></td><td>對應 CSV 的 <code>status</code></td></tr>\n</tbody>\n</table>\n<p>說明：本 Lab 使用 <code>DbId</code> 當自增主鍵，是為了讓你可以重跑同一批 CSV，不會因為 <code>order_id = 1001</code> 重複而卡在 primary key。公司正式資料表是否要讓 <code>order_id</code> 唯一，要依業務規則決定；若訂單編號本來就不能重複，正式設計仍應加唯一約束或改用 upsert 流程。</p>\n<h2 id=\"step-2-建立-process-group\">Step 2：建立 Process Group</h2>\n<p>回到 NiFi UI，建立 <code>training-lab-06</code>，進入該 Process Group。</p>\n<h2 id=\"step-3-建立-dbcpconnectionpool\">Step 3：建立 DBCPConnectionPool</h2>\n<p>在 Process Group 空白處右鍵，選 <code>Configure</code>，進入 <code>Controller Services</code>。</p>\n<p>建立 Controller Service：<code>DBCPConnectionPool</code>。</p>\n<p>本 Lab 假設 MSSQL 安裝在 Windows 本機。NiFi 跑在 Docker container 內，所以連 Windows 主機上的 MSSQL 時，host 建議用 <code>host.docker.internal</code>，不要用 <code>localhost</code>。port 請填 B 段前置設定中確認到的 MSSQL port；如果你採用固定 <code>1433</code>，就使用下面範例。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>MSSQL 本地範例</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td><code>jdbc:sqlserver://host.docker.internal:1433;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td><code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code></td></tr>\n<tr><td><code>Database Driver Locations</code></td><td><code>/tmp/mssql-jdbc.jar</code></td></tr>\n<tr><td><code>Database User</code></td><td>建議使用 SQL Server 驗證帳號</td></tr>\n<tr><td><code>Password</code></td><td>SQL Server 驗證密碼</td></tr>\n</tbody>\n</table>\n<p>這裡的「連線字串」就是 <code>Database Connection URL</code>。它是必要設定，但不是唯一設定；如果沒有 MSSQL JDBC driver jar，NiFi 仍然無法理解 <code>jdbc:sqlserver://...</code> 這種 URL。</p>\n<p>如果你在 SSMS 使用 <code>Windows Authentication</code>，通常不需要輸入帳密，因為 SSMS 直接使用目前登入 Windows 的使用者身分。但 NiFi 是跑在 Linux container 裡，不會自動取得你的 Windows 登入身分。因此本 Lab 建議使用 SQL Server 驗證帳號，不建議把 <code>Database User</code> / <code>Password</code> 留空。</p>\n<p>Windows 驗證不是不能做，而是需要額外設定 Kerberos、NTLM 或 Microsoft JDBC driver 的 integrated authentication 相關參數。這已經超出入門 Lab 範圍，正式公司專案應依 DBA、AD 與資安規範設定。</p>\n<p>如果你保留本機 MSSQL 目前的動態 port，請把 URL 裡的 <code>1433</code> 改成實際 port，例如：</p>\n<pre><code class=\"language-text\">jdbc:sqlserver://host.docker.internal:51234;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></pre>\n<p>如果你的 MSSQL 也是 Docker container，且和 NiFi 在同一個 Docker network，host 要改成 MSSQL service name，例如：</p>\n<pre><code class=\"language-text\">jdbc:sqlserver://sqlserver:1433;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></pre>\n<h3 id=\"雲端-mssql-azure-sql-的-dbcpconnectionpool-連線字串\">雲端 MSSQL / Azure SQL 的 DBCPConnectionPool 連線字串</h3>\n<p>如果公司資料庫在雲端，不要使用 <code>host.docker.internal</code>。<code>host.docker.internal</code> 只代表 Docker container 要連回 Windows 主機；雲端 DB 要填雲端資料庫的 DNS name 或 server host。</p>\n<p>常見雲端 MSSQL 設定：</p>\n<table>\n<thead><tr><th>Property</th><th>雲端 MSSQL 範例</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td><code>jdbc:sqlserver://&lt;db-host&gt;:1433;databaseName=&lt;database-name&gt;;encrypt=true;trustServerCertificate=false;loginTimeout=30;</code></td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td><code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code></td></tr>\n<tr><td><code>Database Driver Locations</code></td><td><code>/tmp/mssql-jdbc.jar</code></td></tr>\n<tr><td><code>Database User</code></td><td>公司提供的 SQL login</td></tr>\n<tr><td><code>Password</code></td><td>公司提供的 SQL password</td></tr>\n</tbody>\n</table>\n<p>Azure SQL Database 常見範例：</p>\n<pre><code class=\"language-text\">jdbc:sqlserver://&lt;server-name&gt;.database.windows.net:1433;databaseName=&lt;database-name&gt;;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;</code></pre>\n<p>範例替換：</p>\n<pre><code class=\"language-text\">jdbc:sqlserver://my-company-sql.database.windows.net:1433;databaseName=nifi_training;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;</code></pre>\n<p>說明：</p>\n<table>\n<thead><tr><th>URL 片段</th><th>意義</th></tr></thead>\n<tbody>\n<tr><td><code>&lt;server-name&gt;.database.windows.net</code></td><td>Azure SQL 的 server DNS name</td></tr>\n<tr><td><code>1433</code></td><td>SQL Server / Azure SQL 常見 TCP port</td></tr>\n<tr><td><code>databaseName=&lt;database-name&gt;</code></td><td>要連線的 database，必須已存在</td></tr>\n<tr><td><code>encrypt=true</code></td><td>啟用 TLS 加密</td></tr>\n<tr><td><code>trustServerCertificate=false</code></td><td>要驗證伺服器憑證，正式環境建議使用</td></tr>\n<tr><td><code>hostNameInCertificate=*.database.windows.net</code></td><td>讓 driver 用 Azure SQL 憑證主機名稱做驗證</td></tr>\n<tr><td><code>loginTimeout=30</code></td><td>連線逾時秒數</td></tr>\n</tbody>\n</table>\n<p>雲端 DB 連線前先確認：</p>\n<ol>\n<li>database 已建立；NiFi 不會因為 DBCPConnectionPool 設定而自動建立 database。</li>\n<li>table 已建立；<code>PutDatabaseRecord</code> 執行時才會檢查 table metadata。</li>\n<li>雲端防火牆、security group 或 allowlist 已允許 NiFi 來源 IP 連線到 <code>1433</code>。</li>\n<li>如果 NiFi 跑在 Docker Desktop，本機對外 IP 可能和公司 VPN、NAT 或雲端 allowlist 有關，需依公司網路環境確認。</li>\n<li>正式環境不要把 DB 帳密寫進 Git；應使用 NiFi Parameter Context、環境變數或公司 secret 管理方式。</li>\n</ol>\n<p>注意：本地練習常用 <code>trustServerCertificate=true</code> 是為了避開自簽憑證驗證問題；雲端 DB 尤其是正式環境，應優先使用 <code>trustServerCertificate=false</code>，讓 JDBC driver 驗證 TLS 憑證。</p>\n<p><code>trustServerCertificate=true</code> 只適合本地練習或測試環境，目的是避開自簽憑證驗證問題。公司正式環境應依 DBA 或資安規範設定 TLS 憑證。</p>\n<p>設定完成後，按 <code>Enable</code>。如果 Enable 失敗，先看錯誤訊息，通常是 URL、driver class、driver jar path、帳密或網路連線問題。</p>\n<h2 id=\"step-4-建立-csv-reader\">Step 4：建立 CSV Reader</h2>\n<p>建立 <code>CSVReader</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td>建議正式環境用明確 schema；練習可先用 <code>Infer Schema</code></td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<h2 id=\"step-5-建立-generateflowfile\">Step 5：建立 GenerateFlowFile</h2>\n<p>設定：</p>\n<ul>\n<li><code>Run Schedule</code>：<code>60 sec</code></li>\n<li><code>Custom Text</code>：</li>\n</ul>\n<pre><code class=\"language-csv\">order_id,customer,amount,status\n1001,Alice,120.50,NEW\n1002,Bob,35.00,CANCELLED</code></pre>\n<h2 id=\"step-6-建立-putdatabaserecord\">Step 6：建立 PutDatabaseRecord</h2>\n<p>新增 Processor：<code>PutDatabaseRecord</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td>選 <code>CSVReader</code></td></tr>\n<tr><td><code>Database Connection Pooling Service</code></td><td>選 <code>DBCPConnectionPool</code></td></tr>\n<tr><td><code>Database Type</code></td><td><code>MS SQL 2012+</code></td></tr>\n<tr><td><code>Database Name</code></td><td><code>nifi_training</code></td></tr>\n<tr><td><code>Schema Name</code></td><td><code>dbo</code></td></tr>\n<tr><td><code>Table Name</code></td><td><code>nifi_training_orders</code></td></tr>\n<tr><td><code>Statement Type</code></td><td><code>INSERT</code></td></tr>\n</tbody>\n</table>\n<p>注意：不要把 <code>dbo.nifi_training_orders</code> 全部填到 <code>Table Name</code>。<code>PutDatabaseRecord</code> 會用 JDBC metadata 查表，MSSQL 的 database、schema、table 要分開填。</p>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>PutDatabaseRecord</code> 的 <code>success</code> 可以先 auto-terminate。</li>\n<li><code>PutDatabaseRecord</code> 的 <code>failure</code> 先連到 <code>LogAttribute</code>，不要一開始就 auto-terminate，方便排錯。</li>\n</ul>\n<p>建議練習做法：</p>\n<ol>\n<li>新增一個 <code>LogAttribute</code>，命名或註解成 <code>lab06-db-failure</code>。</li>\n<li>設定 <code>Log Prefix = lab06-db-failure</code>。</li>\n<li>設定 <code>Log Payload = true</code>。</li>\n<li>將 <code>PutDatabaseRecord</code> 的 <code>failure</code> relationship 連到這個 <code>LogAttribute</code>。</li>\n<li>將 <code>lab06-db-failure</code> 的 <code>success</code> auto-terminate。</li>\n</ol>\n<p>成功路徑可以先 auto-terminate，因為資料已寫入資料庫；失敗路徑先保留觀察，方便看 DB 錯誤訊息。</p>\n<h2 id=\"step-7-執行與驗證\">Step 7：執行與驗證</h2>\n<ol>\n<li>Start <code>lab06-db-failure</code> 這個 <code>LogAttribute</code>。</li>\n<li>Start <code>PutDatabaseRecord</code>。</li>\n<li>Start <code>GenerateFlowFile</code>。</li>\n<li>等一筆資料送出後，停止 <code>GenerateFlowFile</code>。</li>\n<li>到 DB 查詢：</li>\n</ol>\n<pre><code class=\"language-sql\">SELECT * FROM dbo.nifi_training_orders;</code></pre>\n<h2 id=\"常見錯誤與排查\">常見錯誤與排查</h2>\n<h3 id=\"controller-service-disabled\">Controller Service disabled</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">Controller Service with ID ... is disabled</code></pre>\n<p>處理：</p>\n<ol>\n<li>回到 Process Group 的 Controller Services。</li>\n<li>找到 <code>DBCPConnectionPool</code> 或 <code>CSVReader</code>。</li>\n<li>修正設定。</li>\n<li>Enable。</li>\n<li>回 Processor 觀察 invalid 狀態是否消失；若仍 invalid，將滑鼠移到警告圖示上查看 validation errors。</li>\n</ol>\n<h3 id=\"找不到-jdbc-driver\">找不到 JDBC driver</h3>\n<p>處理：</p>\n<ol>\n<li>確認 jar 是否存在於 container。</li>\n<li>確認 <code>Database Driver Locations</code> 是 container 內路徑，不是 Windows 主機路徑。</li>\n<li>確認 <code>Database Driver Class Name</code> 是 <code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code>。</li>\n</ol>\n<h3 id=\"localhost-連不到-mssql\">localhost 連不到 MSSQL</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">The TCP/IP connection to the host localhost, port 1433 has failed</code></pre>\n<p>處理：</p>\n<ol>\n<li>NiFi 在 container 內，<code>localhost</code> 代表 NiFi container 自己，不是 Windows 主機。</li>\n<li>若 MSSQL 裝在 Windows 本機，URL host 改成 <code>host.docker.internal</code>。</li>\n<li>確認 MSSQL 已啟用 TCP/IP，並監聽你在 B 段前置設定確認到的 port。</li>\n<li>確認 Windows 防火牆允許本機 Docker 連線。</li>\n</ol>\n<h3 id=\"雲端-db-連不到\">雲端 DB 連不到</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">The TCP/IP connection to the host &lt;db-host&gt;, port 1433 has failed</code></pre>\n<p>處理：</p>\n<ol>\n<li>確認 <code>Database Connection URL</code> 的 host 是雲端 DB host，不是 <code>localhost</code> 或 <code>host.docker.internal</code>。</li>\n<li>確認 port 通常是 <code>1433</code>，除非 DBA 明確提供不同 port。</li>\n<li>確認雲端 DB firewall、security group 或 allowlist 已允許 NiFi 來源 IP。</li>\n<li>若你透過公司 VPN 才能連 DB，先確認 Docker container 是否也能走到該網路路徑。</li>\n<li>用本機工具先測試網路可達性，例如：</li>\n</ol>\n<pre><code class=\"language-powershell\">Test-NetConnection &lt;db-host&gt; -Port 1433</code></pre>\n<p>說明：<code>Test-NetConnection</code> 只能確認 TCP port 是否可達，不能證明帳密、database name 或 TLS 設定正確。若 TCP 可達但 DBCP Enable 仍失敗，再看 NiFi bulletin 或 <code>docker compose logs --tail=200 nifi</code>。</p>\n<h3 id=\"table-not-found\">Table not found</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">Table dbo.nifi_training_orders not found</code></pre>\n<p>處理：</p>\n<ol>\n<li>不要把 <code>dbo.nifi_training_orders</code> 全部填在 <code>Table Name</code>。</li>\n<li>在 <code>PutDatabaseRecord</code> 分開設定：</li>\n</ol>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Name</code></td><td><code>nifi_training</code></td></tr>\n<tr><td><code>Schema Name</code></td><td><code>dbo</code></td></tr>\n<tr><td><code>Table Name</code></td><td><code>nifi_training_orders</code></td></tr>\n</tbody>\n</table>\n<ol>\n<li>到 MSSQL 確認實際名稱：</li>\n</ol>\n<pre><code class=\"language-sql\">SELECT\n    TABLE_CATALOG,\n    TABLE_SCHEMA,\n    TABLE_NAME\nFROM INFORMATION_SCHEMA.TABLES\nWHERE TABLE_NAME = &#39;nifi_training_orders&#39;;</code></pre>\n<ol>\n<li>若查到的 <code>TABLE_SCHEMA</code> 不是 <code>dbo</code>，就把 NiFi 的 <code>Schema Name</code> 改成查到的值。</li>\n<li>修改後重新執行流程，觀察 <code>failure</code> path 是否還有錯誤。</li>\n</ol>\n<h3 id=\"tls-或憑證錯誤\">TLS 或憑證錯誤</h3>\n<p>本地練習可先在 JDBC URL 加上：</p>\n<pre><code class=\"language-text\">encrypt=true;trustServerCertificate=true;</code></pre>\n<p>正式環境不要直接照抄這個設定，應依公司憑證與資安規範處理。</p>\n<h3 id=\"欄位對不上\">欄位對不上</h3>\n<p>處理：</p>\n<ol>\n<li>CSV header 名稱要能對應資料表欄位。</li>\n<li>欄位型別要能被 DB 轉換。</li>\n<li>若有多餘欄位，先用 QueryRecord 或 UpdateRecord 整理。</li>\n</ol>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道 JDBC jar 必須在 NiFi container 裡可讀。</li>\n<li>你知道 NiFi 連 MSSQL 是透過 JDBC：連線字串負責描述目標，driver 負責實際建立連線。</li>\n<li>你知道 DBCPConnectionPool 是共用 MSSQL 連線設定。</li>\n<li>你知道 PutDatabaseRecord 用 RecordReader 讀取 FlowFile content。</li>\n<li>你知道 NiFi container 連 Windows 本機 MSSQL 時，通常要用 <code>host.docker.internal</code>。</li>\n<li>你知道 NiFi 寫入成功後，可直接在 SSMS 或 Azure Data Studio 查到同一張 MSSQL 資料表。</li>\n<li>你知道正式環境應先用 sandbox table 驗證。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 CSV to database flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] --&gt; P[PutDatabaseRecord]\n    P --&gt; DB[(Database)]\n    Reader[CSVReader] -. reads records .-&gt; P\n    Pool[DBCPConnectionPool] -. JDBC connection .-&gt; P</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>GenerateFlowFile</code> 產生一份 CSV 訂單資料。</li>\n<li><code>CSVReader</code> 把 CSV content 解析成 records。</li>\n<li><code>DBCPConnectionPool</code> 提供 JDBC 連線設定與連線池。</li>\n<li><code>PutDatabaseRecord</code> 根據 records 與 table name 產生 SQL 寫入資料庫。</li>\n<li>寫入成功走 <code>success</code>，寫入失敗走 <code>failure</code>。</li>\n</ol>\n<p>這個 Lab 模擬公司專案常見情境：從檔案、API 或上游系統取得資料後，整理成 records，再寫入 MSSQL。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li>NiFi 寫 DB 通常不是 Processor 自己保存全部連線資訊，而是透過 <code>DBCPConnectionPool</code>。</li>\n<li><code>Database Connection URL</code> 是連線字串，但不能取代 JDBC driver。</li>\n<li>JDBC jar path 必須是 container 內路徑，不是 Windows 主機路徑。</li>\n<li>本地 MSSQL 從 NiFi container 連線時，通常用 <code>host.docker.internal:&lt;port&gt;</code>。</li>\n<li>CSV header、record 欄位與資料表欄位需要對得上。</li>\n<li>DB 寫入流程一定要設計 failure path，否則 production 排錯會很困難。</li>\n</ul>"
  },

    "id": "06-01-database-read-copy",
    "file": "06-01-database-read-copy.md",
    "title": "Lab 06-1：從 MSSQL 讀取資料表資訊並複製資料",
    "html": "<h1 id=\"lab-06-1-從-mssql-讀取資料表資訊並複製資料\">Lab 06-1：從 MSSQL 讀取資料表資訊並複製資料</h1>\n<p>目標：用 <code>ExecuteSQLRecord</code> 從本地 MSSQL 查詢 table 欄位與型別，再把來源 table 的資料複製到另一個本地 database 的 table。</p>\n<p>預估時間：60 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<p>本 Lab 會建立兩條資料流：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    A[ExecuteSQLRecord 查欄位型別] --&gt; B[LogAttribute 看 metadata]\n    S[ExecuteSQLRecord 讀來源 table] --&gt; P[PutDatabaseRecord 寫目標 table]\n    P -- success --&gt; L[LogAttribute 成功]\n    P -- failure --&gt; E[LogAttribute 失敗]\n    SRC[Source DBCPConnectionPool] -. JDBC .-&gt; A\n    SRC -. JDBC .-&gt; S\n    TGT[Target DBCPConnectionPool] -. JDBC .-&gt; P</code></pre>\n<p>第一條 flow 會查 <code>INFORMATION_SCHEMA.COLUMNS</code>，讓你看到某個 table 的所有欄位與型別。</p>\n<p>第二條 flow 會從 <code>nifi_training.dbo.nifi_training_orders</code> 讀資料，寫到 <code>nifi_training_target.dbo.nifi_training_orders_copy</code>。</p>\n<h2 id=\"官方確認的資料庫讀寫觀念\">官方確認的資料庫讀寫觀念</h2>\n<p>本 Lab 會用到：</p>\n<table>\n<thead><tr><th>元件</th><th>用途</th></tr></thead>\n<tbody>\n<tr><td><code>ExecuteSQLRecord</code></td><td>執行 SQL query，將 ResultSet 轉成 FlowFile records</td></tr>\n<tr><td><code>PutDatabaseRecord</code></td><td>將 FlowFile records 寫入資料庫 table</td></tr>\n<tr><td><code>DBCPConnectionPool</code></td><td>管理 JDBC 連線與 driver 設定</td></tr>\n<tr><td><code>CSVRecordSetWriter</code></td><td>將 SQL 查詢結果輸出成 CSV，方便用 <code>LogAttribute</code> 觀察</td></tr>\n</tbody>\n</table>\n<p>來源：</p>\n<ul>\n<li>https://nifi.apache.org/components/org.apache.nifi.processors.standard.ExecuteSQLRecord/</li>\n<li>https://nifi.apache.org/components/org.apache.nifi.processors.standard.PutDatabaseRecord/</li>\n<li>https://nifi.apache.org/components/org.apache.nifi.dbcp.DBCPConnectionPool/</li>\n<li>https://learn.microsoft.com/en-us/sql/relational-databases/system-information-schema-views/columns-transact-sql</li>\n</ul>\n<h2 id=\"前置條件\">前置條件</h2>\n<p>先完成 <a href=\"#06-00-database-integration\">Lab 06：本地 MSSQL 資料庫整合入門</a>，並確認：</p>\n<ol>\n<li>NiFi container 內看得到 <code>/tmp/mssql-jdbc.jar</code>。</li>\n<li>本地 MSSQL TCP port 可連線。</li>\n<li><code>nifi_training.dbo.nifi_training_orders</code> 已存在。</li>\n<li><code>nifi_training.dbo.nifi_training_orders</code> 至少有幾筆資料。</li>\n</ol>\n<p>如果來源表沒有資料，可先在 SSMS 或 Azure Data Studio 執行：</p>\n<pre><code class=\"language-sql\">USE nifi_training;\nGO\n\nINSERT INTO dbo.nifi_training_orders (order_id, customer, amount, status)\nVALUES\n    (&#39;1001&#39;, &#39;Alice&#39;, 120.50, &#39;NEW&#39;),\n    (&#39;1002&#39;, &#39;Bob&#39;, 35.00, &#39;CANCELLED&#39;),\n    (&#39;1003&#39;, &#39;Carol&#39;, 520.00, &#39;PAID&#39;);\nGO</code></pre>\n<p>說明：若你前面 Lab 已經插入過相同資料，這段可能會讓資料重複。因為 Lab 06 的 <code>order_id</code> 不是 primary key，重複資料不會被阻擋；正式環境是否允許重複，要看業務規則。</p>\n<h2 id=\"part-1-建立目標-database-與-table\">Part 1：建立目標 database 與 table</h2>\n<p>這一段先在 MSSQL 建立另一個本地 database：<code>nifi_training_target</code>。</p>\n<p>在 SSMS 或 Azure Data Studio 執行：</p>\n<pre><code class=\"language-sql\">IF DB_ID(N&#39;nifi_training_target&#39;) IS NULL\nBEGIN\n    CREATE DATABASE nifi_training_target;\nEND;\nGO\n\nUSE nifi_training_target;\nGO\n\nIF OBJECT_ID(N&#39;dbo.nifi_training_orders_copy&#39;, N&#39;U&#39;) IS NULL\nBEGIN\n    CREATE TABLE dbo.nifi_training_orders_copy (\n        DbId INT IDENTITY(1,1) PRIMARY KEY,\n        order_id VARCHAR(20),\n        customer VARCHAR(100),\n        amount DECIMAL(12, 2),\n        status VARCHAR(30),\n        copied_at DATETIME2 DEFAULT SYSUTCDATETIME()\n    );\nEND;\nGO</code></pre>\n<p>如果你要重跑 Lab，可以清空目標表：</p>\n<pre><code class=\"language-sql\">USE nifi_training_target;\nGO\n\nTRUNCATE TABLE dbo.nifi_training_orders_copy;\nGO</code></pre>\n<p>說明：目標表有自己的 <code>DbId</code> 自增主鍵，不直接複製來源表的 <code>DbId</code> 值。這樣重跑練習時，不會因為來源主鍵值重複而卡住。</p>\n<h2 id=\"part-2-建立-process-group\">Part 2：建立 Process Group</h2>\n<p>回到 NiFi UI，建立 <code>training-lab-06-1</code>，進入該 Process Group。</p>\n<h2 id=\"part-3-建立-controller-services\">Part 3：建立 Controller Services</h2>\n<p>在 Process Group 空白處右鍵，選 <code>Configure</code>，進入 <code>Controller Services</code>。</p>\n<h3 id=\"step-1-建立-source-dbcpconnectionpool\">Step 1：建立 Source DBCPConnectionPool</h3>\n<p>建立 Controller Service：<code>DBCPConnectionPool</code>。</p>\n<p>命名或註解成 <code>DBCPConnectionPool-source-nifi-training</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td><code>jdbc:sqlserver://host.docker.internal:1433;databaseName=nifi_training;encrypt=true;trustServerCertificate=true;</code></td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td><code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code></td></tr>\n<tr><td><code>Database Driver Locations</code></td><td><code>/tmp/mssql-jdbc.jar</code></td></tr>\n<tr><td><code>Database User</code></td><td>你的 SQL Server 驗證帳號</td></tr>\n<tr><td><code>Password</code></td><td>你的 SQL Server 驗證密碼</td></tr>\n</tbody>\n</table>\n<p>如果你本機 MSSQL 使用動態 port，把 <code>1433</code> 改成 Lab 06 確認到的 port。</p>\n<p>Enable。</p>\n<h3 id=\"step-2-建立-target-dbcpconnectionpool\">Step 2：建立 Target DBCPConnectionPool</h3>\n<p>再建立一個 <code>DBCPConnectionPool</code>。</p>\n<p>命名或註解成 <code>DBCPConnectionPool-target-nifi-training-target</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection URL</code></td><td><code>jdbc:sqlserver://host.docker.internal:1433;databaseName=nifi_training_target;encrypt=true;trustServerCertificate=true;</code></td></tr>\n<tr><td><code>Database Driver Class Name</code></td><td><code>com.microsoft.sqlserver.jdbc.SQLServerDriver</code></td></tr>\n<tr><td><code>Database Driver Locations</code></td><td><code>/tmp/mssql-jdbc.jar</code></td></tr>\n<tr><td><code>Database User</code></td><td>你的 SQL Server 驗證帳號</td></tr>\n<tr><td><code>Password</code></td><td>你的 SQL Server 驗證密碼</td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<p>說明：這裡故意用兩個 DBCPConnectionPool，讓你清楚分辨來源 database 與目標 database。公司專案若來源與目標是不同 server，更應該分開設定。</p>\n<h3 id=\"step-3-建立-csvrecordsetwriter\">Step 3：建立 CSVRecordSetWriter</h3>\n<p>建立 Controller Service：<code>CSVRecordSetWriter</code>。</p>\n<p>命名或註解成 <code>CSVRecordSetWriter-db-result</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Inherit Record Schema</code></td></tr>\n<tr><td><code>Schema Write Strategy</code></td><td><code>Do Not Write Schema</code></td></tr>\n<tr><td><code>Include Header Line</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<p>說明：<code>ExecuteSQLRecord</code> 查詢 DB 後會產生 records，這個 writer 負責把 records 寫成 CSV，方便 <code>LogAttribute</code> 直接看內容。</p>\n<h3 id=\"step-4-建立-csvreader\">Step 4：建立 CSVReader</h3>\n<p>建立 Controller Service：<code>CSVReader</code>。</p>\n<p>命名或註解成 <code>CSVReader-db-result</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Schema Access Strategy</code></td><td><code>Infer Schema</code></td></tr>\n<tr><td><code>CSV Format</code></td><td><code>RFC 4180</code> 或預設值</td></tr>\n</tbody>\n</table>\n<p>Enable。</p>\n<p>說明：<code>PutDatabaseRecord</code> 需要 Record Reader 讀取上游 FlowFile content。這裡上游 <code>ExecuteSQLRecord</code> 會輸出 CSV，所以使用 <code>CSVReader</code>。</p>\n<h2 id=\"part-4-查詢-table-欄位與型別\">Part 4：查詢 table 欄位與型別</h2>\n<h3 id=\"step-1-新增-executesqlrecord\">Step 1：新增 ExecuteSQLRecord</h3>\n<p>新增 Processor：<code>ExecuteSQLRecord</code>。</p>\n<p>命名或註解成 <code>lab06-1-table-columns</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection Pooling Service</code></td><td><code>DBCPConnectionPool-source-nifi-training</code></td></tr>\n<tr><td><code>Record Writer</code></td><td><code>CSVRecordSetWriter-db-result</code></td></tr>\n<tr><td><code>SQL select query</code></td><td>使用下方 SQL</td></tr>\n</tbody>\n</table>\n<pre><code class=\"language-sql\">SELECT\n    ORDINAL_POSITION,\n    COLUMN_NAME,\n    DATA_TYPE,\n    CHARACTER_MAXIMUM_LENGTH,\n    NUMERIC_PRECISION,\n    NUMERIC_SCALE,\n    IS_NULLABLE\nFROM INFORMATION_SCHEMA.COLUMNS\nWHERE TABLE_SCHEMA = &#39;dbo&#39;\n  AND TABLE_NAME = &#39;nifi_training_orders&#39;\nORDER BY ORDINAL_POSITION</code></pre>\n<p>設定 <code>Scheduling</code>：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Run Schedule</code></td><td><code>60 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-2-新增-logattribute\">Step 2：新增 LogAttribute</h3>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>命名或註解成 <code>lab06-1-table-columns-log</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab06-1-table-columns</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-3-連線與執行\">Step 3：連線與執行</h3>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    E[ExecuteSQLRecord lab06-1-table-columns] -- success --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>ExecuteSQLRecord</code> 的 <code>failure</code></li>\n<li><code>lab06-1-table-columns-log</code> 的 <code>success</code></li>\n</ul>\n<p>執行：</p>\n<ol>\n<li>Start <code>lab06-1-table-columns-log</code>。</li>\n<li>Start <code>lab06-1-table-columns</code>。</li>\n<li>等一筆查詢結果送出後，停止 <code>lab06-1-table-columns</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=220 nifi</code></pre>\n<p>你應該看到類似：</p>\n<pre><code class=\"language-csv\">ORDINAL_POSITION,COLUMN_NAME,DATA_TYPE,CHARACTER_MAXIMUM_LENGTH,NUMERIC_PRECISION,NUMERIC_SCALE,IS_NULLABLE\n1,DbId,int,,10,0,NO\n2,order_id,varchar,20,,,YES\n3,customer,varchar,100,,,YES\n4,amount,decimal,,12,2,YES\n5,status,varchar,30,,,YES</code></pre>\n<p>說明：這段是在查資料表 metadata，不是在查業務資料。公司專案常用它來確認來源表欄位名稱、型別、nullable 與欄位順序。</p>\n<h2 id=\"part-5-從來源-db-table-複製資料到目標-db-table\">Part 5：從來源 DB table 複製資料到目標 DB table</h2>\n<h3 id=\"step-1-新增-executesqlrecord-讀來源資料\">Step 1：新增 ExecuteSQLRecord 讀來源資料</h3>\n<p>新增 Processor：<code>ExecuteSQLRecord</code>。</p>\n<p>命名或註解成 <code>lab06-1-read-source-orders</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Connection Pooling Service</code></td><td><code>DBCPConnectionPool-source-nifi-training</code></td></tr>\n<tr><td><code>Record Writer</code></td><td><code>CSVRecordSetWriter-db-result</code></td></tr>\n<tr><td><code>SQL select query</code></td><td>使用下方 SQL</td></tr>\n</tbody>\n</table>\n<pre><code class=\"language-sql\">SELECT\n    order_id,\n    customer,\n    amount,\n    status\nFROM dbo.nifi_training_orders\nORDER BY DbId</code></pre>\n<p>設定 <code>Scheduling</code>：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Run Schedule</code></td><td><code>60 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<p>說明：這裡刻意不查來源表的 <code>DbId</code>，因為目標表有自己的 <code>DbId</code> identity 欄位。跨 DB 複製資料時，不要不經思考就把來源主鍵硬塞到目標表。</p>\n<h3 id=\"step-2-新增-putdatabaserecord-寫入目標-table\">Step 2：新增 PutDatabaseRecord 寫入目標 table</h3>\n<p>新增 Processor：<code>PutDatabaseRecord</code>。</p>\n<p>命名或註解成 <code>lab06-1-write-target-orders</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Record Reader</code></td><td><code>CSVReader-db-result</code></td></tr>\n<tr><td><code>Database Connection Pooling Service</code></td><td><code>DBCPConnectionPool-target-nifi-training-target</code></td></tr>\n<tr><td><code>Database Type</code></td><td><code>MS SQL 2012+</code></td></tr>\n<tr><td><code>Database Name</code></td><td><code>nifi_training_target</code></td></tr>\n<tr><td><code>Schema Name</code></td><td><code>dbo</code></td></tr>\n<tr><td><code>Table Name</code></td><td><code>nifi_training_orders_copy</code></td></tr>\n<tr><td><code>Statement Type</code></td><td><code>INSERT</code></td></tr>\n</tbody>\n</table>\n<p>注意：和 Lab 06 一樣，MSSQL 的 database、schema、table 要分開填。不要把 <code>dbo.nifi_training_orders_copy</code> 全部填到 <code>Table Name</code>。</p>\n<h3 id=\"step-3-新增成功與失敗-logattribute\">Step 3：新增成功與失敗 LogAttribute</h3>\n<p>新增 <code>LogAttribute</code>，命名或註解成 <code>lab06-1-copy-success</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab06-1-copy-success</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>false</code></td></tr>\n</tbody>\n</table>\n<p>新增 <code>LogAttribute</code>，命名或註解成 <code>lab06-1-copy-failure</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab06-1-copy-failure</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-4-連線與-auto-terminate\">Step 4：連線與 Auto-terminate</h3>\n<p>連線：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    R[ExecuteSQLRecord read source] -- success --&gt; P[PutDatabaseRecord write target]\n    R -- failure --&gt; F[LogAttribute copy failure]\n    P -- success --&gt; S[LogAttribute copy success]\n    P -- failure --&gt; F</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>lab06-1-copy-success</code> 的 <code>success</code></li>\n<li><code>lab06-1-copy-failure</code> 的 <code>success</code></li>\n</ul>\n<p>說明：這次不要 auto-terminate <code>PutDatabaseRecord</code> 的 <code>failure</code>。DB 寫入失敗時，先讓 failure path 進 <code>LogAttribute</code>，才能看到 table、欄位、型別或權限錯誤。</p>\n<h3 id=\"step-5-執行與驗證\">Step 5：執行與驗證</h3>\n<ol>\n<li>Start <code>lab06-1-copy-success</code>。</li>\n<li>Start <code>lab06-1-copy-failure</code>。</li>\n<li>Start <code>lab06-1-write-target-orders</code>。</li>\n<li>Start <code>lab06-1-read-source-orders</code>。</li>\n<li>等一筆查詢結果送出後，停止 <code>lab06-1-read-source-orders</code>。</li>\n<li>到 MSSQL 查目標 table：</li>\n</ol>\n<pre><code class=\"language-sql\">USE nifi_training_target;\nGO\n\nSELECT *\nFROM dbo.nifi_training_orders_copy\nORDER BY DbId;</code></pre>\n<p>你應該看到來源 table 的 <code>order_id</code>、<code>customer</code>、<code>amount</code>、<code>status</code> 被寫到目標 table。</p>\n<h2 id=\"練習題\">練習題</h2>\n<h3 id=\"練習-1-只複製特定狀態\">練習 1：只複製特定狀態</h3>\n<p>這一題沿用 Part 5 的 flow。先停止 <code>lab06-1-read-source-orders</code>。</p>\n<p>修改 Processor：<code>lab06-1-read-source-orders</code></p>\n<p>把 SQL 改成：</p>\n<pre><code class=\"language-sql\">SELECT\n    order_id,\n    customer,\n    amount,\n    status\nFROM dbo.nifi_training_orders\nWHERE status = &#39;CANCELLED&#39;\nORDER BY DbId</code></pre>\n<p>重新執行後，查目標 table 是否只新增 <code>CANCELLED</code> 資料。</p>\n<h3 id=\"練習-2-查另一張-table-的欄位-metadata\">練習 2：查另一張 table 的欄位 metadata</h3>\n<p>這一題沿用 Part 4 的 flow。先停止 <code>lab06-1-table-columns</code>。</p>\n<p>修改 <code>SQL select query</code>：</p>\n<pre><code class=\"language-sql\">SELECT\n    TABLE_SCHEMA,\n    TABLE_NAME,\n    ORDINAL_POSITION,\n    COLUMN_NAME,\n    DATA_TYPE,\n    IS_NULLABLE\nFROM INFORMATION_SCHEMA.COLUMNS\nWHERE TABLE_NAME = &#39;nifi_training_orders_copy&#39;\nORDER BY TABLE_SCHEMA, TABLE_NAME, ORDINAL_POSITION</code></pre>\n<p>若你要查目標 database 的 table metadata，記得把 <code>lab06-1-table-columns</code> 的 <code>Database Connection Pooling Service</code> 改成 <code>DBCPConnectionPool-target-nifi-training-target</code>。</p>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<h3 id=\"查不到欄位-metadata\">查不到欄位 metadata</h3>\n<p>現象：</p>\n<ul>\n<li><code>ExecuteSQLRecord</code> 成功，但 log 只有 header 或沒有資料列。</li>\n</ul>\n<p>處理：</p>\n<ol>\n<li>確認 DBCPConnectionPool 連到正確 database。</li>\n<li>確認 <code>TABLE_SCHEMA</code> 與 <code>TABLE_NAME</code> 正確。</li>\n<li>在 SSMS 執行同一段 SQL 確認是否查得到。</li>\n</ol>\n<h3 id=\"putdatabaserecord-找不到目標-table\">PutDatabaseRecord 找不到目標 table</h3>\n<p>現象：</p>\n<pre><code class=\"language-text\">Table dbo.nifi_training_orders_copy not found</code></pre>\n<p>處理：</p>\n<ol>\n<li>確認 <code>nifi_training_target</code> database 已建立。</li>\n<li>確認 <code>dbo.nifi_training_orders_copy</code> table 已建立。</li>\n<li>在 <code>PutDatabaseRecord</code> 分開設定：</li>\n</ol>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Database Name</code></td><td><code>nifi_training_target</code></td></tr>\n<tr><td><code>Schema Name</code></td><td><code>dbo</code></td></tr>\n<tr><td><code>Table Name</code></td><td><code>nifi_training_orders_copy</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"欄位對不上\">欄位對不上</h3>\n<p>現象：</p>\n<ul>\n<li>DB 寫入失敗。</li>\n<li>bulletin 或 log 提到 record field 無法對應 table column。</li>\n</ul>\n<p>處理：</p>\n<ol>\n<li>確認 <code>ExecuteSQLRecord</code> 的 SELECT 欄位名稱和目標 table 欄位名稱一致。</li>\n<li>不要 SELECT 來源表的 <code>DbId</code>，除非目標 table 也有同名欄位且允許寫入。</li>\n<li>確認型別可轉換，例如 <code>amount</code> 可以寫入 <code>DECIMAL(12,2)</code>。</li>\n</ol>\n<h3 id=\"重跑後目標-table-多出重複資料\">重跑後目標 table 多出重複資料</h3>\n<p>原因：</p>\n<ul>\n<li>本 Lab 使用 <code>INSERT</code>，每次執行都會新增資料。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>練習時可先 <code>TRUNCATE TABLE dbo.nifi_training_orders_copy</code>。</li>\n<li>正式專案要評估唯一鍵、upsert、merge 或去重流程。</li>\n</ul>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你知道可以用 <code>ExecuteSQLRecord</code> 查 DB metadata。</li>\n<li>你知道 <code>INFORMATION_SCHEMA.COLUMNS</code> 可以查 table 欄位名稱、型別與 nullable。</li>\n<li>你知道 <code>ExecuteSQLRecord</code> 可以把 DB 查詢結果輸出成 FlowFile records。</li>\n<li>你知道 <code>PutDatabaseRecord</code> 可以把上游 records 寫入另一個 DB table。</li>\n<li>你知道來源 DB 與目標 DB 建議用不同 DBCPConnectionPool 表示清楚。</li>\n<li>你知道複製資料時不要不經思考直接複製來源 identity primary key。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是 database read and copy flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    M[ExecuteSQLRecord 查 metadata] --&gt; ML[LogAttribute]\n    R[ExecuteSQLRecord 讀來源資料] --&gt; W[PutDatabaseRecord 寫目標資料表]\n    W --&gt; DB[(nifi_training_target)]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li><code>ExecuteSQLRecord</code> 可以執行 SQL query。</li>\n<li>查 <code>INFORMATION_SCHEMA.COLUMNS</code> 可以把 table 欄位與型別輸出成 records。</li>\n<li>查業務 table 可以把資料列輸出成 FlowFile records。</li>\n<li><code>PutDatabaseRecord</code> 讀取這些 records，寫到目標 database 的 table。</li>\n<li><code>DBCPConnectionPool</code> 讓來源與目標連線設定清楚分離。</li>\n</ol>\n<p>做完後你要理解：</p>\n<ul>\n<li>NiFi 不只可以寫 DB，也可以讀 DB 查詢結果。</li>\n<li>table schema 可以先查出來再設計 mapping，不要盲目寫入。</li>\n<li>跨 database 複製時，要明確處理來源欄位、目標欄位、identity 欄位與重跑重複資料問題。</li>\n</ul>"
  },

    "id": "07-versioning-debug-operations",
    "file": "07-versioning-debug-operations.md",
    "title": "Lab 07：版本管理、排錯與日常操作",
    "html": "<h1 id=\"lab-07-版本管理-排錯與日常操作\">Lab 07：版本管理、排錯與日常操作</h1>\n<p>目標：建立一套 NiFi 日常維護習慣，包含 Git-based 版本管理、queue 排查、provenance、bulletin、logs 與 Docker volume 注意事項。</p>\n<p>預估時間：60 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<pre><code class=\"language-mermaid\">flowchart TD\n    A[Git-based 版本管理] --&gt; B[Queue 排查]\n    B --&gt; C[Bulletin 排查]\n    C --&gt; D[Provenance 查資料歷程]\n    D --&gt; E[Logs 查系統訊息]\n    E --&gt; F[Docker 啟停與 Volume]</code></pre>\n<p>這一章不是建立新資料轉換流程，而是用前面 Lab 的流程練習日常維護。每個 Part 都會對應公司專案常見的版本管理或排錯入口。</p>\n<h2 id=\"part-1-版本管理觀念\">Part 1：版本管理觀念</h2>\n<p>NiFi UI 上的 flow 會自動保存到 NiFi 的 flow 設定檔；你不需要按 Save。但公司專案不能只依賴單機檔案，應該使用版本管理流程。</p>\n<p>你目前有啟動 NiFi Registry：</p>\n<pre><code class=\"language-text\">http://localhost:18080/nifi-registry</code></pre>\n<p>注意：Apache 官方已公告 NiFi Registry 已 deprecated，NiFi 2 也有 Git-based Flow Registry Clients。若公司專案仍使用 NiFi Registry，先照公司既有流程；若是新專案，建議優先學習 Git-based Flow Registry Clients。</p>\n<p>這裡的 Git-based Flow Registry Clients 指的是 NiFi 本身可設定的 Registry Client，例如 GitHub、GitLab、Bitbucket 或 Azure DevOps 類型。它不是只有「自己寫程式打 NiFi API，然後把 JSON commit 到 Git」這種自訂流程；NiFi UI 的版本控制操作也可以透過這類 Registry Client 把 Process Group 版本保存到 Git 平台。</p>\n<p>兩種做法要分清楚：</p>\n<table>\n<thead><tr><th>做法</th><th>說明</th><th>常見使用方式</th></tr></thead>\n<tbody>\n<tr><td>NiFi UI + Git-based Flow Registry Client</td><td>在 NiFi 設定 Registry Client，對 Process Group 做 version control，底層保存到 Git 平台</td><td>新版 NiFi 建議評估</td></tr>\n<tr><td>NiFi API + Git</td><td>自己寫程式呼叫 NiFi API 匯出 flow definition，再用程式 commit 到 Git</td><td>客製化 CI/CD 或自動化流程</td></tr>\n</tbody>\n</table>\n<p>兩者都可能用到 Git，但第一種是 NiFi 內建版本控制整合；第二種是團隊自行設計的外部自動化流程。</p>\n<h2 id=\"part-2-本機-nifi-registry-版本管理練習\">Part 2：本機 NiFi Registry 版本管理練習</h2>\n<p>這段練習保留給「公司既有專案仍使用 NiFi Registry」的情境。若你是新專案，仍建議看完操作概念後，接著做 Part 3 的 Git-based 練習。</p>\n<ol>\n<li>進入 NiFi Registry。</li>\n<li>建立 bucket，例如 <code>training</code>。</li>\n<li>回到 NiFi UI。</li>\n<li>在 root canvas 或指定 Process Group 設定 Registry Client。</li>\n<li>對 <code>training-lab-03</code> 或 <code>training-lab-04</code> 右鍵，選版本控制相關操作。</li>\n<li>Commit 第一版，訊息輸入：</li>\n</ol>\n<pre><code class=\"language-text\">initial training flow</code></pre>\n<ol>\n<li>修改其中一個 Processor comment。</li>\n<li>觀察 Process Group 是否顯示 locally modified。</li>\n<li>Commit 第二版。</li>\n</ol>\n<p>實務上，commit message 要寫清楚資料流變更意圖，例如：</p>\n<pre><code class=\"language-text\">route cancelled orders to rejection path</code></pre>\n<h2 id=\"part-3-git-based-flow-registry-client-練習\">Part 3：Git-based Flow Registry Client 練習</h2>\n<p>這段是本章最需要學的版本管理主線。你會在 NiFi UI 建立 Git-based Registry Client，然後對一個 Process Group 做 <code>Start version control</code>，讓版本保存到 Git 平台。</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    A[NiFi UI] --&gt; B[Registry Clients]\n    B --&gt; C[GitHub 或 GitLab Flow Registry Client]\n    C --&gt; D[Git Repository]\n    A --&gt; E[Process Group]\n    E -- Start version control --&gt; C\n    E -- Commit local changes --&gt; D</code></pre>\n<p>開始前先準備：</p>\n<ol>\n<li>一個獨立 Git repository，例如 <code>nifi-training-flows</code>。不要直接拿正式專案 repository 練習。</li>\n<li>建立 GitHub repository 時，建議勾選 <code>Add a README file</code>，讓 repository 一開始就有 <code>main</code> branch。</li>\n<li>一個可寫入該 repository 的 token。若你用 GitHub private repository，先照下一段 <code>Step 0</code> 建立 GitHub token。</li>\n<li>先完成前面任一個 Process Group，例如 <code>training-lab-03</code> 或 <code>training-lab-04</code>。</li>\n</ol>\n<p>說明：Git-based Registry Client 是 NiFi 內建的版本控制整合，不是你自己在外面寫程式呼叫 NiFi API。你仍然在 NiFi UI 右鍵 Process Group 做版本控制，只是底層保存位置改成 Git 平台。</p>\n<h3 id=\"step-0-建立-github-personal-access-token\">Step 0：建立 GitHub Personal Access Token</h3>\n<p>如果你使用自己的 GitHub private repository，建議建立 <code>Fine-grained token</code>，不要用 classic token。Fine-grained token 可以限制只能存取指定 repository，練習時比較安全。</p>\n<ol>\n<li>登入 GitHub。</li>\n<li>右上角點你的頭像。</li>\n<li>進入 <code>Settings</code>。</li>\n<li>左側最下面進入 <code>Developer settings</code>。</li>\n<li>進入 <code>Personal access tokens</code> &gt; <code>Fine-grained tokens</code>。</li>\n<li>點 <code>Generate new token</code>。</li>\n<li>設定基本資料：</li>\n</ol>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Token name</code></td><td><code>nifi-training-flow-registry</code></td></tr>\n<tr><td><code>Expiration</code></td><td>練習可選 30 或 90 天</td></tr>\n<tr><td><code>Resource owner</code></td><td>你的 GitHub 帳號</td></tr>\n<tr><td><code>Repository access</code></td><td><code>Only select repositories</code></td></tr>\n<tr><td><code>Selected repositories</code></td><td>你的 private repo，例如 <code>nifi-training-flows</code></td></tr>\n</tbody>\n</table>\n<ol>\n<li>在 <code>Repository permissions</code> 找到 <code>Contents</code>。</li>\n<li>將 <code>Contents</code> 設為 <code>Read and write</code>。</li>\n<li>其他權限先不要開。</li>\n<li>點 <code>Generate token</code>。</li>\n<li>GitHub 只會顯示 token 一次，立刻複製，下一步要貼到 NiFi 的 <code>Personal Access Token</code>。</li>\n</ol>\n<p>說明：NiFi 需要讀取 repository 內容，也需要把 flow version commit 回 repository，所以 <code>Contents</code> 需要 <code>Read and write</code>。token 是敏感資訊，不要寫進課程文件、不要貼在聊天紀錄、不要 commit 到 Git。</p>\n<p>如果你找不到 <code>Contents</code>：</p>\n<ol>\n<li>確認你進的是 <code>Fine-grained tokens</code>，不是 <code>Tokens (classic)</code>。</li>\n<li>確認已設定 <code>Repository access = Only select repositories</code>，並且已選到你的 private repo。</li>\n<li>確認你看的是 <code>Repository permissions</code>，不是 <code>Account permissions</code>。</li>\n<li>若畫面有搜尋框，輸入 <code>contents</code>。</li>\n</ol>\n<h3 id=\"step-1-新增-git-based-registry-client\">Step 1：新增 Git-based Registry Client</h3>\n<ol>\n<li>打開 NiFi UI。</li>\n<li>點右上角 <code>Global Menu</code>。</li>\n<li>進入 <code>Controller Settings</code>。</li>\n<li>切到 <code>Registry Clients</code>。</li>\n<li>按右上角 <code>+</code>。</li>\n<li>依公司使用的平台選一種 type：</li>\n</ol>\n<ul>\n<li>GitHub：<code>GitHubFlowRegistryClient</code></li>\n<li>GitLab：<code>GitLabFlowRegistryClient</code></li>\n<li>Bitbucket：<code>BitbucketFlowRegistryClient</code></li>\n<li>Azure DevOps：<code>AzureDevOpsFlowRegistryClient</code></li>\n</ul>\n<ol>\n<li>名稱建議填：</li>\n</ol>\n<pre><code class=\"language-text\">training-git-flow-registry</code></pre>\n<ol>\n<li>按 <code>Add</code>。</li>\n</ol>\n<p>說明：這一步只是把「NiFi 要連到哪一種 Flow Registry」註冊進 NiFi。真正的 Git repository、branch、token 會在下一步設定。</p>\n<p>本課程目前 Docker 環境已確認有 <code>GitHubFlowRegistryClient</code> 與 <code>GitLabFlowRegistryClient</code>。若你在 UI 搜尋不到 Bitbucket 或 Azure DevOps 類型，先用 GitHub 或 GitLab 完成練習；正式專案再依公司 NiFi image 內實際安裝的 NAR 決定。</p>\n<h3 id=\"step-2-設定-github-或-gitlab-連線\">Step 2：設定 GitHub 或 GitLab 連線</h3>\n<p>如果公司使用 GitHub，常見設定如下：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Authentication Type</code></td><td><code>Personal Access Token</code></td></tr>\n<tr><td><code>Personal Access Token</code></td><td>Step 0 建立的 GitHub token</td></tr>\n<tr><td><code>GitHub API URL</code></td><td><code>https://api.github.com/</code></td></tr>\n<tr><td><code>Repository Owner</code></td><td>repository owner 或 organization</td></tr>\n<tr><td><code>Repository Name</code></td><td>例如 <code>nifi-training-flows</code></td></tr>\n<tr><td><code>Repository Path</code></td><td>例如 <code>flows</code>，也可以留空使用 repository root</td></tr>\n<tr><td><code>Default Branch</code></td><td><code>main</code></td></tr>\n<tr><td><code>Parameter Context Values</code></td><td>練習可先用 <code>RETAIN</code>；正式專案依公司規範</td></tr>\n</tbody>\n</table>\n<p>如果公司使用 GitLab，常見設定如下：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Authentication Type</code></td><td><code>Access Token</code></td></tr>\n<tr><td><code>Access Token</code></td><td>你的 GitLab token</td></tr>\n<tr><td><code>GitLab API URL</code></td><td>GitLab 站台 URL，例如 <code>https://gitlab.com/</code> 或公司 GitLab URL</td></tr>\n<tr><td><code>GitLab API Version</code></td><td><code>V4</code></td></tr>\n<tr><td><code>Repository Namespace</code></td><td>group 或 namespace</td></tr>\n<tr><td><code>Repository Name</code></td><td>例如 <code>nifi-training-flows</code></td></tr>\n<tr><td><code>Repository Path</code></td><td>例如 <code>flows</code>，也可以留空使用 repository root</td></tr>\n<tr><td><code>Default Branch</code></td><td><code>main</code></td></tr>\n<tr><td><code>Parameter Context Values</code></td><td>練習可先用 <code>RETAIN</code>；正式專案依公司規範</td></tr>\n</tbody>\n</table>\n<p>設定後按 <code>Update</code>。</p>\n<p>說明：GitHub 與 GitLab 的欄位名稱不同，所以不要硬套同一組欄位。GitHub 用 <code>Repository Owner</code>，GitLab 用 <code>Repository Namespace</code>。這和 Lab 06 的 MSSQL 設定原則一樣：NiFi UI 有分開提供 property，就依 property 語意分開填。</p>\n<h3 id=\"step-3-把-process-group-納入-git-版本控制\">Step 3：把 Process Group 納入 Git 版本控制</h3>\n<ol>\n<li>回到 canvas。</li>\n<li>找到你已完成的 <code>training-lab-03</code> 或 <code>training-lab-04</code>。</li>\n<li>右鍵該 Process Group。</li>\n<li>選 <code>Version</code> &gt; <code>Start version control</code>。</li>\n<li>在 <code>Registry</code> 選剛剛建立的 <code>training-git-flow-registry</code>。</li>\n<li>選擇或輸入保存位置。若 UI 出現 bucket、folder 或類似欄位，練習可使用 <code>training</code>。</li>\n<li>Flow name 建議填：</li>\n</ol>\n<pre><code class=\"language-text\">training-lab-04-query-record</code></pre>\n<ol>\n<li>Comment 填：</li>\n</ol>\n<pre><code class=\"language-text\">initial git based version</code></pre>\n<ol>\n<li>按 <code>Save</code>。</li>\n</ol>\n<p>說明：NiFi 的版本控制單位是 Process Group，不是單一 Processor。root process group 不能直接納入版本控制，所以練習時要用 <code>training-lab-03</code>、<code>training-lab-04</code> 這類子 Process Group。</p>\n<h3 id=\"step-4-修改-flow-並-commit-第二版\">Step 4：修改 Flow 並 commit 第二版</h3>\n<ol>\n<li>進入剛剛納入版本控制的 Process Group。</li>\n<li>任選一個 Processor，打開設定。</li>\n<li>在 <code>Comments</code> 加上一句：</li>\n</ol>\n<pre><code class=\"language-text\">git based registry training change</code></pre>\n<ol>\n<li>按 <code>Apply</code>。</li>\n<li>回到該 Process Group 外層。</li>\n<li>觀察 Process Group 是否出現 <code>locally modified</code> 狀態。</li>\n<li>右鍵 Process Group。</li>\n<li>選 <code>Version</code> &gt; <code>Commit local changes</code>。</li>\n<li>Comment 填：</li>\n</ol>\n<pre><code class=\"language-text\">document training processor comment change</code></pre>\n<ol>\n<li>按 <code>Save</code> 或 <code>Commit</code>。</li>\n</ol>\n<p>說明：這一步要觀察的是「NiFi UI 有偵測到本地 flow 已經和 Git 裡的版本不同」。正式專案中，commit message 不要只寫 <code>update</code>，要寫清楚改了哪條資料流與改動目的。</p>\n<h3 id=\"step-5-到-git-平台確認結果\">Step 5：到 Git 平台確認結果</h3>\n<ol>\n<li>打開 GitHub 或 GitLab repository。</li>\n<li>查看 commit history。</li>\n<li>確認有 NiFi 產生的 commit。</li>\n<li>查看 <code>Repository Path</code> 對應目錄，例如 <code>flows</code>。</li>\n<li>打開其中的 flow definition 檔案，確認它是 NiFi flow 版本資料，不是你手寫的 SQL 或程式碼。</li>\n</ol>\n<p>說明：你不需要手動編輯這些 flow definition 檔案。日常開發通常是在 NiFi UI 調整 Process Group，再透過 version control commit。是否允許直接改 JSON、是否要走 merge request，要依公司流程決定。</p>\n<p>常見錯誤：</p>\n<ul>\n<li><code>Registry</code> 下拉選不到剛建立的 client：回到 <code>Controller Settings</code> &gt; <code>Registry Clients</code>，確認 client 設定已 <code>Update</code> 且沒有 validation error。</li>\n<li><code>Failed to list buckets: Path [] or Branch [refs/heads/main] not found</code>：通常是 GitHub repository 還是空的，沒有任何 commit，所以 <code>main</code> branch 尚不存在。到 GitHub repo 新增 <code>README.md</code> 並 commit 到 <code>main</code>，或確認 <code>Default Branch</code> 填的是 repo 實際存在的 branch 名稱。</li>\n<li>Token 驗證失敗：確認 token 沒過期，且對 repository 有寫入權限。</li>\n<li>Repository 找不到：確認 <code>Repository Owner</code>、<code>Repository Namespace</code>、<code>Repository Name</code> 沒填反。</li>\n<li>Commit 後 Git 平台沒有變化：確認 <code>Default Branch</code> 與 <code>Repository Path</code>，也確認 NiFi bulletin 是否有 Git API 錯誤。</li>\n<li>不知道該選 GitHub 還是 GitLab：依公司 Git 平台選；公司若是 GitLab，就先練 <code>GitLabFlowRegistryClient</code>。</li>\n</ul>\n<h2 id=\"part-4-queue-排查\">Part 4：Queue 排查</h2>\n<p>當資料卡住時，先看 connection queue。</p>\n<p>排查順序：</p>\n<ol>\n<li>Queue 數量是否增加。</li>\n<li>下游 Processor 是否 stopped、invalid 或 disabled。</li>\n<li>Queue 裡的 FlowFile attributes 是否如預期。</li>\n<li>Content 是否為預期格式。</li>\n<li>是否有 back pressure。</li>\n</ol>\n<p>練習：</p>\n<ol>\n<li>進入已完成的 <code>training-lab-04</code>。</li>\n<li>先確認 <code>training-lab-04</code> 沒有殘留 queue；若有測試資料，先清掉或讓下游處理完。</li>\n<li>修改 Processor：停止接在 <code>large_orders</code> 後面的 <code>LogAttribute</code>。</li>\n<li>保持上游 <code>GenerateFlowFile</code> 和 <code>QueryRecord</code> 可以執行。</li>\n<li>啟動上游一次，或短暫啟動 <code>GenerateFlowFile</code> 後立刻停止。</li>\n<li>觀察 <code>QueryRecord -&gt; LogAttribute</code> 之間的 connection queue 是否出現數字。</li>\n<li>點 connection queue。</li>\n<li>使用 <code>List queue</code> 檢查 FlowFile。</li>\n<li>打開其中一筆 FlowFile，查看 <code>Attributes</code> 與 <code>Content</code>。</li>\n<li>重新啟動下游 <code>LogAttribute</code>。</li>\n<li>確認 queue 被清空。</li>\n</ol>\n<p>這個練習的重點是：資料不是消失，而是停在 connection queue 等待下游 Processor 處理。</p>\n<h2 id=\"part-5-bulletin-排查\">Part 5：Bulletin 排查</h2>\n<p>Processor 右上角出現紅色或黃色提示時，先看 bulletin。</p>\n<p>常見原因：</p>\n<ul>\n<li>Controller Service disabled。</li>\n<li>Relationship 沒處理。</li>\n<li>RecordReader schema 不符合 content。</li>\n<li>SQL 欄位不存在。</li>\n<li>DB 連線失敗。</li>\n<li>權限不足或檔案路徑不存在。</li>\n</ul>\n<p>處理方式：</p>\n<ol>\n<li>點 Processor 上的 bulletin icon。</li>\n<li>複製錯誤關鍵字。</li>\n<li>回到該 Processor 的 Properties 或 Controller Service。</li>\n<li>修正後按 <code>Apply</code>，再觀察 invalid 狀態或 bulletin 是否消失；若仍 invalid，將滑鼠移到警告圖示上查看 validation errors。</li>\n</ol>\n<h2 id=\"part-6-provenance-排查\">Part 6：Provenance 排查</h2>\n<p>Data Provenance 用來回答「這筆資料到底經過哪些處理」。</p>\n<p>操作：</p>\n<ol>\n<li>從右上角 Global Menu 開啟 <code>Data Provenance</code>。</li>\n<li>查最近幾分鐘事件。</li>\n<li>點某筆 event 的 details。</li>\n<li>看三個重點：</li>\n</ol>\n<ul>\n<li><code>Details</code>：事件類型、component、時間。</li>\n<li><code>Attributes</code>：FlowFile metadata 在此步驟前後是否變化。</li>\n<li><code>Content</code>：必要時查看或下載內容。</li>\n</ul>\n<ol>\n<li>用 lineage 看資料流經過的路徑。</li>\n</ol>\n<p>實務用途：</p>\n<ul>\n<li>確認資料是否真的進入某個 Processor。</li>\n<li>比對轉換前後 content。</li>\n<li>查某筆資料在哪一步失敗。</li>\n<li>重放資料做修正驗證。</li>\n</ul>\n<h2 id=\"part-7-docker-日常操作\">Part 7：Docker 日常操作</h2>\n<p>目前專案已使用 named volumes 保存 NiFi/Registry 資料。</p>\n<p>日常啟停：</p>\n<pre><code class=\"language-powershell\">docker compose stop\ndocker compose start</code></pre>\n<p>可以重建 container，但不要刪 volume：</p>\n<pre><code class=\"language-powershell\">docker compose down\ndocker compose up -d</code></pre>\n<p>不要執行：</p>\n<pre><code class=\"language-powershell\">docker compose down -v\ndocker volume prune</code></pre>\n<p>因為 <code>-v</code> 和 volume prune 可能移除資料 volume。</p>\n<p>確認 volume 掛載：</p>\n<pre><code class=\"language-powershell\">docker inspect nifi-service --format &#39;{{range .Mounts}}{{.Destination}} -&gt; {{.Name}}{{println}}{{end}}&#39;</code></pre>\n<h2 id=\"part-8-看-logs\">Part 8：看 logs</h2>\n<p>NiFi：</p>\n<pre><code class=\"language-powershell\">docker compose logs --tail=200 nifi</code></pre>\n<p>Registry：</p>\n<pre><code class=\"language-powershell\">docker compose logs --tail=200 nifi-registry</code></pre>\n<p>跟隨 logs：</p>\n<pre><code class=\"language-powershell\">docker compose logs -f nifi</code></pre>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你能解釋 queue、bulletin、provenance、logs 各自適合查什麼。</li>\n<li>你知道 NiFi flow 會自動保存，但公司專案仍需要版本管理。</li>\n<li>你知道如何在 NiFi UI 新增 Git-based Flow Registry Client。</li>\n<li>你知道 Git-based 版本控制的單位是 Process Group，不是單一 Processor。</li>\n<li>你知道日常啟停用 <code>stop/start</code>，不要刪 volume。</li>\n<li>你知道 Registry 在 NiFi 2.x 的長期方向需要依公司策略確認。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 不是建立單一資料處理 flow，而是建立 NiFi 的維護與排錯習慣。</p>\n<p>整體重點是：</p>\n<pre><code class=\"language-mermaid\">flowchart TD\n    A[Flow 需要版本管理] --&gt; B[Git-based Registry Client 保存版本]\n    B --&gt; C[資料卡住要看 Queue]\n    C --&gt; D[錯誤提示先看 Bulletin]\n    D --&gt; E[資料歷程查 Provenance]\n    E --&gt; F[系統層問題查 Logs]\n    F --&gt; G[Docker 啟停要保留 Volume]</code></pre>\n<p>這個 Lab 模擬公司專案的日常維運情境：流程已經存在，但你需要知道誰改了 flow、資料卡在哪、哪一步失敗、是否可以安全重啟容器。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li>NiFi UI 上的 flow 會保存，但團隊協作仍需要版本管理。</li>\n<li>Git-based Flow Registry Client 是 NiFi UI 版本控制操作的 Git backend。</li>\n<li>Queue 是資料卡住時的第一個觀察點。</li>\n<li>Bulletin 是 Processor 即時錯誤提示。</li>\n<li>Provenance 是追查單筆資料流向的主要工具。</li>\n<li>Docker named volume 是保護本機 NiFi 設定與 state 的關鍵。</li>\n</ul>"
  },

    "title": "Lab 08：Processor 排程與執行控制",
    "html": "<h1 id=\"lab-08-processor-排程與執行控制\">Lab 08：Processor 排程與執行控制</h1>\n<p>目標：理解 NiFi Processor 的 <code>Scheduling</code> 分頁，能設定固定間隔排程、CRON 排程、併發數與執行節點策略。</p>\n<p>預估時間：45 分鐘。</p>\n<h2 id=\"你會做出什麼\">你會做出什麼</h2>\n<p>本 Lab 會建立兩條小流程：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    TS[Timer driven Scheduler] --&gt; TG[GenerateFlowFile]\n    TG --&gt; TU[UpdateAttribute]\n    TU --&gt; TL[LogAttribute]\n    CS[CRON driven Scheduler] --&gt; CG[GenerateFlowFile]\n    CG --&gt; CU[UpdateAttribute]\n    CU --&gt; CL[LogAttribute]</code></pre>\n<p>第一條用固定間隔執行；第二條用 CRON 表達式模擬公司常見的批次排程。</p>\n<h2 id=\"官方確認的排程概念\">官方確認的排程概念</h2>\n<p>NiFi 官方 User Guide 說明 Processor 的 <code>Scheduling</code> 分頁包含：</p>\n<ul>\n<li><code>Scheduling Strategy</code></li>\n<li><code>Concurrent Tasks</code></li>\n<li><code>Run Schedule</code></li>\n<li><code>Execution</code></li>\n<li><code>Run Duration</code></li>\n</ul>\n<p><code>Timer driven</code> 是預設模式，依 <code>Run Schedule</code> 固定間隔執行。<code>CRON driven</code> 也是週期性執行，但用 CRON 表達式提供更精細的時間控制。</p>\n<p>官方文件也說明 <code>CRON driven</code> 的排程字串包含 6 個必要欄位與 1 個選用欄位：</p>\n<pre><code class=\"language-text\">Seconds Minutes Hours Day-of-Month Month Day-of-Week Year(optional)</code></pre>\n<p>來源：https://nifi.apache.org/nifi-docs/user-guide.html</p>\n<h2 id=\"part-1-建立-process-group\">Part 1：建立 Process Group</h2>\n<p>建立 <code>training-lab-08</code>，進入該 Process Group。</p>\n<h2 id=\"part-2-timer-driven-固定間隔排程\">Part 2：Timer Driven 固定間隔排程</h2>\n<h3 id=\"step-1-新增-generateflowfile\">Step 1：新增 GenerateFlowFile</h3>\n<p>新增 Processor：<code>GenerateFlowFile</code>。</p>\n<p>設定 <code>Properties</code>：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Custom Text</code></td><td><code>timer driven test</code></td></tr>\n</tbody>\n</table>\n<p>設定 <code>Scheduling</code>：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Scheduling Strategy</code></td><td><code>Timer driven</code></td></tr>\n<tr><td><code>Run Schedule</code></td><td><code>30 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-2-新增-updateattribute\">Step 2：新增 UpdateAttribute</h3>\n<p>新增 Processor：<code>UpdateAttribute</code>。</p>\n<p>新增 dynamic properties：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>schedule.type</code></td><td><code>timer</code></td></tr>\n<tr><td><code>schedule.fired.at</code></td><td><code>${now():format(&quot;yyyy-MM-dd HH:mm:ss&quot;)}</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-3-新增-logattribute\">Step 3：新增 LogAttribute</h3>\n<p>新增 Processor：<code>LogAttribute</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab08-timer</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>true</code></td></tr>\n</tbody>\n</table>\n<h3 id=\"step-4-連線\">Step 4：連線</h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; U[UpdateAttribute]\n    U -- success --&gt; L[LogAttribute]</code></pre>\n<p>Auto-terminate：</p>\n<ul>\n<li><code>LogAttribute</code> 的 <code>success</code></li>\n</ul>\n<h3 id=\"step-5-執行與觀察\">Step 5：執行與觀察</h3>\n<ol>\n<li>啟動三個 Processor。</li>\n<li>等 1 至 2 次排程觸發。</li>\n<li>停止 <code>GenerateFlowFile</code>。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=160 nifi</code></pre>\n<p>你應該看到 <code>lab08-timer</code> 與 <code>schedule.fired.at</code>。</p>\n<h2 id=\"part-3-cron-driven-指定時間排程\">Part 3：CRON Driven 指定時間排程</h2>\n<h3 id=\"step-1-複製第一條流程\">Step 1：複製第一條流程</h3>\n<ol>\n<li>先確認 Part 2 的 <code>GenerateFlowFile</code> 已停止。</li>\n<li>複製 Part 2 的三個 Processor。</li>\n<li>貼到同一個 Process Group 旁邊。</li>\n<li>新貼上的 Processor 先保持 stopped，等本 Part 設定完成後再啟動。</li>\n<li>將新的 <code>LogAttribute</code> 的 <code>Log Prefix</code> 改成：</li>\n</ol>\n<pre><code class=\"language-text\">lab08-cron</code></pre>\n<ol>\n<li>將新的 <code>UpdateAttribute</code> 裡 <code>schedule.type</code> 改成：</li>\n</ol>\n<pre><code class=\"language-text\">cron</code></pre>\n<h3 id=\"step-2-設定-cron\">Step 2：設定 CRON</h3>\n<p>打開第二個 <code>GenerateFlowFile</code> 的 <code>Scheduling</code>。</p>\n<p>設定：</p>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Scheduling Strategy</code></td><td><code>CRON driven</code></td></tr>\n<tr><td><code>Run Schedule</code></td><td><code>0/30 * * * * ?</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<p>這個 CRON 表達式代表每 30 秒觸發一次，適合練習觀察。正式公司排程不建議用這麼密。</p>\n<p>常見範例：</p>\n<table>\n<thead><tr><th>需求</th><th>NiFi CRON</th></tr></thead>\n<tbody>\n<tr><td>每 30 秒</td><td><code>0/30 * * * * ?</code></td></tr>\n<tr><td>每 5 分鐘</td><td><code>0 0/5 * * * ?</code></td></tr>\n<tr><td>每天凌晨 1 點</td><td><code>0 0 1 * * ?</code></td></tr>\n<tr><td>每週一到週五 14:20</td><td><code>0 20 14 ? * MON-FRI</code></td></tr>\n</tbody>\n</table>\n<p>注意：NiFi 使用的 CRON 有秒欄位，和 Linux crontab 常見的 5 欄格式不同。</p>\n<h3 id=\"step-3-執行與觀察\">Step 3：執行與觀察</h3>\n<ol>\n<li>啟動第二條流程。</li>\n<li>等 CRON 觸發。</li>\n<li>查看 log：</li>\n</ol>\n<pre><code class=\"language-powershell\">docker compose logs --tail=220 nifi</code></pre>\n<ol>\n<li>停止第二個 <code>GenerateFlowFile</code>。</li>\n</ol>\n<h2 id=\"part-4-concurrent-tasks-併發數\">Part 4：Concurrent Tasks 併發數</h2>\n<p><code>Concurrent Tasks</code> 控制 Processor 同時使用多少執行緒處理資料。提高此值可能增加吞吐量，但也會消耗更多系統資源，並可能讓下游壓力變大。</p>\n<p>練習：</p>\n<ol>\n<li>建立新的 Processor：<code>GenerateFlowFile</code>。</li>\n<li>建立新的 Processor：<code>LogAttribute</code>。</li>\n<li>設定 <code>GenerateFlowFile</code>：</li>\n</ol>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Custom Text</code></td><td><code>concurrent test</code></td></tr>\n</tbody>\n</table>\n<ol>\n<li>設定 <code>LogAttribute</code>：</li>\n</ol>\n<table>\n<thead><tr><th>Property</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Log Prefix</code></td><td><code>lab08-concurrent</code></td></tr>\n<tr><td><code>Log Payload</code></td><td><code>false</code></td></tr>\n</tbody>\n</table>\n<ol>\n<li>連線：</li>\n</ol>\n<pre><code class=\"language-mermaid\">flowchart LR\n    G[GenerateFlowFile] -- success --&gt; L[LogAttribute]</code></pre>\n<ol>\n<li>將 <code>LogAttribute</code> 的 <code>success</code> auto-terminate。</li>\n<li>將 <code>GenerateFlowFile</code> 設定為：</li>\n</ol>\n<table>\n<thead><tr><th>Setting</th><th>Value</th></tr></thead>\n<tbody>\n<tr><td><code>Scheduling Strategy</code></td><td><code>Timer driven</code></td></tr>\n<tr><td><code>Run Schedule</code></td><td><code>0 sec</code></td></tr>\n<tr><td><code>Concurrent Tasks</code></td><td><code>1</code></td></tr>\n</tbody>\n</table>\n<ol>\n<li>啟動 <code>LogAttribute</code>。</li>\n<li>啟動 <code>GenerateFlowFile</code>，等待 5 秒後停止。</li>\n<li>觀察 connection queue、Processor stats 或 log 數量。</li>\n<li>清空這條練習 connection 的 queue，避免上一輪資料影響比較。</li>\n<li>修改 Processor：<code>GenerateFlowFile</code>。</li>\n<li>將 <code>Concurrent Tasks</code> 改成 <code>2</code>。</li>\n<li>再啟動 5 秒後停止。</li>\n<li>比較 queue、Processor stats 或 log 數量。</li>\n<li>查看 log，觀察 <code>lab08-concurrent</code> 的輸出順序是否比 <code>Concurrent Tasks = 1</code> 更密集，也可能出現不同 FlowFile 的 log 交錯。</li>\n</ol>\n<p>這個練習要觀察兩件事：</p>\n<ol>\n<li><code>Concurrent Tasks = 2</code> 代表這個 Processor 最多可以同時有 2 個 task 被 NiFi 排程執行，所以 log 輸出速度可能明顯變快。</li>\n<li>併發後不應期待 log 或資料處理順序完全固定，因為不同 task 可能同時處理不同 FlowFile。</li>\n</ol>\n<pre><code class=\"language-mermaid\">flowchart LR\n    Q[Connection Queue] --&gt; T1[Task 1 處理 FlowFile A]\n    Q --&gt; T2[Task 2 處理 FlowFile B]\n    T1 --&gt; L[LogAttribute]\n    T2 --&gt; L</code></pre>\n<p>結論：<code>0 sec</code> 代表盡可能執行，不適合作為新手練習或低頻公司批次排程的預設值。<code>Concurrent Tasks</code> 可以提高吞吐量，但也會讓同一個 Processor 有多個 task 同時工作。</p>\n<h3 id=\"race-condition-與併行風險\">Race condition 與併行風險</h3>\n<p>Race condition 是指多個 task 同時操作同一份外部資源或同一個邏輯狀態，結果取決於誰先執行、誰後執行，導致資料結果不穩定。</p>\n<p>在 NiFi 裡，<code>Concurrent Tasks</code> 調高後，不代表一定會出錯；但只要 Processor 會碰到共享資源，就要先評估。</p>\n<table>\n<thead><tr><th>情境</th><th>可能問題</th><th>建議</th></tr></thead>\n<tbody>\n<tr><td><code>LogAttribute</code> 只輸出 log</td><td>log 順序交錯，但通常不影響資料正確性</td><td>練習可用 <code>2</code> 觀察效果</td></tr>\n<tr><td>寫同一張 DB table</td><td>duplicate key、lock、交易順序不符合預期</td><td>先用 <code>1</code>，確認 key、upsert、交易策略後再調高</td></tr>\n<tr><td>呼叫同一個外部 API</td><td>rate limit、重複送出、回應順序不同</td><td>先確認 API 是否支援並行與重試</td></tr>\n<tr><td>寫同一個檔案或固定檔名</td><td>檔案覆蓋、檔名衝突</td><td>使用唯一檔名或維持 <code>Concurrent Tasks = 1</code></td></tr>\n<tr><td>流程依賴資料順序</td><td>先後順序不穩定</td><td>不要調高，或重新設計成不依賴順序</td></tr>\n<tr><td>Stateful Processor 或自訂 Script</td><td>多 task 可能同時讀寫狀態</td><td>確認 Processor 文件與程式是否 thread-safe</td></tr>\n</tbody>\n</table>\n<p>簡單判斷：</p>\n<pre><code class=\"language-text\">只是轉換、路由、觀察 log -&gt; 可以小幅提高並觀察\n會寫 DB、寫檔、呼叫 API、依賴順序 -&gt; 先維持 1</code></pre>\n<p>公司專案不要只因為「調高後比較快」就直接把 <code>Concurrent Tasks</code> 加大。正確做法是先找瓶頸，再確認來源與目標系統可以承受並行。</p>\n<h2 id=\"part-5-run-duration\">Part 5：Run Duration</h2>\n<p><code>Run Duration</code> 是延遲與吞吐量的取捨：</p>\n<ul>\n<li>越偏低延遲：每次觸發後較快交棒給下游。</li>\n<li>越偏高吞吐：每次觸發做更多工作後再更新 repository。</li>\n</ul>\n<p>入門階段建議先維持預設值。只有在資料量大、確認瓶頸後，再調整。</p>\n<h2 id=\"part-6-execution-與-primary-node\">Part 6：Execution 與 Primary Node</h2>\n<p>如果 NiFi 是 cluster，<code>Execution</code> 會影響 Processor 在哪些節點執行：</p>\n<table>\n<thead><tr><th>Execution</th><th>意義</th></tr></thead>\n<tbody>\n<tr><td><code>All Nodes</code></td><td>每個節點都會執行</td></tr>\n<tr><td><code>Primary Node</code></td><td>只在 Primary Node 執行</td></tr>\n</tbody>\n</table>\n<p>公司常見判斷：</p>\n<ul>\n<li>讀取共用 DB 或共用 API 的排程，常需要避免多節點重複抓資料。</li>\n<li>若是 cluster 且來源不支援多節點並行，應評估 <code>Primary Node</code>。</li>\n<li>若每個節點處理各自本機資料，才可能使用 <code>All Nodes</code>。</li>\n</ul>\n<p>目前你的本機 Docker 是單節點環境，這一段先理解概念即可。</p>\n<h2 id=\"part-7-公司專案排程檢查清單\">Part 7：公司專案排程檢查清單</h2>\n<p>新增或修改排程前，先確認：</p>\n<ul>\n<li>排程是固定間隔還是指定時間點。</li>\n<li>是否允許重疊執行。</li>\n<li>上一次還沒跑完時，下一次觸發要怎麼處理。</li>\n<li><code>Concurrent Tasks</code> 是否會造成重複讀取、重複寫入或資料競爭。</li>\n<li>Processor 是否會寫同一份共享資源，例如同一張 DB table、同一個 API endpoint、同一個檔案路徑。</li>\n<li>流程是否依賴資料順序；若依賴順序，不要隨意提高 <code>Concurrent Tasks</code>。</li>\n<li>來源系統是否有 rate limit。</li>\n<li>目標系統是否能承受尖峰寫入。</li>\n<li>失敗資料要重試、告警、還是進錯誤佇列。</li>\n<li>是否需要用 attribute 記錄批次時間，例如 <code>batch.date</code>、<code>batch.id</code>。</li>\n<li>CRON 時區是否符合公司排程約定。</li>\n</ul>\n<h2 id=\"常見錯誤\">常見錯誤</h2>\n<h3 id=\"排程太密\">排程太密</h3>\n<p>現象：</p>\n<ul>\n<li>queue 快速累積。</li>\n<li>CPU 或 disk IO 上升。</li>\n<li>下游 DB/API 開始 timeout。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>拉長 <code>Run Schedule</code>。</li>\n<li>降低 <code>Concurrent Tasks</code>。</li>\n<li>加上 back pressure。</li>\n<li>先確認下游瓶頸再調整。</li>\n</ul>\n<h3 id=\"cron-格式錯誤\">CRON 格式錯誤</h3>\n<p>現象：</p>\n<ul>\n<li>Processor invalid。</li>\n<li><code>Run Schedule</code> 顯示格式錯誤。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>確認 NiFi CRON 是 6 欄起跳，第一欄是 seconds。</li>\n<li>不要直接貼 Linux crontab 的 5 欄格式。</li>\n</ul>\n<h3 id=\"多節點重複執行\">多節點重複執行</h3>\n<p>現象：</p>\n<ul>\n<li>公司排程本來一天一批，結果 cluster 每個節點都跑一次。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>檢查 <code>Execution</code>。</li>\n<li>對只應執行一次的排程，評估 <code>Primary Node</code>。</li>\n</ul>\n<h3 id=\"調高-concurrent-tasks-後資料結果不穩定\">調高 Concurrent Tasks 後資料結果不穩定</h3>\n<p>現象：</p>\n<ul>\n<li>log 順序和預期不同。</li>\n<li>DB 出現 duplicate key 或 lock timeout。</li>\n<li>API 收到重複請求。</li>\n<li>同一批資料有時成功、有時失敗。</li>\n</ul>\n<p>處理：</p>\n<ul>\n<li>先將 <code>Concurrent Tasks</code> 調回 <code>1</code>，確認問題是否消失。</li>\n<li>檢查 Processor 是否寫入共享資源。</li>\n<li>檢查資料是否依賴處理順序。</li>\n<li>若要提高併發，先設計唯一 key、idempotent 寫入、重試策略與下游限流。</li>\n</ul>\n<h2 id=\"完成檢查\">完成檢查</h2>\n<ul>\n<li>你能設定 <code>Timer driven</code> 固定間隔排程。</li>\n<li>你能設定 <code>CRON driven</code> 指定時間排程。</li>\n<li>你知道 NiFi CRON 和 Linux crontab 欄位數不同。</li>\n<li>你知道 <code>Concurrent Tasks</code> 會影響併發與資源使用。</li>\n<li>你知道提高 <code>Concurrent Tasks</code> 可能造成 race condition 或順序不穩定。</li>\n<li>你知道 cluster 下 <code>Execution</code> 可能造成多節點重複執行。</li>\n<li>你知道公司排程要考慮重疊執行、下游承載與錯誤處理。</li>\n</ul>\n<h2 id=\"本-lab-的學習重點回顧\">本 Lab 的學習重點回顧</h2>\n<p>這個 Lab 建立的是排程觸發 flow：</p>\n<pre><code class=\"language-mermaid\">flowchart LR\n    S[NiFi Scheduler] --&gt; G[GenerateFlowFile]\n    G --&gt; U[UpdateAttribute]\n    U --&gt; L[LogAttribute]</code></pre>\n<p>整個流程的意思是：</p>\n<ol>\n<li>NiFi Scheduler 根據 Processor 的 <code>Scheduling</code> 設定觸發 Processor。</li>\n<li><code>Timer driven</code> 用固定間隔觸發，例如每 30 秒。</li>\n<li><code>CRON driven</code> 用指定時間規則觸發，例如每天凌晨 1 點。</li>\n<li><code>Concurrent Tasks</code> 決定同一個 Processor 可以同時跑幾個執行緒。</li>\n<li><code>Concurrent Tasks</code> 提高後，吞吐量可能增加，但也可能帶來 race condition、重複寫入或順序不穩定。</li>\n<li>在 cluster 環境中，<code>Execution</code> 會影響是所有節點都跑，還是只有 Primary Node 跑。</li>\n</ol>\n<p>這個 Lab 模擬公司專案常見情境：每天固定時間拉資料、每幾分鐘輪詢 API、或定期把資料寫入資料庫。</p>\n<p>做完後你要理解：</p>\n<ul>\n<li>排程不是獨立服務，而是每個 Processor 自己有 Scheduling 設定。</li>\n<li><code>Run Schedule</code> 太密會讓資料和 queue 快速累積。</li>\n<li><code>Concurrent Tasks</code> 不是越高越好；只要流程碰到共享資源或資料順序，就要先評估併行安全。</li>\n<li>公司批次排程常用 <code>CRON driven</code>，但 NiFi CRON 和 Linux crontab 格式不同。</li>\n<li>在 cluster 上，如果沒有處理 <code>Execution</code>，可能發生多節點重複執行。</li>\n</ul>"
  },
